<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grok Bot — demo simulation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   GROK BOT — design system (variables CSS)
   :root = thème A (dashboard verre) · .theme-b = mobile sombre · .theme-c = mobile clair
   Unité : 1rem = --u px (A : largeur/960 ; B/C : largeur du cadre/540), recalculée en JS
   ========================================================= */
:root{
  --u:1px;
  --a-bg:#0a0d18; --a-text:#f2f4fb; --a-label:#8c94a9; --a-dim:#5d667c; --a-head:#9aa3b8;
  --a-win:#34e8a0; --a-loss:#ff5c75; --a-exec:#5aa5ff; --a-scan:#8d8ef7; --a-warn:#f6b73c; --a-brand:#b66dff;
  --demo:#f6b73c; --live:#34e8a0;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  --outfit:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --inter:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
.theme-b{
  --bg:#0b0c0f; --card:#14161b; --line:rgba(255,255,255,.07); --sheet:#15171c; --handle:#3a3e47;
  --text:#ffffff; --sub:#8b919c; --pos:#2fd47f; --neg:#ff5d73; --buy:#5aa9ff; --sell:#2fd47f;
  --btn:#1f9d55; --cta-bg:#f2f2f2; --cta-fg:#000; --mul-bg:#f4f4f4; --mul-fg:#000;
  --dpill-bg:#12301f; --dpill-fg:#3ddc97; --pill:rgba(255,255,255,.06); --curve:#2fd47f; --shadow:none;
  --tile:rgba(255,255,255,.04); --toast:rgba(30,32,38,.92); --amber:#f2b84b; --chipbg:#14161b; --tag:rgba(255,255,255,.07);
}
.theme-c{
  --bg:#f5f6f8; --card:#ffffff; --line:#ececf0; --sheet:#ffffff; --handle:#d6d8de;
  --text:#0b0b0f; --sub:#8a8f99; --pos:#16a34a; --neg:#e5484d; --buy:#3b6fe8; --sell:#16a34a;
  --btn:#1fa854; --cta-bg:#0d0d10; --cta-fg:#fff; --mul-bg:#0d0d10; --mul-fg:#fff;
  --dpill-bg:#e3f6e8; --dpill-fg:#16a34a; --pill:rgba(0,0,0,.05); --curve:#16a34a; --shadow:0 1px 2px rgba(0,0,0,.04);
  --tile:#f3f4f6; --toast:rgba(255,255,255,.92); --amber:#c98a10; --chipbg:#ffffff; --tag:#f0f1f4;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--a-bg);font-family:var(--outfit);-webkit-font-smoothing:antialiased;color:var(--a-text)}
body[data-scene=gmgn]{background:radial-gradient(120vmax 80vmax at 50% 0%,#15171d,#060708)}
body[data-scene=meme]{background:radial-gradient(120vmax 80vmax at 50% 0%,#eef1f5,#d9dee5)}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene.on{display:block}
.mono{font-family:var(--mono)}

/* ---------- pastilles d'état DEMO / LIVE / PAPER (communes) ---------- */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--live);flex:none}
.dot.demo{background:var(--demo)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.72);opacity:.55}}
.paper-badge{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:2px 5px;border-radius:5px;background:rgba(90,165,255,.18);color:#8cc2ff;border:1px solid rgba(90,165,255,.4)}
.theme-c .paper-badge{background:#e8efff;color:#3b6fe8;border-color:#bfd0fb}

/* =========================================================
   SCÈNE A — dashboard « verre » 4:3 (référence 960 × 720)
   ========================================================= */
#sceneA .glows{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#sceneA .glow{position:absolute;border-radius:50%;will-change:transform}
#sceneA .g1{width:80vmax;height:80vmax;left:-30vmax;top:-34vmax;background:radial-gradient(closest-side,rgba(48,96,255,.28),transparent);animation:drift1 20s ease-in-out infinite}
#sceneA .g2{width:70vmax;height:70vmax;right:-30vmax;top:5vmax;background:radial-gradient(closest-side,rgba(200,50,90,.22),transparent);animation:drift2 20s ease-in-out infinite}
#sceneA .g3{width:80vmax;height:70vmax;left:15vmax;bottom:-40vmax;background:radial-gradient(closest-side,rgba(130,70,220,.20),transparent);animation:drift3 20s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(6vmax,4vmax)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5vmax,6vmax)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(4vmax,-5vmax)}}

.a-board{position:absolute;left:50%;top:50%;width:960rem;height:720rem;margin-left:-480rem;margin-top:-360rem;padding:16rem;display:flex;flex-direction:column;justify-content:space-between}
.glass{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(8,12,24,.70));border:1px solid rgba(255,255,255,.10);border-radius:18rem;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.a-lbl{font-family:var(--mono);font-size:9rem;letter-spacing:.12em;text-transform:uppercase;color:var(--a-label)}

/* en-tête */
.a-head{height:74rem;display:flex;justify-content:space-between;align-items:flex-start}
.a-brand{display:flex;flex-direction:column}
.a-pill{height:46rem;width:268rem;border:1px solid rgba(255,255,255,.12);border-radius:999rem;display:flex;align-items:center;gap:10rem;padding:0 18rem 0 4rem;background:rgba(255,255,255,.025)}
.a-pill .logo{width:38rem;height:38rem;flex:none}
.a-word{font-family:var(--outfit);font-weight:700;font-size:34rem;letter-spacing:.01em;line-height:1;color:#fff;white-space:nowrap}
.a-word b{color:var(--a-brand);font-weight:700}
.a-mode{margin:8rem 0 0 70rem;font-family:var(--mono);font-size:12rem;letter-spacing:.12em;color:#9aa3b8;text-transform:uppercase}
.a-right{display:flex;flex-direction:column;align-items:flex-end}
.a-live{height:46rem;min-width:74rem;padding:0 14rem;border:1px solid rgba(255,255,255,.12);border-radius:999rem;display:flex;align-items:center;justify-content:center;gap:8rem;font-family:var(--mono);font-size:12rem;color:#fff;letter-spacing:.06em;background:rgba(255,255,255,.025)}
.a-live .dot{width:10rem;height:10rem}
.a-live .paper-badge{font-size:8rem;padding:2rem 5rem;border-radius:5rem}
.a-tasks{margin-top:8rem;font-family:var(--mono);font-size:12rem;color:#dfe3ef;letter-spacing:.04em}
.a-tasks span{color:var(--a-label)}

/* cartes de chiffres */
.a-stats{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:72rem 72rem;gap:8rem}
.a-stat{padding:12rem 18rem;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.a-stat.bar::before{content:'';position:absolute;left:0;top:14rem;bottom:14rem;width:3rem;border-radius:0 3rem 3rem 0;background:var(--bc)}
.a-val{font-family:var(--outfit);font-weight:700;font-size:28rem;line-height:1.1;color:#fff;margin:3rem 0 2rem;transition:color .6s}
.a-val.green{color:var(--a-win)}
.a-sub{font-family:var(--mono);font-size:10rem;color:var(--a-label)}
.flash-up{color:var(--a-win)!important;transition:none!important}
.flash-down{color:var(--a-loss)!important;transition:none!important}
.a-wr{flex-direction:row;align-items:center;justify-content:flex-start;gap:16rem}
.a-ring{position:relative;width:50rem;height:50rem;flex:none}
.a-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.a-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--outfit);font-weight:700;font-size:14rem;color:#fff}
.a-wrtext{display:flex;flex-direction:column;gap:3rem}
.a-wrtext .w{font-family:var(--mono);font-size:11rem;color:var(--a-win)}
.a-wrtext .l{font-family:var(--mono);font-size:11rem;color:var(--a-loss)}
.a-closed{position:absolute;right:16rem;bottom:10rem;font-family:var(--mono);font-size:10rem;color:var(--a-label)}

/* rangée du milieu */
.a-mid{display:grid;grid-template-columns:512rem 1fr;gap:8rem;height:276rem}
.a-card{padding:14rem;overflow:hidden}
.a-ch{display:flex;justify-content:space-between;align-items:center;height:16rem}
.a-title{font-family:var(--mono);font-size:11rem;color:#fff;letter-spacing:.12em;text-transform:uppercase}
.a-meta{font-family:var(--mono);font-size:10rem;color:var(--a-label);letter-spacing:.06em}
.a-chart{display:block;width:484rem;height:224rem;margin-top:8rem;overflow:visible}
.a-chart text{font-family:var(--mono);font-size:10px;fill:var(--a-label)}
.a-chart .cur{font-family:var(--outfit);font-weight:600;font-size:15px;fill:var(--a-win);paint-order:stroke;stroke:rgba(10,13,24,.85);stroke-width:4px}
.a-chart .ring{transform-box:fill-box;transform-origin:center;animation:ringgrow 1.6s ease-out infinite}
@keyframes ringgrow{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}

.a-pipe{position:relative;height:66rem;margin-top:10rem}
.a-prow{position:absolute;left:0;right:0;top:0;height:22rem;display:flex;align-items:center;transition:transform .25s ease,opacity .25s ease}
.a-prow .tk{width:70rem;font-family:var(--mono);font-size:11rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}
.a-dots{display:flex;gap:8rem;align-items:center}
.pd{position:relative;width:9rem;height:9rem;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.pd.ok{background:var(--a-win);border-color:var(--a-win)}
.pd.fail{background:var(--a-loss);border-color:var(--a-loss)}
.pd.na{border:1px dashed rgba(255,255,255,.35);opacity:.8}
.pd.run{border:1.5px solid rgba(90,165,255,.35)}
.pd.run::after{content:'';position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--a-exec);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.a-prow .st{margin-left:auto;font-family:var(--mono);font-size:9rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.st.chk{color:var(--a-exec)} .st.rej{color:var(--a-loss)} .st.pass{color:var(--a-win)} .st.na{color:var(--a-label)}
.a-sep{height:1px;background:rgba(255,255,255,.08);margin:8rem 0 6rem}
.a-feed{position:relative;height:138rem;overflow:hidden}
.a-line{position:absolute;left:0;right:0;top:0;height:17rem;line-height:15rem;font-family:var(--mono);font-size:10rem;color:#dfe3ef;white-space:pre;overflow:hidden;text-overflow:ellipsis;padding:0 6rem;border:1px solid transparent;border-radius:6rem;transition:transform .25s ease,opacity .25s ease}
.a-line.big{background:rgba(52,232,160,.10);border-color:rgba(52,232,160,.45)}
.a-line .tag{font-weight:600}
.tag.SCAN{color:var(--a-scan)} .tag.EXEC{color:var(--a-exec)} .tag.FILL,.tag.BIG{color:var(--a-win)} .tag.WARN,.tag.RISK{color:var(--a-warn)} .tag.LOSS{color:var(--a-loss)} .tag.PAPER{color:#8cc2ff}

/* objectif journalier */
.a-daily{height:20rem;display:flex;align-items:center;gap:14rem}
.a-daily .lab{font-family:var(--mono);font-size:11rem;color:var(--a-label);letter-spacing:.12em;white-space:nowrap}
.a-track{flex:1;height:8rem;border-radius:99rem;background:rgba(255,255,255,.08);overflow:hidden}
.a-fill{height:100%;width:100%;border-radius:99rem;background:linear-gradient(90deg,#2dd4bf,#34e8a0);transform-origin:left center;transform:scaleX(0);transition:transform .6s ease}
.a-daily .pct{font-family:var(--mono);font-size:11rem;color:var(--a-win);width:36rem;text-align:right}

/* rangée des 6 agents */
.a-agents{display:flex;gap:12rem;height:98rem}
.a-tile{flex:1;border-radius:16rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9rem;transition:box-shadow .35s,background .35s}
.a-tile .bar{position:absolute;top:12rem;left:12rem;width:22rem;height:4rem;border-radius:2rem;background:var(--c)}
.a-tile .tint{position:absolute;inset:0;border-radius:16rem;background:var(--c);opacity:0;transition:opacity .35s}
.a-tile.on .tint{opacity:.14}
.a-tile.on{box-shadow:inset 0 0 0 1.5px var(--c),0 0 18rem color-mix(in srgb,var(--c) 25%,transparent)}
.a-tile .nm{position:relative;font-family:var(--outfit);font-weight:700;font-size:17rem;letter-spacing:.06em;text-transform:uppercase;color:#9aa3b8;transition:color .35s}
.a-tile.on .nm{color:#fff}
.orb{position:relative;width:36rem;height:36rem;border-radius:50%;background:radial-gradient(circle at 32% 26%,#ffffff 0%,color-mix(in srgb,var(--c) 45%,#fff) 16%,var(--c) 52%,color-mix(in srgb,var(--c) 55%,#000) 100%);box-shadow:0 7rem 10rem -5rem rgba(0,0,0,.7),0 2rem 6rem rgba(0,0,0,.3);transition:transform .35s}
.orb::before,.orb::after{content:'';position:absolute;top:50%;width:3rem;height:6rem;margin-top:-3rem;border-radius:2rem;background:#0a0b10}
.orb::before{left:calc(50% - 5rem)} .orb::after{left:calc(50% + 2rem)}
.a-tile.on .orb{animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1.06)}50%{transform:scale(1.0)}}
.a-replay{position:absolute;left:50%;top:calc(50% - 300rem);transform:translate(-50%,0);padding:14rem 28rem;border-radius:999rem;border:1px solid rgba(255,255,255,.2);background:rgba(10,13,24,.8);color:#fff;font-family:var(--mono);font-size:14rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.a-replay.show{opacity:1;pointer-events:auto}

/* =========================================================
   SCÈNES B et C — cadre de téléphone (référence 540 de large)
   ========================================================= */
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:var(--fw);height:var(--fh);border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--outfit);isolation:isolate}
.phone.theme-b{box-shadow:0 0 0 9px #111216,0 0 0 10px #2b2d33,0 30px 90px rgba(0,0,0,.6)}
.phone.theme-c{box-shadow:0 0 0 9px #1a1b1e,0 0 0 10px #3d3f45,0 30px 70px rgba(0,0,0,.22)}
body.mobile .phone{border-radius:0;box-shadow:none}
.scr{position:absolute;inset:0;opacity:0;visibility:hidden;will-change:opacity}
.phone.theme-c .scr.inset{top:70rem}

/* barre d'état iPhone (C) */
.sbar{position:absolute;left:0;right:0;top:0;height:70rem;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:6rem 38rem 0 46rem;font-family:var(--inter);font-weight:600;font-size:23rem;color:#0b0b0f;pointer-events:none}
.island{position:absolute;left:50%;top:14rem;width:166rem;height:47rem;margin-left:-83rem;border-radius:999rem;background:#000}
.sb-r{display:flex;align-items:center;gap:8rem}
.bars{display:flex;align-items:flex-end;gap:2.5rem;height:16rem}
.bars i{display:block;width:4.5rem;border-radius:1.5rem;background:#0b0b0f}
.lte{font-size:17rem;font-weight:700}
.batt{min-width:38rem;height:21rem;border-radius:7rem;background:#0b0b0f;color:#fff;font-size:13rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5rem}
.homebar{position:absolute;left:50%;bottom:10rem;width:186rem;height:7rem;margin-left:-93rem;border-radius:99rem;background:#0b0b0f;z-index:60;pointer-events:none}

/* icônes, logo, robots, avatars */
.logo{display:block}
.av{display:inline-flex;align-items:center;justify-content:center;width:26rem;height:26rem;border-radius:50%;color:#fff;font-family:var(--inter);font-weight:700;font-size:13rem;flex:none;vertical-align:middle}
.av.sm{width:22rem;height:22rem;font-size:11rem}
.robot{display:block;flex:none}

/* --- écran 1 : dossier --- */
.s1{overflow:hidden}
.s1 .wall{position:absolute;inset:-40rem}
.theme-b .s1 .wall{background:radial-gradient(60% 40% at 30% 20%,#5a2328 0%,transparent 70%),radial-gradient(50% 40% at 80% 70%,#3a1a22 0%,transparent 70%),linear-gradient(180deg,#2a1416,#0b0b0d)}
.theme-c .s1 .wall{background:radial-gradient(60% 40% at 25% 25%,#d6efe2 0%,transparent 70%),radial-gradient(50% 40% at 80% 75%,#d9e4f3 0%,transparent 70%),linear-gradient(180deg,#e8f3ee,#e6edf5)}
.fold-title{position:absolute;left:44rem;top:130rem;font-size:40rem;font-weight:700;letter-spacing:-.01em}
.theme-b .fold-title{color:#fff}.theme-c .fold-title{color:#000}
.fold-panel{position:absolute;left:44rem;right:44rem;top:206rem;padding:34rem 22rem 14rem;border-radius:46rem;display:grid;grid-template-columns:repeat(3,1fr);row-gap:26rem;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.theme-b .fold-panel{background:rgba(255,255,255,.12)}
.theme-c .fold-panel{background:rgba(255,255,255,.55);box-shadow:0 8rem 30rem rgba(0,0,0,.06)}
.app{display:flex;flex-direction:column;align-items:center;gap:9rem}
.app .ic{width:104rem;height:104rem;border-radius:26rem;display:flex;align-items:center;justify-content:center;font-family:var(--inter);font-weight:700;font-size:34rem;color:#fff;box-shadow:0 2rem 6rem rgba(0,0,0,.18);will-change:transform}
.app .ic .logo{width:104rem;height:104rem}
.app .nm{font-family:var(--inter);font-size:15rem;font-weight:500;white-space:nowrap}
.theme-b .app .nm{color:#f1f1f3}.theme-c .app .nm{color:#1b1c20}
.zoomer{position:absolute;border-radius:26rem;background:#161616;z-index:5;opacity:0;will-change:transform,opacity;display:flex;align-items:center;justify-content:center}
.theme-c .zoomer{background:#0d0d10}

/* --- écran 2 : terminal --- */
.s2 .boot{position:absolute;left:0;right:0;top:110rem;display:flex;flex-direction:column;align-items:center}
.boot-logo{width:90rem;height:90rem;border-radius:26rem;will-change:transform}
.theme-b .boot-logo{box-shadow:0 0 60rem rgba(61,220,151,.16)}
.theme-c .boot-logo{width:190rem;height:190rem;border-radius:50rem;box-shadow:0 18rem 40rem rgba(0,0,0,.18)}
.boot-title{margin-top:26rem;font-family:var(--outfit);font-weight:700;font-size:44rem;letter-spacing:-.01em}
.boot-pill{margin-top:12rem;padding:6rem 14rem;border-radius:8rem;background:var(--pill);color:var(--sub);font-family:var(--mono);font-size:15rem}
.term{margin-top:46rem;width:452rem;font-family:var(--mono);font-size:13rem;will-change:opacity}
.term .cmd{color:var(--sub);margin-bottom:12rem}
.term .ln{display:flex;align-items:center;gap:10rem;height:26rem;will-change:transform,opacity}
.term .ok{color:var(--pos);font-weight:700}
.term .rp{color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term .rv{color:var(--amber)}
.prog{margin:22rem auto 0;width:260rem;height:4rem;border-radius:99rem;background:var(--pill);overflow:hidden}
.prog i{display:block;height:100%;width:100%;background:#fff;transform-origin:left center;transform:scaleX(0)}
.theme-c .prog i{background:#0b0b0f}
.prog-l{margin-top:8rem;text-align:center;font-family:var(--mono);font-size:12rem;color:var(--sub)}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

/* --- feuilles (bottom sheets) --- */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:32rem 32rem 0 0;padding:12rem 30rem 34rem;will-change:transform;transform:translateY(105%)}
.theme-c .sheet{box-shadow:0 -10rem 40rem rgba(0,0,0,.1)}
.handle{width:36rem;height:4rem;border-radius:99rem;background:var(--handle);margin:0 auto 22rem}
.link-row{display:flex;align-items:center;justify-content:center;gap:16rem;margin-bottom:18rem}
.link-row .ic48{width:48rem;height:48rem;border-radius:14rem;display:flex;align-items:center;justify-content:center;overflow:hidden}
.link-row .ic48 .logo{width:48rem;height:48rem}
.brandpill{height:48rem;padding:0 16rem;border-radius:14rem;display:flex;align-items:center;font-family:var(--inter);font-weight:700;font-size:16rem;color:#fff}
.dashes{display:flex;gap:6rem}
.dashes i{display:block;width:12rem;height:4rem;border-radius:2rem;background:var(--dc);will-change:opacity}
.sh-title{text-align:center;font-family:var(--outfit);font-weight:700;font-size:28rem}
.sh-sub{text-align:center;color:var(--sub);font-size:17rem;margin-top:6rem}
.info{margin-top:20rem;border-radius:18rem;background:var(--tile);border:1px solid var(--line)}
.info .r{display:flex;justify-content:space-between;align-items:center;padding:13rem 18rem;font-size:15rem;gap:10rem}
.info .r+.r{border-top:1px solid var(--line)}

class Num {
  constructor(el, paint, opts = {}) { this.el = el; this.paint = paint; this.cur = null; this.from = 0; this.to = 0; this.t0 = 0; this.fl = 0; this.flashEl = opts.flashEl || el; this.thr = opts.thr ?? 0; Num.all.push(this); }
  set(v, flash = true) {
    if (this.cur === null || Number.isNaN(this.cur)) { this.cur = this.from = this.to = v; this.paint(this.el, v); return; }
    if (v === this.to) return;
    const now = performance.now();
    const up = v > this.to;
    const big = Math.abs(v - this.to) > Math.abs(this.to) * this.thr;
    this.from = this.cur; this.to = v; this.t0 = now;
    /* clignote à chaque hausse/baisse notable, au plus une fois toutes les 0,9 s */
    if (flash && big && !REDUCED && now - (this.lastFl || 0) > 900) { this.lastFl = now; this.flashEl.classList.toggle('flash-up', up); this.flashEl.classList.toggle('flash-down', !up); this.fl = now + 600; }
  }
  snap(v) { this.cur = this.from = this.to = v; this.fl = 0; this.flashEl.classList.remove('flash-up', 'flash-down'); this.paint(this.el, v); }
  step(now) {
    if (this.cur !== this.to) {
      const f = U.clamp((now - this.t0) / 400);
      this.cur = f >= 1 ? this.to : U.lerp(this.from, this.to, U.easeOut(f));
      this.paint(this.el, this.cur);
    }
    if (this.fl && now > this.fl) { this.fl = 0; this.flashEl.classList.remove('flash-up', 'flash-down'); }
  }
}

/* Script d'une session mobile (B ou C) : interpolation exponentielle + bruit, passant par les clés */
class Session {
  constructor(cfg, sim, seed) {
    this.cfg = cfg; this.sim = sim; this.seed = seed;
    const r = U.rng(seed);
    this.keys = cfg.keys.map(k => k.slice());
    if (sim) {
      /* SIM : génération aléatoire pondérée dans les mêmes ordres de grandeur */
      for (let i = 1; i < this.keys.length; i++) {
        const o = cfg.keys[i], p = cfg.keys[i - 1], k = this.keys[i];
        const ratio = Math.max(.86, (o[2] / p[2]) * U.rr(r(), .9, 1.13));
        k[2] = +(this.keys[i - 1][2] * ratio).toFixed(2);
        k[3] = null;
        const share = o[5] / Math.max(1, o[5] + o[6]);
        const closed = o[5] + o[6];
        let w = Math.round(closed * U.clamp(share * U.rr(r(), .94, 1.04), .55, 1));
        w = Math.max(w, this.keys[i - 1][5]); let l = Math.max(closed - w, this.keys[i - 1][6]);
        k[5] = w; k[6] = l; k[4] = Math.max(o[4], w + l);
      }
    }
    this.phase = r() * 100;
    /* corrections de la pastille Δ30 pour passer exactement par les valeurs du tableau */
    this.corr = [];
    this.keys.forEach(k => { if (k[3] !== null && k[3] !== undefined && k[0] > 0) this.corr.push([k[0], k[3] - (this.eqRaw(k[0]) - this.eqRaw(Math.max(0, k[0] - 30)))]); });
    if (!this.corr.length) this.corr.push([0, 0]);
    this.corr.unshift([0, this.corr[0][1]]);
  }
  /* équité à x minutes : interpolation exponentielle entre deux clés, bruit ± 0,4 % nul aux clés */
  eqRaw(x) {
    const { i, f } = U.seg(this.keys, x);
    const a = this.keys[i][2], b = this.keys[i + 1][2];
    const base = a * Math.pow(b / a, f);
    return base * (1 + .004 * U.noise(x / 6, this.phase + i) * Math.sin(Math.PI * f));
  }
  eq(x) { return this.eqRaw(x); }
  col(x, c) { return U.keyLin(this.keys, c, x); }
  delta(x) {
    const raw = this.eqRaw(x) - this.eqRaw(Math.max(0, x - 30));
    if (this.sim) return raw;
    const ck = this.corr; let corr;
    if (x >= ck[ck.length - 1][0]) corr = ck[ck.length - 1][1];
    else { const { i, f } = U.seg(ck, x); corr = U.lerp(ck[i][1], ck[i + 1][1], f); }
    return raw + corr;
  }
  final() { return this.keys[this.keys.length - 1]; }
}

/* DexScreener (sans clé), au plus 1 requête par seconde. Portefeuille virtuel : aucune transaction réelle. */
const Paper = {
  on: false, queue: [], busy: false, lastReq: 0, nextProfiles: 0, nextPrice: 0,
  pool: new Map(), evalQ: [], seen: new Set(), events: [], seq: 0,
  stats: { tasks: 0, resolved: 0, evals: 0, calls: [0, 0, 0] },
  wallets: {}, stakes: { A: 38, B: 110, C: 81 },
  API_PROFILES: 'https://api.dexscreener.com/token-profiles/latest/v1',
  API_SEARCH: 'https://api.dexscreener.com/latest/dex/search?q=',
  start() { this.on = true; this.nextProfiles = 0; this.nextPrice = performance.now() + 4000; },
  stop() { this.on = false; this.queue = []; this.busy = false; },
  wallet(k) {
    if (!this.wallets[k]) this.wallets[k] = { stake: this.stakes[k], cash: this.stakes[k], pos: [], trades: 0, wins: 0, losses: 0, start: Date.now(), hist: [[Date.now(), this.stakes[k]]], best: null, worst: null };
    return this.wallets[k];
  },
  equity(w) { return w.cash + w.pos.reduce((s, p) => s + p.usd * ((p.last || p.entry) / p.entry), 0); },
  push(ev) { ev.seq = ++this.seq; ev.ms = Date.now(); this.events.push(ev); if (this.events.length > 300) this.events.shift(); },
  since(seq) { return this.events.filter(e => e.seq > seq); },
  enqueue(kind, arg) { if (this.queue.some(j => j.kind === kind && j.arg === arg)) return; this.queue.push({ kind, arg }); },
  tick(nowMs, key) {
    if (!this.on) return;
    if (nowMs >= this.nextProfiles) { this.nextProfiles = nowMs + 30000; this.enqueue('profiles'); }
    const w = this.wallet(key);
    if (nowMs >= this.nextPrice) {
      this.nextPrice = nowMs + 5000;
      if (w.pos.length) { const p = w.pos.reduce((a, b) => ((a.chk || 0) <= (b.chk || 0) ? a : b)); p.chk = nowMs; this.enqueue('price', p.addr); }
    }
    if (!this.queue.length && this.evalQ.length) this.enqueue('eval', this.evalQ.shift());
    /* file vide : réévalue un token déjà connu (données fraîches), toujours ≤ 1 requête/s */
    if (!this.queue.length && !this.evalQ.length && this.pool.size && nowMs - this.lastReq >= 1500) {
      const held = new Set(w.pos.map(p => p.addr)); const list = [...this.pool.keys()].filter(a => !held.has(a));
      if (list.length) { this.rr = ((this.rr || 0) + 1) % list.length; this.enqueue('eval', list[this.rr]); }
    }
    if (!this.busy && this.queue.length && nowMs - this.lastReq >= 1100) this.run(this.queue.shift(), key);
  },
  async get(url) {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 8000);
    try { const r = await fetch(url, { signal: ctl.signal, headers: { Accept: 'application/json' } }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
    finally { clearTimeout(tm); }
  },
  bestPair(json, addr) {
    const pairs = (json && json.pairs || []).filter(p => p.chainId === 'solana' && (!addr || (p.baseToken && p.baseToken.address === addr)));
    pairs.sort((a, b) => ((b.liquidity && b.liquidity.usd) || 0) - ((a.liquidity && a.liquidity.usd) || 0));
    return pairs[0] || null;
  },
  toToken(addr, p) {
    return { addr, sym: '$' + ((p.baseToken && p.baseToken.symbol) || 'TOKEN').replace(/^\$+/, '').slice(0, 12), price: +p.priceUsd || 0,
      liq: (p.liquidity && p.liquidity.usd) ?? null, vol5: (p.volume && p.volume.m5) ?? null, h1: (p.priceChange && p.priceChange.h1) ?? null,
      created: p.pairCreatedAt || null, at: Date.now() };
  },
  /* « agents » = modules de règles JavaScript (pas de vrais modèles d'IA) */
  score(t) {
    const liq = t.liq || 0, vol = t.vol5 || 0, h1 = t.h1 ?? 0, ageMin = t.created ? (Date.now() - t.created) / 60000 : null;
    let s = .35 * Math.min(1, liq / 150000) + .35 * Math.min(1, vol / 20000);
    s += .2 * (h1 > 0 && h1 < 300 ? Math.min(1, h1 / 50) : 0);
    s += .1 * (ageMin !== null && ageMin > 15 && ageMin < 2880 ? 1 : 0);
    return s;
  },
  async run(job, key) {
    this.busy = true; this.lastReq = performance.now();
    try {
      if (job.kind === 'profiles') {
        const data = await this.get(this.API_PROFILES);
        const sol = (Array.isArray(data) ? data : []).filter(d => d.chainId === 'solana' && d.tokenAddress);
        let fresh = 0;
        sol.forEach(d => { if (!this.seen.has(d.tokenAddress) && this.evalQ.length < 8) { this.seen.add(d.tokenAddress); this.evalQ.push(d.tokenAddress); fresh++; } });
        const k = [...this.pool.values()].filter(t => (t.liq || 0) > 26000).length;
        this.push({ kind: 'scan', n: sol.length, k, fresh });
        this.stats.tasks += sol.length;
      } else if (job.kind === 'eval') {
        const json = await this.get(this.API_SEARCH + encodeURIComponent(job.arg));
        const p = this.bestPair(json, job.arg);
        this.stats.evals++; this.stats.resolved++;
        if (!p) { this.push({ kind: 'eval', sym: '$' + job.arg.slice(0, 4), stages: ['fail', 'idle', 'idle', 'idle'], why: 'nopair' }); this.stats.tasks += 1; return; }
        const t = this.toToken(job.arg, p); this.pool.set(t.addr, t);
        const lp = t.liq !== null && t.liq >= 26000 ? 'ok' : 'fail';
        const sc = this.score(t);
        const buy = lp === 'ok' ? (sc >= .5 ? 'ok' : 'fail') : 'idle';
        /* LOCK et DEV : aucune donnée publique fiable → « n/a », jamais inventé */
        const stages = [lp, lp === 'ok' ? 'na' : 'idle', lp === 'ok' ? 'na' : 'idle', buy];
        this.stats.tasks += 4; this.stats.calls[2] += 2; this.stats.calls[0] += 2;
        this.push({ kind: 'eval', sym: t.sym, stages, tok: t, score: sc });
        if (buy === 'ok' && !this.wallet(key).pos.some(q => q.addr === t.addr)) this.buy(key, t, sc);
      } else if (job.kind === 'price') {
        const json = await this.get(this.API_SEARCH + encodeURIComponent(job.arg));
        const p = this.bestPair(json, job.arg);
        if (p) { const t = this.toToken(job.arg, p); this.pool.set(t.addr, t); this.update(key, t); }
        this.stats.tasks += 1;
      }
    } catch (e) { this.fail(e); }
    finally { this.busy = false; }
  },
  buy(key, t, sc) {
    const w = this.wallet(key); const eqv = this.equity(w);
    if (w.pos.length >= 5 || !t.price) return;
    const usd = Math.min(eqv * 0.10, w.cash); /* max 10% per trade */
    if (usd < 0.5) return;
    w.cash -= usd; w.trades++;
    w.pos.push({ addr: t.addr, sym: t.sym, entry: t.price, last: t.price, usd, at: Date.now() });
    this.stats.calls[1] += 1;
    this.push({ kind: 'buy', key, sym: t.sym, usd, price: t.price, detail: `score ${sc.toFixed(2)} · liq $${Math.round((t.liq || 0) / 1000)}k` });
  },
  update(key, t) {
    const w = this.wallet(key);
    w.pos.slice().forEach(p => {
      if (p.addr !== t.addr) return;
      p.last = t.price;
      const r = p.last / p.entry - 1, age = (Date.now() - p.at) / 60000;
      let why = null;
      if (r <= -0.08) why = 'stop -8%'; else if (r >= 0.20) why = 'take profit'; else if (age > 12) why = 'time exit';
      if (why) {
        const pnl = p.usd * r; w.cash += p.usd + pnl; w.pos.splice(w.pos.indexOf(p), 1);
        if (pnl >= 0) w.wins++; else w.losses++;
        if (!w.best || pnl > w.best[1]) w.best = [p.sym, pnl];
        if (!w.worst || pnl < w.worst[1]) w.worst = [p.sym, pnl];
        this.stats.calls[1] += 1;
        this.push({ kind: 'sell', key, sym: p.sym, pnl, why });
      }
    });
  },
  fail() { if (!this.on) return; this.stop(); if (typeof App !== 'undefined') App.paperFailed(); },
  reset() { this.wallets = {}; this.events = []; this.pool.clear(); this.seen.clear(); this.evalQ = []; this.stats = { tasks: 0, resolved: 0, evals: 0, calls: [0, 0, 0] }; },
};

    el.innerHTML = `<span class="tag ${tag}">[${tag}]</span> ${U.esc(text)}`;
    el.style.transform = 'translateY(-17rem)'; el.style.opacity = '0';
    this.r.feed.prepend(el);
    s.feed.unshift({ el, born: s.t });
    void el.offsetWidth;
    s.feed.forEach((l, i) => { if (i < 8) { l.el.style.transform = `translateY(${i * 17}rem)`; l.el.style.opacity = '1'; } });
    while (s.feed.length > 8) {
      const old = s.feed.pop(); old.el.style.opacity = '0'; old.el.style.transform = 'translateY(136rem)';
      setTimeout(() => old.el.remove(), 260);
    }
  },

  /* ---------- pipeline LP → LOCK → DEV → BUY ---------- */
  newToken(tk, out, extra) { return { id: ++this.s.uid, tk, out, st: ['idle', 'idle', 'idle', 'idle'], cur: 0, at: null, done: false, doneAt: 0, status: '', stCls: 'chk', extra }; },
  rollToken() {
    const s = this.s, r = s.rng, P = DATA.A.pass; const out = []; let failed = false;
    for (let i = 0; i < 4; i++) { if (failed) { out.push('idle'); continue; } const ok = r() < P[i]; out.push(ok ? 'ok' : 'fail'); if (!ok) failed = true; }
    return this.newToken(U.pick(DATA.A.tickers, r()), out);
  },
  pipeEnter(tok) {
    const el = document.createElement('div'); el.className = 'a-prow';
    el.innerHTML = `<div class="tk">${U.esc(tok.tk)}</div><div class="a-dots"><span class="pd"></span><span class="pd"></span><span class="pd"></span><span class="pd"></span></div><div class="st chk"></div>`;
    el.style.transform = 'translateY(66rem)'; el.style.opacity = '0';
    this.r.pipe.appendChild(el); tok.el = el; tok.dots = [...el.querySelectorAll('.pd')]; tok.stEl = el.querySelector('.st');
    tok.at = this.s.t; tok.cur = 0; tok.status = U.tpl(T.a.checking, { s: T.a.stages[0] }); tok.stCls = 'chk';
    void el.offsetWidth;
  },
  pipeStep(tok) {
    const s = this.s, r = s.rng, S = T.a.stages;
    const i = tok.cur; const res = tok.out[i];
    tok.st[i] = res;
    if (res === 'fail') {
      tok.done = true; tok.doneAt = s.t; tok.status = U.tpl(T.a.rejected, { s: S[i] }); tok.stCls = 'rej';
      if (s.mode === 'PAPER') {
        const t = tok.extra && tok.extra.tok;
        if (i === 0) this.addLine('RISK', U.tpl(T.a.riskPaper, { t: tok.tk, l: t ? Math.round((t.liq || 0) / 1000) : 'n/a' }));
        else this.addLine('WARN', U.tpl(T.a.warnPaper, { t: tok.tk, s: tok.extra ? (tok.extra.score || 0).toFixed(2) : 'n/a' }));
      } else if (r() < .55) this.addLine('WARN', U.tpl(T.a.warn, { t: tok.tk, n: U.ri(r(), 5, 22) }));
      else this.addLine('RISK', U.tpl(T.a.risk, { t: tok.tk, n: U.ri(r(), 10, 120) }));
      return;
    }
    if (i === 3) {
      tok.done = true; tok.doneAt = s.t; tok.status = T.a.passed; tok.stCls = 'pass';
      if (s.mode !== 'PAPER') {
        const sol = U.rr(r(), 2, 12).toFixed(2), p = (U.rr(r(), .00008, .0009)).toFixed(5);
        this.addLine('EXEC', U.tpl(T.a.exec, { sol, t: tok.tk, p }));
        s.recent.push(tok.tk); if (s.recent.length > 6) s.recent.shift();
        if (s.mode === 'SIM') s.closes.push({ at: s.t + U.rr(r(), 2, 5), tk: tok.tk });
      }
      return;
    }
    tok.cur = i + 1; tok.at = s.t;
    const nx = tok.out[tok.cur];
    tok.status = nx === 'na' ? U.tpl(T.a.naStep, { s: S[tok.cur] }) : U.tpl(T.a.checking, { s: S[tok.cur] });
    tok.stCls = nx === 'na' ? 'na' : 'chk';
  },
  updatePipe() {
    const s = this.s;
    /* remplit jusqu'à 3 lignes visibles */
    while (s.pipe.filter(p => !p.leaving).length < 3) {
      let tok = s.pq.shift();
      if (!tok) { if (s.mode === 'PAPER') break; tok = this.rollToken(); }
      this.pipeEnter(tok); s.pipe.push(tok);
    }
    s.pipe.forEach(tok => {
      if (tok.leaving) return;
      if (!tok.done && s.t - tok.at >= .5) this.pipeStep(tok);
      if (tok.done && s.t - tok.doneAt >= .6) {
        tok.leaving = true; tok.leaveAt = s.t;
        tok.el.style.transform = 'translateY(-22rem)'; tok.el.style.opacity = '0';
        const el = tok.el; setTimeout(() => el.remove(), 260);
      }
    });
    s.pipe = s.pipe.filter(p => !(p.leaving && s.t - p.leaveAt > .26));
    let k = 0;
    s.pipe.forEach(tok => {
      if (tok.leaving) return;
      U.css(tok.el, 'transform', `translateY(${k * 22}rem)`); U.css(tok.el, 'opacity', '1'); k++;
      tok.dots.forEach((d, i) => {
        const st = (!tok.done && i === tok.cur && tok.out[i] !== 'na') ? 'run' : (!tok.done && i === tok.cur ? 'na' : tok.st[i]);
        const c = 'pd' + (st === 'idle' ? '' : ' ' + st);
        if (d._c !== c) { d._c = c; d.className = c; }
      });
      U.text(tok.stEl, tok.status);
      const sc = 'st ' + tok.stCls; if (tok.stEl._c !== sc) { tok.stEl._c = sc; tok.stEl.className = sc; }
    });
  },

  /* ---------- mise à jour (dt en secondes de scène) ---------- */
  update(dt) {
    const s = this.s, D = DATA.A, r = s.rng;
    if (s.ended) return;
    s.t += dt;
    if (s.mode !== 'PAPER' && s.t >= D.endT) { s.t = D.endT; s.ended = true; }
    const t = s.t;

    if (s.mode === 'REPLAY') {
      const K = D.keys;
      s.bal = this.balAt(t);
      s.wins = Math.floor(U.keyLin(K, 3, t)); s.losses = Math.floor(U.keyLin(K, 4, t));
      s.tasks = U.keyLin(K, 5, t); s.resolved = U.keyLin(K, 6, t); s.elapsed = U.keyLin(K, 1, t);
      s.subDays = K[U.seg(K, t).f >= 1 ? K.length - 1 : U.seg(K, t).i][7];
      /* événements BIG */
      let bigNow = 0;
      while (s.bigI < D.bigs.length && t >= D.bigs[s.bigI][0]) {
        const g = D.bigs[s.bigI++];
        this.addLine('BIG', U.tpl(T.a.big, { t: g[1], x: g[2].toFixed(1), a: U.fmt(g[3], 2) }), true);
        s.bigDots.push([U.keyLin(K, 1, g[0]), this.balAt(g[0] - .001)]); bigNow++;
      }
      /* lignes FILL / LOSS dérivées des compteurs scriptés (au plus une toutes les 0,6 s) */
      if (s.wins > s.prevW) {
        const n = s.wins - s.prevW - bigNow; s.prevW = s.wins;
        if (n > 0 && t - s.lastFill > .6) { s.lastFill = t; const tk = s.recent.shift() || U.pick(D.tickers, r()); this.addLine('FILL', U.tpl(T.a.fill, { t: tk, a: U.rr(r(), 12, 90).toFixed(2) })); }
      }
      if (s.losses > s.prevL) { s.prevL = s.losses; const tk = U.pick(D.tickers, r()); this.addLine('LOSS', U.tpl(T.a.loss, { t: tk, a: U.rr(r(), 4, 30).toFixed(2) })); }
    } else if (s.mode === 'SIM') {
      const K = D.keys;
      s.tasks += 44 * dt; s.resolved += 4.3 * dt; s.elapsed = U.keyLin(K, 1, t);
      s.subDays = Math.max(2, Math.round(30 - 28 * (s.elapsed - K[0][1]) / (D.maxElapsed - K[0][1])));
      while (s.bigI < s.simBigs.length && t >= s.simBigs[s.bigI][0]) {
        const g = s.simBigs[s.bigI++];
        this.addLine('BIG', U.tpl(T.a.big, { t: g[1], x: g[2].toFixed(1), a: U.fmt(g[3], 2) }), true);
        s.bigDots.push([s.elapsed, s.bal]); s.jumps.push({ t0: t, amt: g[3], done: 0 }); s.wins++;
      }
      s.jumps.forEach(j => { const p = U.clamp((t - j.t0) / .7); const step = p >= 1 ? 1 : Math.floor(p * 5) / 5; const add = j.amt * step - j.done; s.bal += add; j.done += add; });
      s.jumps = s.jumps.filter(j => j.done < j.amt - 1e-9);
      s.closes = s.closes.filter(c => {
        if (t < c.at) return true;
        if (r() < .83) { const a = U.rr(r(), 12, 90); s.bal += a; s.wins++; this.addLine('FILL', U.tpl(T.a.fill, { t: c.tk, a: a.toFixed(2) })); }
        else { const a = U.rr(r(), 4, 30); s.bal -= a; s.losses++; this.addLine('LOSS', U.tpl(T.a.loss, { t: c.tk, a: a.toFixed(2) })); }
        return false;
      });
    } else {
      /* PAPER : tout vient du portefeuille virtuel */
      const w = Paper.wallet('A');
      Paper.since(s.paperSeq).forEach(ev => {
        s.paperSeq = ev.seq;
        if (ev.kind === 'scan') this.addLine('SCAN', U.tpl(T.a.scanPaper, { n: ev.n, k: ev.k }));
        else if (ev.kind === 'eval') { if (s.pq.length < 6) s.pq.push(this.newToken(ev.sym, ev.stages, { tok: ev.tok, score: ev.score })); }
        else if (ev.kind === 'buy' && ev.key === 'A') this.addLine('EXEC', U.tpl(T.a.execPaper, { usd: U.usd(ev.usd), t: ev.sym, p: ev.price < 1 ? ev.price.toPrecision(3) : ev.price.toFixed(4) }));
        else if (ev.kind === 'sell' && ev.key === 'A') { if (ev.pnl >= 0) this.addLine('FILL', U.tpl(T.a.fill, { t: ev.sym, a: ev.pnl.toFixed(2) }) + ' · ' + ev.why); else this.addLine('LOSS', U.tpl(T.a.loss, { t: ev.sym, a: Math.abs(ev.pnl).toFixed(2) }) + ' · ' + ev.why); }
      });
      s.bal = Paper.equity(w); s.wins = w.wins; s.losses = w.losses; s.tasks = Paper.stats.tasks; s.resolved = Paper.stats.resolved;
      s.elapsed = Math.min(D.maxElapsed, (Date.now() - w.start) / 1000); s.subDays = 30;
    }

    /* événement SCAN toutes les ≈ 0,7 s (DEMO) */
    if (s.mode !== 'PAPER') {
      s.nextEvt -= dt;
      if (s.nextEvt <= 0) {
        s.nextEvt += U.rr(r(), .6, .8);
        const n = U.ri(r(), 900, 1900), k = U.ri(r(), 1, 8), lp = U.ri(r(), 26, 90);
        this.addLine('SCAN', U.tpl(T.a.scan, { n: U.int(n), k, lp }));
        const add = U.ri(r(), 1, 3); for (let i = 0; i < add && s.pq.length < 4; i++) s.pq.push(this.rollToken());
      }
    }
    this.updatePipe();

    /* échantillonnage de la courbe */
    s.peak = Math.max(s.peak, s.bal);
    if (t >= s.sampleAt) {
      s.sampleAt = t + (s.mode === 'PAPER' ? 5 : .2);
      s.hist.push([s.elapsed, s.bal]);
      if (s.mode === 'PAPER') { const w = Paper.wallet('A'); w.hist.push([Date.now(), s.bal]); if (w.hist.length > 2000) w.hist.splice(0, w.hist.length - 2000); }
    }

    /* rotation de l'agent actif : pauses de 3 à 6 s, un agent peut rester deux cycles */
    if (t >= s.nextAct) {
      if (r() > .25) s.act = (s.act + 1) % 6;
      s.nextAct = t + U.rr(r(), 3, 6);
    }
    if (s.ended && s.mode !== 'PAPER') { s.hist.push([s.elapsed, s.bal]); this.r.replay.classList.add('show'); }
  },

  /* applique l'état aux compteurs (toutes les 0,25 s de scène, pour que les nombres « roulent ») */
  sync(snap = false) {
    const s = this.s, D = DATA.A, n = this.n;
    const pnl = s.bal - D.stack;
    const f = snap ? 'snap' : 'set';
    n.bal[f](s.bal); n.pnl[f](pnl); n.tasks[f](Math.round(s.tasks), false); n.res[f](Math.round(s.resolved), false);
    n.wins[f](s.wins, false); n.losses[f](s.losses, false);
    U.text(this.r.pnlp, (pnl < 0 ? '-' : '+') + U.fmt(pnl / D.stack * 100, 0) + '% ' + T.a.onStack);
    U.text(this.r.subd, U.tpl(T.a.paid, { n: s.subDays }));
    const closed = s.wins + s.losses, wr = closed ? Math.round(s.wins / closed * 100) : 0;
    U.text(this.r.wr, wr + '%'); U.attr(this.r.ring, 'stroke-dashoffset', (138.23 * (1 - wr / 100)).toFixed(2));
    U.text(this.r.closed, closed + ' ' + T.a.closed);
    const daily = U.clamp(Math.round((s.bal - D.stack) / (D.target - D.stack) * 100), 0, 100);
    U.text(this.r.dpct, daily + '%'); U.css(this.r.fill, 'transform', `scaleX(${daily / 100})`);
  },

  render() {
    const s = this.s; if (!s) return;
    const tick = Math.floor(s.t / .25);
    if (tick !== s.tick || s.ended) { s.tick = tick; this.sync(); }
    U.text(this.r.el, U.hms(s.elapsed) + T.a.of22);
    /* pastille d'état : DEMO (ambre) ou LIVE + PAPER */
    const paper = s.mode === 'PAPER';
    U.text(this.r.lt, paper ? T.LIVE : T.DEMO); U.cls(this.r.dot, 'demo', !paper); this.r.pb.hidden = !paper;
    /* agents */
    this.tiles.forEach((tl, i) => U.cls(tl, 'on', i === s.act));
    /* courbe */
    const W = this.CW, H = this.CH, top = 18, bot = H - 18, min = DATA.A.floor;
    const max = Math.max(s.peak, min + 1) * 1.0;
    const X = e => 2 + (e / DATA.A.maxElapsed) * (W - 10), Y = v => bot - (v - min) / (max - min) * (bot - top);
    const hs = s.hist, step = Math.max(1, Math.ceil(hs.length / 140)), pts = [];
    for (let i = 0; i < hs.length; i += step) pts.push([X(hs[i][0]), Y(hs[i][1])]);
    const last = [X(s.elapsed), Y(s.bal)];
    if (!pts.length || pts[pts.length - 1][0] < last[0] - .01) pts.push(last); else pts[pts.length - 1] = last;
    const d = U.spline(pts);
    U.attr(this.r.line, 'd', d);
    U.attr(this.r.area, 'd', d + `L${last[0].toFixed(1)},${H}L${pts[0][0].toFixed(1)},${H}Z`);
    U.attr(this.r.end, 'transform', `translate(${last[0].toFixed(1)},${last[1].toFixed(1)})`);
    const cx = last[0] < 90 ? last[0] + 12 : last[0] - 12;
    U.attr(this.r.cur, 'text-anchor', last[0] < 90 ? 'start' : 'end');
    U.attr(this.r.cur, 'x', cx.toFixed(1)); U.attr(this.r.cur, 'y', Math.max(14, last[1] - 9).toFixed(1));
    U.text(this.r.cur, U.usd(s.bal));
    U.text(this.r.peak, '$' + U.int(Math.round(s.peak)));
    const bd = s.bigDots.map(b => `<circle cx="${X(b[0]).toFixed(1)}" cy="${Y(b[1]).toFixed(1)}" r="2.5" fill="#34e8a0"/>`).join('');
    U.html(this.r.bigs, bd);
  },
};

const bez = (p0, p1, p2, p3, u) => { const v = 1 - u; return [v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0], v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]]; };

class PhoneScene {

    } else {
      const urows = C.repos.map((p, i) => `<div class="urow"><span class="cd" style="width:9rem;height:9rem;border-radius:50%;background:${p.c}"></span><span class="un">${U.esc(p.uname)}</span><span class="us">${U.esc(p.star)}</span><span class="uc">● <span data-r="calls${i}">0</span> ${TP.calls}</span></div>`).join('');

      <div class="card"><div class="card-h"><span class="ct">${Tc.decTitle}</span><span class="cr"><span class="dot pulse"></span>${TP.streaming}</span></div><div class="logs" data-r="logs"></div></div>`;
    }
    const sbar = ip ? `<div class="sbar"><span data-r="sbt">22:01</span><div class="island"></div><span class="sb-r"><span class="bars"><i style="height:6rem"></i><i style="height:9rem"></i><i style="height:12.5rem"></i><i style="height:16rem"></i></span><span class="lte">${Tc.lte}</span><span class="batt" data-r="batt">91</span></span></div>` : '';
    const rc = C.recap;
    const bestAv = this.key === 'B' ? `<span class="g">[D]</span>` : VIS.av(rc.best[0], 'sm');

  /* ---------- journal (BUY / SELL) ---------- */
  pushLog(e) {
    const s = this.s; s.log.unshift(e); if (s.log.length > 12) s.log.pop();

        const d = new Date(ev.ms), tm = U.pad(d.getHours()) + ':' + U.pad(d.getMinutes());
        if (ev.kind === 'buy') this.pushLog({ tm, side: 'BUY', tk: ev.sym, dt: ev.detail, amt: U.usd(ev.usd) });
        if (ev.kind === 'sell') {
          this.pushLog({ tm, side: 'SELL', tk: ev.sym, amt: U.sUsd(ev.pnl), suffix: T.phone.paperVia + ' · ' + ev.why, neg: ev.pnl < 0 });

        }
      });
      return;
    }
    const abs = C.start + n.x;
    /* lignes exactes scriptées */
    if (s.mode === 'REPLAY') while (s.si < C.scripted.length && abs >= C.scripted[s.si].m) { const e = C.scripted[s.si++]; this.pushLog(Object.assign({ tm: U.hhmm(e.m) }, e)); }
    const initEnd = C.scripted[0].m + 6;
    const cl = n.wins + n.losses;
    let buys = n.trades - s.prevTr, sells = cl - s.prevCl; s.prevTr = n.trades; s.prevCl = cl;
    if (s.mode === 'REPLAY' && abs < initEnd) return;
    buys = Math.min(buys, 2); sells = Math.min(sells, 2);
    for (let i = 0; i < buys; i++) {
      const tk = U.pick(C.pool, r()); const amt = n.eq * U.rr(r(), .05, .10);
      this.pushLog({ tm: U.hhmm(abs), side: 'BUY', tk, dt: U.pick(C.buyDetails, r()), amt: U.usd(amt) });
    }
    for (let i = 0; i < sells; i++) {

      let dt;

    });

  /* textes d'activité des agents (changent toutes les ≈ 1,5 s) */
  agentTexts(c) {
    const s = this.s, n = s.snap, h = k => U.h(c * 13 + k, s.seed);

    const ptok = paper ? ([...Paper.pool.values()].pop() || {}).sym || '…' : null;

  /* ---------- rendu idempotent à partir de t ---------- */
  render() {
    const s = this.s, r = this.r, C = this.cfg, t = s.t, P = U.prog, E = U.easeOut;
    const T6 = PH.s5 + C.liveSec, paper = s.mode === 'PAPER';

      U.css(r.zoom.firstElementChild, 'opacity', (1 - P(t, 3.4, 3.62)).toFixed(3));
    } else U.show(r.zoom, 0);
    if (r.gbicon) U.css(r.gbicon.firstElementChild, 'opacity', t >= 3.4 && t < 4.2 ? '0' : '1');
    /* écran 2 : terminal */
    U.show(r.s2, P(t, 3.8, 4.05) * (1 - P(t, 9.8, 10.1)));
    C.repos.forEach((p, i) => { const a = P(t, 4.35 + i * .18, 4.55 + i * .18); U.css(r['tl' + i], 'opacity', a.toFixed(3)); U.css(r['tl' + i], 'transform', `translateX(${((1 - a) * 10).toFixed(1)}rem)`); });
    const pg = P(t, 5.3, 6.3); U.css(r.prog, 'transform', `scaleX(${pg.toFixed(3)})`); U.text(r.progl, Math.round(pg * 100) + '%');
    U.css(r.term, 'opacity', (1 - P(t, 6.6, 6.9)).toFixed(3));
    const shr = E(P(t, 6.6, 7.0)); U.css(r.blogo, 'transform', `scale(${U.lerp(1, .8, shr).toFixed(3)})`);
    U.css(r.dim, 'opacity', (.55 * P(t, 7.0, 7.3)).toFixed(3));
    /* écran 3 : feuille de connexion (animation visuelle uniquement) */
    U.show(r.s3, (t >= 7 && t < 10.05) ? 1 : 0);
    const up = E(P(t, 7.0, 7.45)), down = U.easeInOut(P(t, 9.6, 10.0));
    U.css(r.sheet3, 'transform', `translateY(${((1 - up) * 105 + down * 105).toFixed(2)}%)`);
    for (let i = 0; i < 3; i++) U.css(r['d' + i], 'opacity', REDUCED ? '1' : (.3 + .7 * (.5 + .5 * Math.sin(t * 7 - i * 1.3))).toFixed(2));
    const rp = P(t, 8.65, 9.2); U.css(r.ripple, 'transform', `scale(${(rp * 8).toFixed(2)})`); U.css(r.ripple, 'opacity', (rp > 0 && rp < 1 ? .5 * (1 - rp) : 0).toFixed(2));
    U.text(r.btxt, t >= 8.75 ? T.phone.connected : T.phone.connect);
    /* écran 4 : mise en place */
    U.show(r.s4, P(t, 10.0, 10.3) * (1 - P(t, 13.3, 13.6)));
    let online = 0;
    C.repos.forEach((p, i) => {
      const t0 = 10.3 + i * .25, a = E(P(t, t0, t0 + .3));
      U.css(r['card' + i], 'opacity', a.toFixed(3)); U.css(r['card' + i], 'transform', `translateY(${((1 - a) * 12).toFixed(1)}rem)`);
      p.ag.forEach((g, j) => { const ok = t >= t0 + .6 + j * .15; if (ok) online++; U.text(r[`chip${i}_${j}`], ok ? (this.key === 'B' ? '✓ ' + T.phone.online : '✓ ' + T.phone.ready) : T.phone.pending); });
    });
    U.text(r.onl, this.key === 'B' ? U.tpl(this.Tc.setupRight, { n: online }) : '');
    U.css(r.ghost, 'opacity', (.35 * P(t, 10.3 + C.repos.length * .25 + .2, 10.3 + C.repos.length * .25 + .5)).toFixed(3));
    /* écran 5 : tableau de bord live */
    U.show(r.s5, P(t, 13.4, 13.7));
    if (t >= 13.3) this.renderLive(t);
    /* barre d'état (C) : heure simulée + batterie qui se vide */
    if (C.iphone) {
      const clk = t < PH.s3 ? C.start + 1 : (t < PH.s5 ? C.start + 2 : (paper ? s.snap.clock : Math.max(C.start + 2, C.start + s.snap.x)));
      U.text(r.sbt, U.hhmm(clk));
      const B = C.battery; const bi = paper ? 0 : Math.min(B.length - 1, Math.floor(U.clamp(t / T6) * (B.length - 1) + 1e-6));
      U.text(r.batt, String(B[bi]));
    }
    /* toasts : glissent depuis le haut, 3 s */
    let act = -1, tp = 0;
    s.toasts.forEach((x, i) => { if (t >= x.at && t < x.at + 3) { act = i; tp = t - x.at; } });
    if (act !== s.tIdx) {
      s.tIdx = act;
      if (act >= 0) { const d = s.toasts[act].d; U.html(r.tic, d.ic === 'frog' ? VIS.frog(30) : VIS.logo()); U.text(r.t1, d.t1); U.text(r.t2, d.t2); U.html(r.tav, VIS.av(d.tk)); }
    }
    const ty = act < 0 ? -140 : (tp < .35 ? (1 - E(tp / .35)) * -140 : (tp > 2.65 ? -140 * U.easeInOut((tp - 2.65) / .35) : 0));
    U.css(r.toast, 'transform', `translateY(${ty.toFixed(1)}%)`);
    U.css(r.toast, 'opacity', act < 0 ? '0' : (tp < .3 ? (tp / .3).toFixed(2) : (tp > 2.7 ? ((3 - tp) / .3).toFixed(2) : '1')));
    /* écran 6 : récap (pas en PAPER : la session virtuelle continue) */
    const rv = paper ? 0 : P(t, T6, T6 + .4);
    U.show(r.veil, rv);
    const ru = paper ? 0 : E(P(t, T6, T6 + .55));
    U.css(r.recap, 'transform', `translateY(${((1 - ru) * 105).toFixed(2)}%)`);
    if (!paper && t >= T6) {
      const rc = s.recap, k = E(P(t, T6 + .5, T6 + 2.9));
      U.text(r.rnow, U.usd(U.lerp(rc.from, rc.to, k)));
      U.text(r.rmul, U.lerp(rc.mulFrom, rc.mulTo, k).toFixed(1) + '×');
      U.text(r.rtr, String(Math.round(U.lerp(rc.trFrom, rc.trTo, k))));
    }
  }

  renderLive(t) {
    const s = this.s, r = this.r, C = this.cfg, n = s.snap, paper = s.mode === 'PAPER';
    const tick = Math.floor(t / .25); if (tick !== s.tick) { s.tick = tick; this.syncNums(); }
    U.text(r.clock, U.hhmm(n.clock));
    /* pastille d'état */
    U.text(r.ltxt, paper ? T.live : T.DEMO); U.cls(r.ldot, 'demo', !paper); r.lpb.hidden = !paper;
    /* bandeau défilant ≈ 60 px/s */
    if (!this.tapeW) this.tapeW = r.tape.scrollWidth / 2;
    if (!REDUCED && this.tapeW > 0) { const off = ((t - PH.s5 + 50) * 60) % this.tapeW; U.css(r.tape, 'transform', `translate3d(${(-off).toFixed(1)}px,0,0)`); }
    /* courbe d'équité */
    const W = this.CW, H = this.CH, pts = [];
    let vals;
    if (paper) { const w = Paper.wallet(this.key); vals = w.hist.map(h => [(h[0] - w.start) / 60000, h[1]]); vals.push([n.x, n.eq]); }
    else { vals = []; const N = 90; for (let i = 0; i <= N; i++) { const x = n.x * i / N; vals.push([x, s.sess.eq(x)]); } }
    let lo = C.stake, hi = C.stake; vals.forEach(v => { lo = Math.min(lo, v[1]); hi = Math.max(hi, v[1]); });
    lo = lo - (hi - lo) * .06 - C.stake * .04; hi = hi + (hi - lo) * .1 + C.stake * .02;
    const X = x => (x / C.dur) * (W - 8) + 4, Y = v => H - 8 - (v - lo) / (hi - lo) * (H - 20);
    const step = Math.max(1, Math.ceil(vals.length / 120));
    for (let i = 0; i < vals.length; i += step) pts.push([X(vals[i][0]), Y(vals[i][1])]);
    const lastP = [X(n.x), Y(n.eq)]; if (pts.length && pts[pts.length - 1][0] >= lastP[0] - .01) pts[pts.length - 1] = lastP; else pts.push(lastP);
    const d = U.spline(pts);
    U.attr(r.cline, 'd', d); U.attr(r.carea, 'd', d + `L${lastP[0].toFixed(1)},${H}L${pts[0][0].toFixed(1)},${H}Z`);
    U.attr(r.cdot, 'cx', lastP[0].toFixed(1)); U.attr(r.cdot, 'cy', lastP[1].toFixed(1));
    const py = Y(C.stake).toFixed(1); U.attr(r.putin, 'y1', py); U.attr(r.putin, 'y2', py);
    if (paper) { const w = Paper.wallet(this.key); const d0 = new Date(w.start); const sm = d0.getHours() * 60 + d0.getMinutes(); U.text(r.axl, U.hhmm(sm)); U.text(r.axr, U.hhmm(sm + C.dur)); }
    else { U.text(r.axl, this.Tc.axisL); U.text(r.axr, this.Tc.axisR); }
    /* journal */
    this.renderLogs();
    /* agents : fondu toutes les ≈ 1,5 s */
    const lt = Math.max(0, t - PH.s5), cyc = Math.floor(lt / 1.5), ph = (lt / 1.5) % 1;
    if (cyc !== s.cycle) { s.cycle = cyc; const tx = this.agentTexts(cyc); tx.forEach((x, i) => U.text(r['ax' + i], x)); }
    const op = cyc === 0 ? (ph > .88 ? (1 - ph) / .12 : 1) : (ph < .12 ? ph / .12 : (ph > .88 ? (1 - ph) / .12 : 1));
    for (let i = 0; i < 5; i++) U.css(r['ax' + i], 'opacity', (REDUCED ? 1 : .15 + .85 * op).toFixed(2));
    /* schéma agents → core (B) : points lumineux ≈ 1,6 s, grenouille qui clignote */
    if (this.key === 'B') {
      const xs = this.coreXs;
      for (let i = 0; i < 5; i++) {
        const u = ((lt / 1.6) + i * .2) % 1;
        const p = bez([xs[i], 68], [xs[i], 120], [246, 104], [246, 144], u);
        U.attr(r['pk' + i], 'transform', `translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`);
        U.attr(r['pk' + i], 'opacity', (u < .08 ? u / .08 : (u > .92 ? (1 - u) / .08 : 1)).toFixed(2));
      }
      const fa = t - s.frogAt; U.attr(r.frog, 'opacity', fa >= 0 && fa < .5 ? (Math.floor(fa * 8) % 2 ? '.35' : '1') : '.25');
    }
  }

  measure() {
    const ph = this.r.phone.getBoundingClientRect(), ic = this.r.gbicon.firstElementChild.getBoundingClientRect();
    const sc = Math.max(ph.width, ph.height) / ic.width * 1.25;
    this.zg = { l: ic.left - ph.left, t: ic.top - ph.top, w: ic.width, sc, dx: ph.width / 2 - (ic.left - ph.left + ic.width / 2), dy: ph.height / 2 - (ic.top - ph.top + ic.height / 2) };
    this.geomDirty = false;
  }
}

/* ========================= UI : sélecteur, bandeau, réglages ========================= */
const UI = {
  build() {
    const chip = document.getElementById('chip'), TU = T.ui;
    const sc = [['trading', 0], ['gmgn', 1], ['meme', 2]].map(([h, i]) => `<button data-s="${h}"><b>${TU.scenes[i][0]}</b> ${TU.scenes[i][1]}</button>`).join('<span class="sep">·</span>');
    chip.innerHTML = `<span class="grp sc">${sc}</span><button data-a="more" class="morebtn" aria-label="more controls">⋯</button><span class="more"><span class="sep">|</span>
      <button data-a="replay">${TU.replay}</button><button data-a="pause" id="bPause">${TU.pause}</button>
      <span class="grp">${[.5, 1, 2, 4].map(v => `<button data-v="${v}">×${v}</button>`).join('')}</span>
      <button data-a="shuffle">${TU.shuffle}</button><button data-a="skip" id="bSkip">${TU.skip}</button><button data-a="reset">${TU.reset}</button>
      <span class="sep">|</span><label>${TU.data} <select id="selData" title="LIVE: ${TU.liveDisabled}"><option value="DEMO">${TU.demo}</option><option value="PAPER">${TU.paper}</option><option value="LIVE" disabled title="${TU.liveDisabled}">${TU.liveOpt}</option></select></label>
      <button data-a="settings">${TU.settings}</button></span><span class="pm" id="pm"></span>`;
    chip.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.s) location.hash = '#' + b.dataset.s;
      else if (b.dataset.v) App.setSpeed(+b.dataset.v);
      else if (b.dataset.a === 'replay') App.replay();
      else if (b.dataset.a === 'pause') App.togglePause();
      else if (b.dataset.a === 'shuffle') App.shuffle();
      else if (b.dataset.a === 'skip') App.skip();
      else if (b.dataset.a === 'reset') App.reset();
      else if (b.dataset.a === 'more') chip.classList.toggle('open');
      else if (b.dataset.a === 'settings') document.getElementById('settings').classList.toggle('show');
    });
    document.getElementById('selData').addEventListener('change', e => App.setData(e.target.value));
    /* réglages de l'extension xAI (facultative, désactivée par défaut) */
    const st = document.getElementById('settings');
    st.innerHTML = `<h4>${TU.setTitle}</h4>
      <div class="row"><input type="checkbox" id="xEn"><label for="xEn" style="margin:0">${TU.setEnable}</label></div>
      <label for="xKey">${TU.setKey}</label><input type="password" id="xKey" autocomplete="off" spellcheck="false" placeholder="xai-…">
      <label for="xModel">${TU.setModel}</label><input type="text" id="xModel" value="${XAI.model}" spellcheck="false">
      <div class="row"><button id="xApply">${TU.setApply}</button><button id="xClear">${TU.setClear}</button></div>
      <div class="status" id="xStatus"></div><div class="note">${TU.setNote}</div>`;
    document.getElementById('xApply').addEventListener('click', () => {
      XAI.key = document.getElementById('xKey').value.trim(); XAI.model = document.getElementById('xModel').value.trim() || 'grok-3-mini';
      XAI.enabled = document.getElementById('xEn').checked && !!XAI.key; XAI.text = {}; XAI.last = 0;
      UI.setStatus(XAI.enabled ? T.ui.setOk : T.ui.setOff);
    });
    document.getElementById('xClear').addEventListener('click', () => { XAI.key = ''; XAI.enabled = false; XAI.text = {}; document.getElementById('xKey').value = ''; document.getElementById('xEn').checked = false; UI.setStatus(T.ui.setOff); });
    document.getElementById('banner').textContent = TU.offline;
  },
  setStatus(s) { const e = document.getElementById('xStatus'); if (e) e.textContent = s; },
  refresh() {
    const a = App;
    document.querySelectorAll('#chip [data-s]').forEach(b => b.classList.toggle('act', b.dataset.s === a.scene));
    document.querySelectorAll('#chip [data-v]').forEach(b => b.classList.toggle('act', +b.dataset.v === a.speed));
    document.getElementById('bPause').textContent = a.paused ? T.ui.play : T.ui.pause;
    document.getElementById('bSkip').disabled = a.scene === 'trading';
    document.getElementById('bSkip').style.opacity = a.scene === 'trading' ? .4 : 1;
    document.getElementById('selData').value = a.data;
    document.getElementById('pm').textContent = a.data === 'PAPER' ? T.ui.paper : (a.play === 'SIM' ? T.ui.simMode : T.ui.replayMode);
    /* pastille de mode toujours visible : DEMO ambre / PAPER */
    const mb = document.getElementById('modeBadge');
    mb.innerHTML = a.data === 'PAPER' ? `<span class="dot"></span>${T.ui.badgePaper}` : `<span class="dot demo"></span>${T.ui.badgeDemo}`;
  },
  banner(on) { document.getElementById('banner').classList.toggle('show', on); },
};

/* ========================= APP : routeur, cadrage, boucle unique ========================= */
const App = {
  scene: 'trading', speed: 1, paused: false, data: 'DEMO', play: 'REPLAY', last: 0, saveAt: 0,
  map: {},
  init() {
    const st = Store.load();
    if ([.5, 1, 2, 4].includes(st.speed)) this.speed = st.speed;
    if (st.data === 'PAPER') this.data = 'PAPER';
    if (st.paper && st.paper.wallets) Paper.wallets = st.paper.wallets;
    this.B = new PhoneScene(DATA.B, T.b); this.C = new PhoneScene(DATA.C, T.c);
    this.map = { trading: SceneA, gmgn: this.B, meme: this.C };
    SceneA.build(document.getElementById('sceneA')); this.B.build(document.getElementById('sceneB')); this.C.build(document.getElementById('sceneC'));
    UI.build();
    const h = location.hash.slice(1);
    const start = this.map[h] ? h : (this.map[st.scene] ? st.scene : 'trading');
    if (this.data === 'PAPER') Paper.start();
    addEventListener('hashchange', () => { const n = location.hash.slice(1); if (this.map[n] && n !== this.scene) this.setScene(n); });
    addEventListener('resize', () => this.layout());
    addEventListener('keydown', e => this.key(e));
    if (location.hash.slice(1) !== start) history.replaceState(null, '', '#' + start);
    this.setScene(start, true);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { this.B.tapeW = 0; this.C.tapeW = 0; this.B.geomDirty = this.C.geomDirty = true; });
    requestAnimationFrame(t => { this.last = t; requestAnimationFrame(x => this.loop(x)); });
  },
  cur() { return this.map[this.scene]; },
  mode() { return this.data === 'PAPER' ? 'PAPER' : this.play; },
  setScene(name, first = false) {
    this.scene = name;
    document.body.dataset.scene = name;
    ['A', 'B', 'C'].forEach((k, i) => document.getElementById('scene' + k).classList.toggle('on', ['trading', 'gmgn', 'meme'][i] === name));
    this.layout();
    this.cur().reset(this.mode());
    UI.refresh(); this.save();
  },
  layout() {
    const vw = innerWidth, vh = innerHeight, mobile = vw < 600;
    document.body.classList.toggle('mobile', mobile);
    let unit;
    if (this.scene === 'trading') { const W = Math.min(vw, vh * 4 / 3); unit = W / 960; }
    else {
      const ip = this.scene === 'meme';
      let fw, fh;
      if (mobile) { fw = vw; fh = vh; }
      else { const ratio = ip ? 19.5 / 9 : 16 / 9; fh = Math.min(390 * ratio, vh - 48); fw = fh / ratio; }
      const ph = this.cur().r.phone; ph.style.setProperty('--fw', fw + 'px'); ph.style.setProperty('--fh', fh + 'px');
      unit = fw / 540;
      this.cur().geomDirty = true; this.cur().tapeW = 0;
    }
    document.documentElement.style.fontSize = unit + 'px';
    document.documentElement.style.setProperty('--u', unit + 'px');
  },
  key(e) {
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); this.togglePause(); }
    else if (e.key === 'r' || e.key === 'R') this.replay();
    else if (e.key === '1') location.hash = '#trading';
    else if (e.key === '2') location.hash = '#gmgn';
    else if (e.key === '3') location.hash = '#meme';
  },
  replay() { if (this.data !== 'PAPER') this.play = 'REPLAY'; this.paused = false; this.cur().reset(this.mode()); UI.refresh(); },
  shuffle() { if (this.data === 'PAPER') this.setData('DEMO', true); this.play = 'SIM'; this.paused = false; this.cur().reset('SIM'); UI.refresh(); },
  skip() { const c = this.cur(); if (c.skipIntro) c.skipIntro(); },
  togglePause() { this.paused = !this.paused; UI.refresh(); },
  setSpeed(v) { this.speed = v; UI.refresh(); this.save(); },
  setData(m, quiet = false) {
    if (m === 'LIVE') { UI.refresh(); return; } /* argent réel : non implémenté */
    this.data = m;
    if (m === 'PAPER') { UI.banner(false); Paper.start(); } else Paper.stop();
    if (!quiet) this.cur().reset(this.mode());
    UI.refresh(); this.save();
  },
  paperFailed() { this.data = 'DEMO'; this.play = 'REPLAY'; UI.banner(true); this.cur().reset('REPLAY'); UI.refresh(); this.save(); },
  reset() {
    Store.clear(); Paper.stop(); Paper.reset(); UI.banner(false);
    this.speed = 1; this.data = 'DEMO'; this.play = 'REPLAY'; this.paused = false;
    this.cur().reset('REPLAY'); UI.refresh(); this.save();
  },
  save() {
    const w = {}; Object.entries(Paper.wallets).forEach(([k, v]) => { w[k] = Object.assign({}, v, { hist: v.hist.slice(-1500) }); });
    Store.save({ scene: this.scene, speed: this.speed, data: this.data, paper: { wallets: w } });
  },
  /* une seule boucle requestAnimationFrame pour tout */
  loop(now) {
    const dt = Math.min(.1, Math.max(0, (now - this.last) / 1000)); this.last = now;
    const c = this.cur();
    try {
      if (!this.paused) c.update(dt * this.speed);
      Paper.tick(now, c.key);
      c.render(now);
      for (const n of Num.all) n.step(now);
      if (this.data === 'PAPER' && now > this.saveAt) { this.saveAt = now + 10000; this.save(); }
    } catch (err) { console.error(err); }
    requestAnimationFrame(x => this.loop(x));
  },
};

document.addEventListener('DOMContentLoaded', () => App.init());

</script>
