<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grok Bot — bot de trading en simulation (données réelles, portefeuille fictif)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   GROK BOT — design system (variables CSS)
   :root = thème A (dashboard verre) · .theme-b = mobile sombre · .theme-c = mobile clair
   Unité : 1rem = --u px (A : largeur/960 ; B/C : largeur du cadre/540), recalculée en JS
   ========================================================= */
:root{
  --u:1px;
  --a-bg:#0a0d18; --a-text:#f2f4fb; --a-label:#8c94a9; --a-dim:#5d667c; --a-head:#9aa3b8;
  --a-win:#34e8a0; --a-loss:#ff5c75; --a-exec:#5aa5ff; --a-scan:#8d8ef7; --a-warn:#f6b73c; --a-brand:#b66dff;
  --demo:#f6b73c; --live:#34e8a0;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  --outfit:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --inter:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
.theme-b{
  --bg:#0b0c0f; --card:#14161b; --line:rgba(255,255,255,.07); --sheet:#15171c; --handle:#3a3e47;
  --text:#ffffff; --sub:#8b919c; --pos:#2fd47f; --neg:#ff5d73; --buy:#5aa9ff; --sell:#2fd47f;
  --btn:#1f9d55; --cta-bg:#f2f2f2; --cta-fg:#000; --mul-bg:#f4f4f4; --mul-fg:#000;
  --dpill-bg:#12301f; --dpill-fg:#3ddc97; --pill:rgba(255,255,255,.06); --curve:#2fd47f; --shadow:none;
  --tile:rgba(255,255,255,.04); --toast:rgba(30,32,38,.92); --amber:#f2b84b; --chipbg:#14161b; --tag:rgba(255,255,255,.07);
}
.theme-c{
  --bg:#f5f6f8; --card:#ffffff; --line:#ececf0; --sheet:#ffffff; --handle:#d6d8de;
  --text:#0b0b0f; --sub:#8a8f99; --pos:#16a34a; --neg:#e5484d; --buy:#3b6fe8; --sell:#16a34a;
  --btn:#1fa854; --cta-bg:#0d0d10; --cta-fg:#fff; --mul-bg:#0d0d10; --mul-fg:#fff;
  --dpill-bg:#e3f6e8; --dpill-fg:#16a34a; --pill:rgba(0,0,0,.05); --curve:#16a34a; --shadow:0 1px 2px rgba(0,0,0,.04);
  --tile:#f3f4f6; --toast:rgba(255,255,255,.92); --amber:#c98a10; --chipbg:#ffffff; --tag:#f0f1f4;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--a-bg);font-family:var(--outfit);-webkit-font-smoothing:antialiased;color:var(--a-text)}
body[data-scene=gmgn]{background:radial-gradient(120vmax 80vmax at 50% 0%,#15171d,#060708)}
body[data-scene=meme]{background:radial-gradient(120vmax 80vmax at 50% 0%,#eef1f5,#d9dee5)}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene.on{display:block}
.mono{font-family:var(--mono)}

/* ---------- pastilles d'état DEMO / LIVE / PAPER (communes) ---------- */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--live);flex:none}
.dot.demo{background:var(--demo)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.72);opacity:.55}}
.paper-badge{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:2px 5px;border-radius:5px;background:rgba(90,165,255,.18);color:#8cc2ff;border:1px solid rgba(90,165,255,.4)}
.theme-c .paper-badge{background:#e8efff;color:#3b6fe8;border-color:#bfd0fb}

/* =========================================================
   SCÈNE A — dashboard « verre » 4:3 (référence 960 × 720)
   ========================================================= */
#sceneA .glows{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#sceneA .glow{position:absolute;border-radius:50%;will-change:transform}
#sceneA .g1{width:80vmax;height:80vmax;left:-30vmax;top:-34vmax;background:radial-gradient(closest-side,rgba(48,96,255,.28),transparent);animation:drift1 20s ease-in-out infinite}
#sceneA .g2{width:70vmax;height:70vmax;right:-30vmax;top:5vmax;background:radial-gradient(closest-side,rgba(200,50,90,.22),transparent);animation:drift2 20s ease-in-out infinite}
#sceneA .g3{width:80vmax;height:70vmax;left:15vmax;bottom:-40vmax;background:radial-gradient(closest-side,rgba(130,70,220,.20),transparent);animation:drift3 20s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(6vmax,4vmax)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5vmax,6vmax)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(4vmax,-5vmax)}}

.a-board{position:absolute;left:50%;top:50%;width:960rem;height:720rem;margin-left:-480rem;margin-top:-360rem;padding:16rem;display:flex;flex-direction:column;justify-content:space-between}
.glass{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(8,12,24,.70));border:1px solid rgba(255,255,255,.10);border-radius:18rem;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.a-lbl{font-family:var(--mono);font-size:9rem;letter-spacing:.12em;text-transform:uppercase;color:var(--a-label)}

/* en-tête */
.a-head{height:74rem;display:flex;justify-content:space-between;align-items:flex-start}
.a-brand{display:flex;flex-direction:column}
.a-pill{height:46rem;width:268rem;border:1px solid rgba(255,255,255,.12);border-radius:999rem;display:flex;align-items:center;gap:10rem;padding:0 18rem 0 4rem;background:rgba(255,255,255,.025)}
.a-pill .logo{width:38rem;height:38rem;flex:none}
.a-word{font-family:var(--outfit);font-weight:700;font-size:34rem;letter-spacing:.01em;line-height:1;color:#fff;white-space:nowrap}
.a-word b{color:var(--a-brand);font-weight:700}
.a-mode{margin:8rem 0 0 70rem;font-family:var(--mono);font-size:12rem;letter-spacing:.12em;color:#9aa3b8;text-transform:uppercase}
.a-right{display:flex;flex-direction:column;align-items:flex-end}
.a-live{height:46rem;min-width:74rem;padding:0 14rem;border:1px solid rgba(255,255,255,.12);border-radius:999rem;display:flex;align-items:center;justify-content:center;gap:8rem;font-family:var(--mono);font-size:12rem;color:#fff;letter-spacing:.06em;background:rgba(255,255,255,.025)}
.a-live .dot{width:10rem;height:10rem}
.a-live .paper-badge{font-size:8rem;padding:2rem 5rem;border-radius:5rem}
.a-tasks{margin-top:8rem;font-family:var(--mono);font-size:12rem;color:#dfe3ef;letter-spacing:.04em}
.a-tasks span{color:var(--a-label)}

/* cartes de chiffres */
.a-stats{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:72rem 72rem;gap:8rem}
.a-stat{padding:12rem 18rem;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.a-stat.bar::before{content:'';position:absolute;left:0;top:14rem;bottom:14rem;width:3rem;border-radius:0 3rem 3rem 0;background:var(--bc)}
.a-val{font-family:var(--outfit);font-weight:700;font-size:28rem;line-height:1.1;color:#fff;margin:3rem 0 2rem;transition:color .6s}
.a-val.green{color:var(--a-win)}
.a-sub{font-family:var(--mono);font-size:10rem;color:var(--a-label)}
.flash-up{color:var(--a-win)!important;transition:none!important}
.flash-down{color:var(--a-loss)!important;transition:none!important}
.a-wr{flex-direction:row;align-items:center;justify-content:flex-start;gap:16rem}
.a-ring{position:relative;width:50rem;height:50rem;flex:none}
.a-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.a-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--outfit);font-weight:700;font-size:14rem;color:#fff}
.a-wrtext{display:flex;flex-direction:column;gap:3rem}
.a-wrtext .w{font-family:var(--mono);font-size:11rem;color:var(--a-win)}
.a-wrtext .l{font-family:var(--mono);font-size:11rem;color:var(--a-loss)}
.a-closed{position:absolute;right:16rem;bottom:10rem;font-family:var(--mono);font-size:10rem;color:var(--a-label)}

/* rangée du milieu */
.a-mid{display:grid;grid-template-columns:512rem 1fr;gap:8rem;height:276rem}
.a-card{padding:14rem;overflow:hidden}
.a-ch{display:flex;justify-content:space-between;align-items:center;height:16rem}
.a-title{font-family:var(--mono);font-size:11rem;color:#fff;letter-spacing:.12em;text-transform:uppercase}
.a-meta{font-family:var(--mono);font-size:10rem;color:var(--a-label);letter-spacing:.06em}
.a-chart{display:block;width:484rem;height:224rem;margin-top:8rem;overflow:visible}
.a-chart text{font-family:var(--mono);font-size:10px;fill:var(--a-label)}
.a-chart .cur{font-family:var(--outfit);font-weight:600;font-size:15px;fill:var(--a-win);paint-order:stroke;stroke:rgba(10,13,24,.85);stroke-width:4px}
.a-chart .ring{transform-box:fill-box;transform-origin:center;animation:ringgrow 1.6s ease-out infinite}
@keyframes ringgrow{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}

.a-pipe{position:relative;height:66rem;margin-top:10rem}
.a-prow{position:absolute;left:0;right:0;top:0;height:22rem;display:flex;align-items:center;transition:transform .25s ease,opacity .25s ease}
.a-prow .tk{width:70rem;font-family:var(--mono);font-size:11rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}
.a-dots{display:flex;gap:8rem;align-items:center}
.pd{position:relative;width:9rem;height:9rem;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.pd.ok{background:var(--a-win);border-color:var(--a-win)}
.pd.fail{background:var(--a-loss);border-color:var(--a-loss)}
.pd.na{border:1px dashed rgba(255,255,255,.35);opacity:.8}
.pd.run{border:1.5px solid rgba(90,165,255,.35)}
.pd.run::after{content:'';position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--a-exec);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.a-prow .st{margin-left:auto;font-family:var(--mono);font-size:9rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.st.chk{color:var(--a-exec)} .st.rej{color:var(--a-loss)} .st.pass{color:var(--a-win)} .st.na{color:var(--a-label)}
.a-sep{height:1px;background:rgba(255,255,255,.08);margin:8rem 0 6rem}
.a-feed{position:relative;height:138rem;overflow:hidden}
.a-line{position:absolute;left:0;right:0;top:0;height:17rem;line-height:15rem;font-family:var(--mono);font-size:10rem;color:#dfe3ef;white-space:pre;overflow:hidden;text-overflow:ellipsis;padding:0 6rem;border:1px solid transparent;border-radius:6rem;transition:transform .25s ease,opacity .25s ease}
.a-line.big{background:rgba(52,232,160,.10);border-color:rgba(52,232,160,.45)}
.a-line .tag{font-weight:600}
.tag.SCAN{color:var(--a-scan)} .tag.EXEC{color:var(--a-exec)} .tag.FILL,.tag.BIG{color:var(--a-win)} .tag.WARN,.tag.RISK{color:var(--a-warn)} .tag.LOSS{color:var(--a-loss)} .tag.PAPER{color:#8cc2ff}

/* objectif journalier */
.a-daily{height:20rem;display:flex;align-items:center;gap:14rem}
.a-daily .lab{font-family:var(--mono);font-size:11rem;color:var(--a-label);letter-spacing:.12em;white-space:nowrap}
.a-track{flex:1;height:8rem;border-radius:99rem;background:rgba(255,255,255,.08);overflow:hidden}
.a-fill{height:100%;width:100%;border-radius:99rem;background:linear-gradient(90deg,#2dd4bf,#34e8a0);transform-origin:left center;transform:scaleX(0);transition:transform .6s ease}
.a-daily .pct{font-family:var(--mono);font-size:11rem;color:var(--a-win);width:36rem;text-align:right}

/* rangée des 6 agents */
.a-agents{display:flex;gap:12rem;height:98rem}
.a-tile{flex:1;border-radius:16rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9rem;transition:box-shadow .35s,background .35s}
.a-tile .bar{position:absolute;top:12rem;left:12rem;width:22rem;height:4rem;border-radius:2rem;background:var(--c)}
.a-tile .tint{position:absolute;inset:0;border-radius:16rem;background:var(--c);opacity:0;transition:opacity .35s}
.a-tile.on .tint{opacity:.14}
.a-tile.on{box-shadow:inset 0 0 0 1.5px var(--c),0 0 18rem color-mix(in srgb,var(--c) 25%,transparent)}
.a-tile .nm{position:relative;font-family:var(--outfit);font-weight:700;font-size:17rem;letter-spacing:.06em;text-transform:uppercase;color:#9aa3b8;transition:color .35s}
.a-tile.on .nm{color:#fff}
.orb{position:relative;width:36rem;height:36rem;border-radius:50%;background:radial-gradient(circle at 32% 26%,#ffffff 0%,color-mix(in srgb,var(--c) 45%,#fff) 16%,var(--c) 52%,color-mix(in srgb,var(--c) 55%,#000) 100%);box-shadow:0 7rem 10rem -5rem rgba(0,0,0,.7),0 2rem 6rem rgba(0,0,0,.3);transition:transform .35s}
.orb::before,.orb::after{content:'';position:absolute;top:50%;width:3rem;height:6rem;margin-top:-3rem;border-radius:2rem;background:#0a0b10}
.orb::before{left:calc(50% - 5rem)} .orb::after{left:calc(50% + 2rem)}
.a-tile.on .orb{animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1.06)}50%{transform:scale(1.0)}}
.a-replay{position:absolute;left:50%;top:calc(50% - 300rem);transform:translate(-50%,0);padding:14rem 28rem;border-radius:999rem;border:1px solid rgba(255,255,255,.2);background:rgba(10,13,24,.8);color:#fff;font-family:var(--mono);font-size:14rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.a-replay.show{opacity:1;pointer-events:auto}

/* =========================================================
   SCÈNES B et C — cadre de téléphone (référence 540 de large)
   ========================================================= */
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:var(--fw);height:var(--fh);border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--outfit);isolation:isolate}
.phone.theme-b{box-shadow:0 0 0 9px #111216,0 0 0 10px #2b2d33,0 30px 90px rgba(0,0,0,.6)}
.phone.theme-c{box-shadow:0 0 0 9px #1a1b1e,0 0 0 10px #3d3f45,0 30px 70px rgba(0,0,0,.22)}
body.mobile .phone{border-radius:0;box-shadow:none}
.scr{position:absolute;inset:0;opacity:0;visibility:hidden;will-change:opacity}
.phone.theme-c .scr.inset{top:70rem}

/* barre d'état iPhone (C) */
.sbar{position:absolute;left:0;right:0;top:0;height:70rem;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:6rem 38rem 0 46rem;font-family:var(--inter);font-weight:600;font-size:23rem;color:#0b0b0f;pointer-events:none}
.island{position:absolute;left:50%;top:14rem;width:166rem;height:47rem;margin-left:-83rem;border-radius:999rem;background:#000}
.sb-r{display:flex;align-items:center;gap:8rem}
.bars{display:flex;align-items:flex-end;gap:2.5rem;height:16rem}
.bars i{display:block;width:4.5rem;border-radius:1.5rem;background:#0b0b0f}
.lte{font-size:17rem;font-weight:700}
.batt{min-width:38rem;height:21rem;border-radius:7rem;background:#0b0b0f;color:#fff;font-size:13rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5rem}
.homebar{position:absolute;left:50%;bottom:10rem;width:186rem;height:7rem;margin-left:-93rem;border-radius:99rem;background:#0b0b0f;z-index:60;pointer-events:none}

/* icônes, logo, robots, avatars */
.logo{display:block}
.av{display:inline-flex;align-items:center;justify-content:center;width:26rem;height:26rem;border-radius:50%;color:#fff;font-family:var(--inter);font-weight:700;font-size:13rem;flex:none;vertical-align:middle}
.av.sm{width:22rem;height:22rem;font-size:11rem}
.robot{display:block;flex:none}

/* --- écran 1 : dossier --- */
.s1{overflow:hidden}
.s1 .wall{position:absolute;inset:-40rem}
.theme-b .s1 .wall{background:radial-gradient(60% 40% at 30% 20%,#5a2328 0%,transparent 70%),radial-gradient(50% 40% at 80% 70%,#3a1a22 0%,transparent 70%),linear-gradient(180deg,#2a1416,#0b0b0d)}
.theme-c .s1 .wall{background:radial-gradient(60% 40% at 25% 25%,#d6efe2 0%,transparent 70%),radial-gradient(50% 40% at 80% 75%,#d9e4f3 0%,transparent 70%),linear-gradient(180deg,#e8f3ee,#e6edf5)}
.fold-title{position:absolute;left:44rem;top:130rem;font-size:40rem;font-weight:700;letter-spacing:-.01em}
.theme-b .fold-title{color:#fff}.theme-c .fold-title{color:#000}
.fold-panel{position:absolute;left:44rem;right:44rem;top:206rem;padding:34rem 22rem 14rem;border-radius:46rem;display:grid;grid-template-columns:repeat(3,1fr);row-gap:26rem;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.theme-b .fold-panel{background:rgba(255,255,255,.12)}
.theme-c .fold-panel{background:rgba(255,255,255,.55);box-shadow:0 8rem 30rem rgba(0,0,0,.06)}
.app{display:flex;flex-direction:column;align-items:center;gap:9rem}
.app .ic{width:104rem;height:104rem;border-radius:26rem;display:flex;align-items:center;justify-content:center;font-family:var(--inter);font-weight:700;font-size:34rem;color:#fff;box-shadow:0 2rem 6rem rgba(0,0,0,.18);will-change:transform}
.app .ic .logo{width:104rem;height:104rem}
.app .nm{font-family:var(--inter);font-size:15rem;font-weight:500;white-space:nowrap}
.theme-b .app .nm{color:#f1f1f3}.theme-c .app .nm{color:#1b1c20}
.zoomer{position:absolute;border-radius:26rem;background:#161616;z-index:5;opacity:0;will-change:transform,opacity;display:flex;align-items:center;justify-content:center}
.theme-c .zoomer{background:#0d0d10}

/* --- écran 2 : terminal --- */
.s2 .boot{position:absolute;left:0;right:0;top:110rem;display:flex;flex-direction:column;align-items:center}
.boot-logo{width:90rem;height:90rem;border-radius:26rem;will-change:transform}
.theme-b .boot-logo{box-shadow:0 0 60rem rgba(61,220,151,.16)}
.theme-c .boot-logo{width:190rem;height:190rem;border-radius:50rem;box-shadow:0 18rem 40rem rgba(0,0,0,.18)}
.boot-title{margin-top:26rem;font-family:var(--outfit);font-weight:700;font-size:44rem;letter-spacing:-.01em}
.boot-pill{margin-top:12rem;padding:6rem 14rem;border-radius:8rem;background:var(--pill);color:var(--sub);font-family:var(--mono);font-size:15rem}
.term{margin-top:46rem;width:452rem;font-family:var(--mono);font-size:13rem;will-change:opacity}
.term .cmd{color:var(--sub);margin-bottom:12rem}
.term .ln{display:flex;align-items:center;gap:10rem;height:26rem;will-change:transform,opacity}
.term .ok{color:var(--pos);font-weight:700}
.term .rp{color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term .rv{color:var(--amber)}
.prog{margin:22rem auto 0;width:260rem;height:4rem;border-radius:99rem;background:var(--pill);overflow:hidden}
.prog i{display:block;height:100%;width:100%;background:#fff;transform-origin:left center;transform:scaleX(0)}
.theme-c .prog i{background:#0b0b0f}
.prog-l{margin-top:8rem;text-align:center;font-family:var(--mono);font-size:12rem;color:var(--sub)}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

/* --- feuilles (bottom sheets) --- */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:32rem 32rem 0 0;padding:12rem 30rem 34rem;will-change:transform;transform:translateY(105%)}
.theme-c .sheet{box-shadow:0 -10rem 40rem rgba(0,0,0,.1)}
.handle{width:36rem;height:4rem;border-radius:99rem;background:var(--handle);margin:0 auto 22rem}
.link-row{display:flex;align-items:center;justify-content:center;gap:16rem;margin-bottom:18rem}
.link-row .ic48{width:48rem;height:48rem;border-radius:14rem;display:flex;align-items:center;justify-content:center;overflow:hidden}
.link-row .ic48 .logo{width:48rem;height:48rem}
.brandpill{height:48rem;padding:0 16rem;border-radius:14rem;display:flex;align-items:center;font-family:var(--inter);font-weight:700;font-size:16rem;color:#fff}
.dashes{display:flex;gap:6rem}
.dashes i{display:block;width:12rem;height:4rem;border-radius:2rem;background:var(--dc);will-change:opacity}
.sh-title{text-align:center;font-family:var(--outfit);font-weight:700;font-size:28rem}
.sh-sub{text-align:center;color:var(--sub);font-size:17rem;margin-top:6rem}
.info{margin-top:20rem;border-radius:18rem;background:var(--tile);border:1px solid var(--line)}
.info .r{display:flex;justify-content:space-between;align-items:center;padding:13rem 18rem;font-size:15rem;gap:10rem}
.info .r+.r{border-top:1px solid var(--line)}
.info .k{color:var(--sub)} .info .v{font-family:var(--mono);font-size:14rem;text-align:right}
.checks{margin:16rem 4rem 0;display:flex;flex-direction:column;gap:9rem;font-size:15rem}
.checks .y{color:var(--pos);font-weight:700;width:22rem;display:inline-block}
.checks .n{color:var(--neg);font-weight:700;width:22rem;display:inline-block}
.bigbtn{position:relative;overflow:hidden;margin-top:20rem;height:56rem;border-radius:999rem;background:var(--btn);color:#fff;font-size:17rem;font-weight:600;display:flex;align-items:center;justify-content:center}
.ripple{position:absolute;left:50%;top:50%;width:60rem;height:60rem;margin:-30rem 0 0 -30rem;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);opacity:0;will-change:transform,opacity}
.demo-note{margin-top:10rem;text-align:center;font-size:12px;color:#8b919c;font-family:var(--inter)}
.theme-c .demo-note{color:#8a8f99}

/* --- en-tête des écrans 4 et 5 --- */
.hdr{display:flex;align-items:center;gap:12rem;height:56rem}
.hdr .logo{width:44rem;height:44rem}
.hdr .nm{font-family:var(--outfit);font-weight:700;font-size:28rem;white-space:nowrap}
.mpill{padding:4rem 10rem;border-radius:8rem;background:var(--pill);color:var(--sub);font-family:var(--mono);font-size:13rem;white-space:nowrap}
.rpill{margin-left:auto;display:flex;align-items:center;gap:8rem;height:36rem;padding:0 14rem;border-radius:999rem;border:1px solid var(--line);background:var(--card);font-family:var(--mono);font-size:14rem;white-space:nowrap;box-shadow:var(--shadow)}
.rpill .dot{width:9rem;height:9rem}
.rpill.btn{font-family:var(--inter);font-weight:700;color:#fff;border:none}
.pad{position:absolute;inset:0;padding:22rem 24rem 30rem}
.theme-c .pad{padding-top:10rem}

/* --- écran 4 : mise en place --- */
.s4 .subrow{display:flex;justify-content:space-between;margin:14rem 0 16rem;font-family:var(--mono);font-size:14rem;color:var(--sub)}
.s4 .subrow .on{color:var(--pos)}
.repo{position:relative;border-radius:22rem;background:var(--card);padding:16rem 18rem;margin-bottom:12rem;will-change:transform,opacity;opacity:0}
.theme-b .repo{background:#12141a;border:1.5px solid var(--rc55)}
.theme-c .repo{border:1px solid var(--line);box-shadow:0 2rem 8rem rgba(0,0,0,.05)}
.repo .l1{display:flex;align-items:center;gap:10rem}
.repo .cd{width:9rem;height:9rem;border-radius:50%;background:var(--rc);flex:none}
.repo .rn{font-family:var(--mono);font-weight:700;font-size:17rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repo .rr{margin-left:auto;font-family:var(--mono);font-size:14rem;color:var(--amber);white-space:nowrap}
.repo .l2{margin:6rem 0 10rem;color:var(--sub);font-size:15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8rem;flex-wrap:wrap}
.achip{display:inline-flex;align-items:center;gap:7rem;padding:4rem 10rem 4rem 6rem;border-radius:14rem;border:1.5px solid var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent);color:var(--ac);font-family:var(--mono);font-size:12rem;font-weight:700}
.achip .stt{font-weight:400;font-size:13rem}
.ghost{opacity:.35;border-radius:22rem;background:var(--card);border:1px dashed var(--sub);padding:14rem 18rem;font-family:var(--mono);font-size:13rem;color:var(--sub)}
.ghost .gt{display:flex;justify-content:space-between;font-family:var(--outfit);font-size:17rem;font-weight:700;color:var(--text);margin-bottom:6rem}
.ghost .gt span{font-family:var(--mono);font-size:13rem;color:var(--pos)}
.theme-b .s4 .repo{padding:14rem 18rem;margin-bottom:10rem}

/* --- écran 5 : tableau de bord live --- */
.live-scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.live-scroll::-webkit-scrollbar{display:none}
.theme-c .live-scroll{top:70rem}
.live{padding:14rem 24rem 40rem}
.tape{position:relative;height:44rem;margin:12rem -24rem 0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tape-in{position:absolute;left:0;top:0;height:44rem;display:flex;gap:10rem;white-space:nowrap;will-change:transform}
.tchip{display:inline-flex;align-items:center;gap:8rem;height:44rem;padding:0 14rem 0 9rem;border-radius:999rem;background:var(--chipbg);border:1px solid var(--line);font-size:15rem;box-shadow:var(--shadow)}
.tchip .tt{font-weight:700;color:var(--text)}
.tchip .tp{font-family:var(--mono);font-size:14rem}
.tchip .td{font-family:var(--mono);font-size:13rem;color:var(--sub)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.lsub{margin-top:14rem;font-family:var(--mono);font-size:14rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eqrow{display:flex;align-items:center;justify-content:space-between;margin-top:6rem}
.eq{font-family:var(--inter);font-weight:700;font-size:56rem;letter-spacing:-.02em;line-height:1.1;color:var(--text);transition:color .6s}
.eq .c{opacity:.4}
.eq.flash-up{color:var(--pos)!important}.eq.flash-down{color:var(--neg)!important}
.dpill{padding:6rem 12rem;border-radius:999rem;background:var(--dpill-bg);color:var(--dpill-fg);font-family:var(--mono);font-weight:700;font-size:16rem}
.dpill.neg{background:color-mix(in srgb,var(--neg) 15%,transparent);color:var(--neg)}
.pillrow{display:flex;gap:8rem;align-items:center;margin-top:4rem}
.inpill{padding:6rem 14rem;border-radius:999rem;background:var(--pill);font-family:var(--mono);font-size:18rem;color:var(--text)}
.mulpill{padding:6rem 14rem;border-radius:999rem;background:var(--mul-bg);color:var(--mul-fg);font-family:var(--mono);font-weight:700;font-size:18rem}
.resrow{display:flex;justify-content:space-between;margin-top:12rem;font-family:var(--mono);font-size:16rem}
.resrow .tm{color:var(--sub)}
.curve{display:block;width:492rem;height:190rem;margin-top:12rem;overflow:visible}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12rem;color:var(--sub);margin-top:6rem;white-space:pre}
.card{margin-top:14rem;border-radius:22rem;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);padding:14rem 16rem}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8rem}
.card-h .ct{font-weight:700;font-size:22rem;color:var(--text)}
.card-h .cr{font-family:var(--mono);font-size:14rem;color:var(--pos);display:flex;align-items:center;gap:6rem}
.card-h .cr .dot{width:8rem;height:8rem;background:var(--pos)}
.logs{position:relative}
.lrow{display:flex;align-items:center;gap:8rem;height:34rem;font-family:var(--mono);font-size:15rem;white-space:nowrap;transition:opacity .3s}
.lrow .tm{color:var(--sub);font-size:16rem}
.lrow .sd{font-weight:700}
.lrow .sd.buy{color:var(--buy)} .lrow .sd.sell{color:var(--sell)}
.lrow .tk{color:var(--text);font-weight:600}
.lrow .dt{color:var(--sub);overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.lrow .dt b{font-weight:500}
.agrow{display:flex;align-items:center;gap:10rem;height:46rem;font-size:15rem}
.agrow+.agrow{border-top:1px solid var(--line)}
.agrow .an{font-family:var(--mono);font-weight:700;font-size:14rem;width:84rem;flex:none}
.agrow .ax{flex:1;min-width:0;color:var(--text);font-family:var(--mono);font-size:13.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;will-change:opacity}
.tagpill{flex:none;padding:3rem 9rem;border-radius:8rem;background:var(--tag);color:var(--sub);font-family:var(--mono);font-size:12rem}
.core{display:block;width:492rem;height:250rem;margin:4rem -8rem 0}
.core text{font-family:var(--mono);font-size:12px;font-weight:700}
.urow{display:flex;align-items:center;gap:10rem;height:40rem}
.urow+.urow{border-top:1px solid var(--line)}
.urow .un{font-family:var(--mono);font-size:17rem;color:var(--text);white-space:nowrap}
.urow .us{font-family:var(--mono);font-size:13rem;color:var(--sub)}
.urow .uc{margin-left:auto;font-family:var(--mono);font-size:14rem;color:var(--pos);white-space:nowrap}

/* toasts */
.toast{position:absolute;left:16rem;right:16rem;top:14rem;z-index:40;display:flex;align-items:center;gap:12rem;padding:14rem 16rem;border-radius:26rem;background:var(--toast);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transform:translateY(-140%);will-change:transform,opacity;box-shadow:0 10rem 30rem rgba(0,0,0,.25)}
.theme-c .toast{top:76rem;box-shadow:0 10rem 30rem rgba(0,0,0,.12);border:1px solid #ececf0}
.toast .ti{width:42rem;height:42rem;border-radius:11rem;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;background:#161616}
.toast .ti .logo{width:42rem;height:42rem}
.toast .tx{flex:1;min-width:0}
.toast .t1{font-weight:700;font-size:17rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .t2{color:var(--sub);font-size:14rem;margin-top:2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .av{width:34rem;height:34rem;font-size:15rem}

/* --- écran 6 : récap --- */
.veil{position:absolute;inset:0;z-index:20;opacity:0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.theme-b .veil{background:rgba(0,0,0,.55)}
.theme-c .veil{background:rgba(120,124,132,.35)}
.recap{z-index:30;min-height:75%;padding-bottom:40rem}
.rc-h{display:flex;align-items:center;gap:14rem}
.rc-h .logo{width:56rem;height:56rem}
.rc-t{font-family:var(--outfit);font-weight:700;font-size:32rem}
.rc-s{font-family:var(--mono);font-size:13rem;color:var(--sub);margin-top:2rem}
.rc-l{margin-top:18rem;color:var(--sub);font-size:18rem}
.rc-big{font-family:var(--inter);font-weight:700;font-size:56rem;letter-spacing:-.02em;line-height:1.1}
.rc-now{display:flex;align-items:center;justify-content:space-between}
.rc-now .rc-big{color:var(--pos)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10rem;margin-top:18rem}
.tilex{border-radius:16rem;background:var(--tile);padding:12rem 12rem}
.tilex .k{color:var(--sub);font-size:15rem}
.tilex .v{font-family:var(--mono);font-weight:700;font-size:36rem;margin-top:2rem}
.rc-lines{margin-top:16rem;font-family:var(--mono);font-size:16rem;display:flex;flex-direction:column;gap:9rem}
.rc-lines .ln{display:flex;align-items:center;gap:8rem;white-space:nowrap}
.rc-lines .g{color:var(--sub)}
.cta{margin-top:22rem;height:70rem;border-radius:999rem;background:var(--cta-bg);color:var(--cta-fg);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:19rem;cursor:pointer;user-select:none}
.cta:active{transform:scale(.98)}

/* =========================================================
   UI — sélecteur de scène, bandeau, réglages
   ========================================================= */
#chip{position:fixed;left:12px;bottom:12px;z-index:1000;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;max-width:calc(100vw - 24px);padding:6px 10px;border-radius:12px;background:rgba(14,16,22,.82);border:1px solid rgba(255,255,255,.12);color:#e9ecf3;font-family:var(--mono);font-size:11px;opacity:.5;transition:opacity .2s;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#chip:hover,#chip:focus-within{opacity:1}
#chip button,#chip select{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 5px;cursor:pointer}
#chip button:hover{border-color:rgba(255,255,255,.25)}
#chip button.act{background:rgba(255,255,255,.14)}
#chip .sep{opacity:.35}
#chip .sc b{color:#fff}
#chip .grp{display:inline-flex;align-items:center;gap:2px}
#chip select{background:#151821;border-color:rgba(255,255,255,.15)}
#chip select option:disabled{color:#666}
#chip .pm{opacity:.7}
#chip .more{display:contents}
#chip .morebtn{display:none}
@media (max-width:599px){
  #chip .morebtn{display:inline-block}
  #chip .more{display:none}
  #chip.open .more{display:contents}
  #modeBadge{bottom:auto;top:auto;bottom:12px}
}
#modeBadge{position:fixed;right:12px;bottom:12px;z-index:1000;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(14,16,22,.85);border:1px solid rgba(255,255,255,.14);color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.06em;pointer-events:none}
#modeBadge .dot{width:8px;height:8px}
#banner{position:fixed;left:50%;top:10px;z-index:1001;transform:translate(-50%,-160%);padding:7px 14px;border-radius:999px;background:rgba(40,30,10,.92);border:1px solid rgba(246,183,60,.5);color:#f6d38c;font-family:var(--mono);font-size:12px;transition:transform .35s ease;pointer-events:none}
#banner.show{transform:translate(-50%,0)}
#settings{position:fixed;left:12px;bottom:64px;z-index:1002;width:320px;max-width:calc(100vw - 24px);padding:14px;border-radius:14px;background:#12141b;border:1px solid rgba(255,255,255,.14);color:#e9ecf3;font-family:var(--mono);font-size:12px;display:none;box-shadow:0 20px 50px rgba(0,0,0,.5)}
#settings.show{display:block}
#settings h4{margin:0 0 8px;font-family:var(--outfit);font-size:15px}
#settings label{display:block;margin:8px 0 4px;color:#9aa3b8}
#settings input[type=password],#settings input[type=text]{width:100%;padding:7px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.16);background:#0b0c10;color:#fff;font:inherit}
#settings .note{margin-top:8px;color:#8c94a9;line-height:1.45;font-size:11px}
#settings .row{display:flex;align-items:center;gap:8px;margin-top:6px}
#settings button{font:inherit;color:#fff;background:#262a35;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:5px 10px;cursor:pointer}
#settings .status{margin-top:6px;color:#f6b73c;min-height:14px}

/* =========================================================
   Accessibilité : mouvement réduit
   ========================================================= */
@media (prefers-reduced-motion: reduce){
  .pulse,.a-tile.on .orb,#sceneA .glow,.a-chart .ring,.pd.run::after{animation:none!important}
  .a-chart .ring{opacity:0}
}

/* =========================================================
   Ajouts sim.html : panneau de session, récap A, légendes
   ========================================================= */
.a-tile .cap{position:relative;font-family:var(--mono);font-size:8.5rem;color:#8c94a9;max-width:136rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-5rem}
.a-tiles .nm{font-size:16rem}
.a-agents .a-tile{gap:7rem}
.dot.idle{background:#8c94a9}
.a-recap{position:absolute;left:50%;top:50%;width:520rem;transform:translate(-50%,-46%);padding:24rem 28rem;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;background:linear-gradient(180deg,rgba(30,34,52,.96),rgba(10,13,24,.97));z-index:30;--text:#fff;--sub:#8c94a9;--pos:#34e8a0;--neg:#ff5c75;--tile:rgba(255,255,255,.05);--mul-bg:#f4f4f4;--mul-fg:#000;--cta-bg:#f2f2f2;--cta-fg:#000}
.a-recap.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.a-recap .rc-h .logo{width:56rem;height:56rem}
.a-recap .rc-big{font-size:44rem}
.rc-big.negv{color:var(--neg)!important}
#panel{position:fixed;right:0;top:0;bottom:0;width:340px;max-width:100vw;z-index:1003;overflow-y:auto;background:rgba(14,16,22,.97);border-left:1px solid rgba(255,255,255,.12);color:#e9ecf3;font-family:var(--mono);font-size:11.5px;padding:12px 14px 80px;transform:translateX(105%);transition:transform .3s ease;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#panel.show{transform:none}
#panel .ph{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#panel .ph b{font-family:var(--outfit);font-size:15px}
#panel .stchip{padding:2px 7px;border-radius:99px;background:rgba(255,255,255,.08);color:#f6b73c;font-size:10px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel .x{margin-left:auto;background:none;border:none;color:#aaa;font-size:15px;cursor:pointer}
#panel .honest{padding:8px 10px;border-radius:8px;background:rgba(246,183,60,.08);border:1px solid rgba(246,183,60,.35);color:#f6d38c;line-height:1.45;margin-bottom:8px}
#panel .sec{margin:14px 0 6px;color:#9aa3b8;text-transform:uppercase;letter-spacing:.1em;font-size:10px;border-top:1px solid rgba(255,255,255,.08);padding-top:10px}
#panel .fl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0;color:#c9cfdb}
#panel .fl.ck{justify-content:flex-start}
#panel input[type=number],#panel select{width:118px;flex:none;padding:5px 6px;border-radius:7px;border:1px solid rgba(255,255,255,.16);background:#0b0c10;color:#fff;font:inherit}
#panel label.fl>select[data-p=src]{width:100%;margin-top:4px}
#panel label.fl:has(select[data-p=src]){flex-direction:column;align-items:stretch}
#panel input:disabled{opacity:.45}
#panel .btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
#panel button{font:inherit;color:#fff;background:#262a35;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:6px 10px;cursor:pointer}
#panel button:disabled{opacity:.4;cursor:default}
#panel button.pri{background:#1f9d55;border-color:#1f9d55}
#panel .feedst{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.04);line-height:1.5;color:#b8bfcc}
#panel .g{color:#34e8a0}#panel .r{color:#ff5c75}
#panel .note{color:#8c94a9;line-height:1.45;margin:6px 0}
#panel table{width:100%;border-collapse:collapse;font-size:10.5px}
#panel td,#panel th{padding:3px 2px;border-bottom:1px solid rgba(255,255,255,.06);text-align:right;vertical-align:top}
#panel td:first-child,#panel th:first-child{text-align:left}
#panel td.sub{color:#9aa3b8;text-align:left;padding-top:8px}
#panel .hrow{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);line-height:1.45;color:#c9cfdb}
#chip button.act{background:rgba(255,255,255,.14)}
@media (max-width:599px){#panel{width:100vw}}

/* fondu en haut du journal pour éviter les lignes coupées */
.a-feed{-webkit-mask-image:linear-gradient(transparent,#000 22%);mask-image:linear-gradient(transparent,#000 22%)}

/* =========================================================
   v2 : tableau de bord global, équipage IA de la scène A, toasts, infobulles
   ========================================================= */
#sceneA.on{display:flex;justify-content:center;align-items:safe center;overflow:auto}
#sceneA .a-board{position:relative;left:auto;top:auto;margin:8rem auto;height:950rem;flex:none}
#sceneA .glows{position:fixed}
.a-head{height:66rem}
.a-stats{grid-template-columns:1.1fr 1.1fr 1fr 1fr;grid-template-rows:78rem}
.a-val.red{color:var(--a-loss)}
.a-mid{height:236rem}
.a-chart{height:176rem}
.a-feed{height:119rem}
.a-card{position:relative}
.a-empty{position:absolute;inset:40rem 20rem 20rem;display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--mono);font-size:11rem;line-height:1.6;color:var(--a-label);background:rgba(10,13,24,.55);border-radius:12rem}
.a-empty b{color:#fff}
[data-tip]{cursor:help}
button[data-tip],a[data-tip]{cursor:pointer}
/* équipage */
.a-crew{height:470rem;padding:14rem;display:flex;flex-direction:column;gap:10rem}
.cr-top{display:grid;grid-template-columns:580rem 1fr;gap:12rem;height:188rem}
.cr-graph{width:100%;height:100%;overflow:visible}
.cr-graph .edge{fill:none;stroke:rgba(255,255,255,.13);stroke-width:1.6;transition:stroke .3s}
.cr-graph .edge.hot{stroke:rgba(140,170,255,.85);stroke-dasharray:5 4;animation:flow .6s linear infinite}
.cr-graph .edge.loop.hot{stroke:rgba(167,139,250,.75)}
.cr-graph .edge.feedin.hot{stroke:rgba(59,130,246,.8)}
@keyframes flow{to{stroke-dashoffset:-18}}
.cr-graph .gsrc,.cr-graph .gsm{font-family:var(--mono);font-size:8.5px;fill:#8c94a9}
.gn .nb{fill:rgba(255,255,255,.03);stroke:color-mix(in srgb,var(--c) 40%,transparent);stroke-width:1.3;transition:fill .3s,stroke .3s}
.gn .nd{fill:#5d667c}
.gn .gname{font-family:var(--outfit);font-weight:700;font-size:13px;fill:#c9cfdb;letter-spacing:.06em}
.gn .grole{font-family:var(--mono);font-size:8px;fill:#8c94a9}
.gn.working .nb{fill:color-mix(in srgb,var(--c) 10%,transparent);stroke:var(--c)}
.gn.working .nd{fill:#34e8a0}
.gn.working .gname,.gn.thinking .gname{fill:#fff}
.gn.thinking .nb{fill:color-mix(in srgb,var(--c) 26%,transparent);stroke:var(--c);stroke-width:2.2;filter:drop-shadow(0 0 6px var(--c))}
.gn.thinking .nd{fill:var(--c);animation:pulse .8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.gn.waiting .nd{fill:#f6b73c}
.gn.paused .nd{fill:#f6b73c}
.badge circle{fill:#1f2433;stroke:#fff;stroke-width:1}
.badge text{font-size:10px;font-weight:700;fill:#fff}
.badge.ok circle{fill:#1f9d55;stroke:#34e8a0}
.badge.no circle{fill:#9b2335;stroke:#ff5c75}
.badge.q circle{fill:#4b3a8f;stroke:#a78bfa}
.chip rect{fill:#1b2235;stroke:#5aa5ff;stroke-width:1.2}
.chip text{font-family:var(--mono);font-size:8.5px;font-weight:600;fill:#fff}
.chip.ok rect{fill:#123526;stroke:#34e8a0}
.chip.no rect{fill:#3a1520;stroke:#ff5c75}
.chip.q rect{fill:#241d42;stroke:#a78bfa;stroke-dasharray:3 2}
.cr-cons{border-radius:12rem;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);padding:9rem 11rem;font-family:var(--mono);font-size:9.5rem;color:#c9cfdb;overflow:hidden;display:flex;flex-direction:column;gap:3.5rem}
.cs-empty{margin:auto;text-align:center;line-height:1.6;color:var(--a-label);font-size:10.5rem;padding:0 10rem}
.cs-empty b{color:#fff}
.cs-h{display:flex;align-items:baseline;gap:7rem;font-size:9rem;letter-spacing:.1em;color:var(--a-label);margin-bottom:2rem}
.cs-h b{font-size:12rem;color:#fff;letter-spacing:.02em}
.cs-h span{margin-left:auto;letter-spacing:0}
.cs-r{display:flex;gap:6rem;align-items:baseline;white-space:nowrap;overflow:hidden}
.cs-r b{width:38rem;flex:none;font-weight:700}
.cs-r span{overflow:hidden;text-overflow:ellipsis;color:#aeb5c4}
.cs-r i,.cs-out i{font-style:normal;width:11rem;flex:none;font-weight:700}
i.ok{color:var(--a-win)} i.no{color:var(--a-loss)} i.pend{color:#5d667c}
.cs-v{display:flex;gap:8rem;align-items:center;color:#aeb5c4;transition:opacity .3s}
.cs-v .dots{display:flex;gap:3rem}
.cs-v .dots span{width:8rem;height:8rem;border-radius:50%}
.cs-v .bull{background:var(--a-win)} .cs-v .bear{background:rgba(255,92,117,.55)}
.cs-v .sc{margin-left:auto;color:#fff}
.dimq{opacity:.35}
.cs-bar{position:relative;height:5rem;border-radius:9rem;background:rgba(255,255,255,.08);margin:1rem 0 2rem}
.cs-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:9rem;background:linear-gradient(90deg,#5aa5ff,#34e8a0);transition:width .5s}
.cs-bar u{position:absolute;top:-3rem;bottom:-3rem;width:2rem;background:#f6b73c;border-radius:1rem}
.cs-out{margin-top:auto;padding:5rem 8rem;border-radius:8rem;font-weight:600;font-size:9.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-out.ok{background:rgba(52,232,160,.12);color:var(--a-win);border:1px solid rgba(52,232,160,.4)}
.cs-out.no{background:rgba(255,92,117,.10);color:#ff8a9c;border:1px solid rgba(255,92,117,.35)}
.cs-out.pend{background:rgba(90,165,255,.08);color:#8cc2ff;border:1px solid rgba(90,165,255,.25)}
.cr-cards{display:grid;grid-template-columns:repeat(6,1fr);gap:9rem;flex:1;min-height:0}
.cr-card{position:relative;border-radius:14rem;padding:10rem;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:5rem;overflow:hidden;transition:border-color .3s,box-shadow .3s,background .3s}
.cr-card::before{content:'';position:absolute;left:0;right:0;top:0;height:3rem;background:var(--c);opacity:.5}
.cr-card.working{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.cr-card.thinking{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent);box-shadow:0 0 16rem color-mix(in srgb,var(--c) 30%,transparent)}
.cc-h{display:flex;align-items:center;gap:8rem}
.cr-card .orb{width:26rem;height:26rem;flex:none}
.cr-card.thinking .orb,.cr-card.working .orb{animation:breathe 1.4s ease-in-out infinite}
.cc-nm{min-width:0}
.cc-n{font-family:var(--outfit);font-weight:700;font-size:14rem;letter-spacing:.06em;color:#fff}
.cc-r{font-family:var(--mono);font-size:8rem;color:var(--a-label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{margin-left:auto;width:7rem;height:7rem;border-radius:50%;background:#3a4052;flex:none}
.hb.on{animation:beat .5s ease-out}
@keyframes beat{0%{background:var(--c);box-shadow:0 0 0 0 var(--c)}100%{background:#3a4052;box-shadow:0 0 0 6rem transparent}}
.cc-st{align-self:flex-start;font-family:var(--mono);font-size:8rem;letter-spacing:.12em;padding:2rem 6rem;border-radius:99rem;background:rgba(255,255,255,.06);color:#8c94a9}
.cr-card.working .cc-st{background:rgba(52,232,160,.12);color:var(--a-win)}
.cr-card.thinking .cc-st{background:color-mix(in srgb,var(--c) 22%,transparent);color:#fff}
.cr-card.waiting .cc-st,.cr-card.paused .cc-st{background:rgba(246,183,60,.12);color:var(--a-warn)}
.cc-tk{font-family:var(--mono);font-size:9rem;color:var(--a-label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-tk b{color:#fff;font-size:10.5rem}
.cc-d{flex:1;min-height:0;font-family:var(--mono);font-size:8.6rem;line-height:1.45;color:#c9cfdb;white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;word-break:break-word}
.cc-c{display:flex;gap:6rem;flex-wrap:wrap;font-family:var(--mono);font-size:8.4rem;color:#9aa3b8}
.cc-c .g{color:var(--a-win)} .cc-c .r{color:var(--a-loss)}
.cc-bar{height:3rem;border-radius:3rem;background:rgba(255,255,255,.07);overflow:hidden}
.cc-bar i{display:block;height:100%;background:var(--c);transition:width .5s}
.a-recap{cursor:pointer}
/* A sur téléphone : empilé, défilant */
body.mobile #sceneA .a-board{width:560rem;height:auto;padding:12rem;gap:10rem;margin:0 auto 70px}
body.mobile #sceneA.on{align-items:flex-start}
body.mobile .a-head{height:auto}
body.mobile .a-pill{width:auto}
body.mobile .a-mode{margin-left:4rem}
body.mobile .a-stats{grid-template-columns:1fr 1fr;grid-template-rows:auto}

body.mobile .a-mid{grid-template-columns:1fr;height:auto}
body.mobile .a-card{height:250rem}
body.mobile .a-chart{width:100%}
body.mobile .a-crew{height:auto}
body.mobile .cr-top{grid-template-columns:1fr;height:auto}

body.mobile .cr-card{min-height:210rem}

body.mobile .a-recap{width:520rem}

/* ---------- tableau de bord global ---------- */
body[data-scene=dashboard]{background:radial-gradient(1200px 700px at 15% -10%,rgba(80,100,255,.16),transparent),radial-gradient(900px 600px at 100% 0%,rgba(46,212,127,.08),transparent),#080a12}
#sceneD{overflow-y:auto;overflow-x:hidden;font-family:var(--inter);font-size:14px;color:#e6e9f2;-webkit-overflow-scrolling:touch}
#sceneD.on{animation:fadein .35s ease}
.scene.on{animation:fadein .3s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.d-wrap{max-width:1360px;margin:0 auto;padding:18px 20px 90px;display:flex;flex-direction:column;gap:14px}
.d-top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.d-brand{display:flex;align-items:center;gap:12px}
.d-brand .logo{width:40px;height:40px;flex:none}
.d-ttl{font-family:var(--outfit);font-weight:700;font-size:24px;color:#fff;letter-spacing:.01em}
.d-ttl b{color:var(--a-brand)}
.d-ttl span{font-weight:500;color:#9aa3b8;font-size:18px;margin-left:6px}
.d-sub{font-size:12px;color:#8c94a9;margin-top:2px}
.d-ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#sceneD button,#sceneD select,#sceneD input{font:inherit;font-size:12.5px;color:#e6e9f2;background:#171b27;border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:7px 11px;cursor:pointer;transition:background .2s,border-color .2s,transform .1s}
#sceneD button:hover{background:#20263a;border-color:rgba(255,255,255,.25)}
#sceneD button:active{transform:scale(.97)}
#sceneD button:disabled{opacity:.4;cursor:default}
#sceneD button.pri{background:linear-gradient(180deg,#22b264,#1a8f50);border-color:#22b264;color:#fff;font-weight:600}
#sceneD button.ghost{background:transparent}
#sceneD button.act{background:#2a3350;border-color:#5a6fd6}
#sceneD input{cursor:text;width:120px}
.d-feed{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11.5px;color:#aeb5c4;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.fd{width:8px;height:8px;border-radius:50%;background:#5d667c;display:inline-block}
.fd.g{background:#34e8a0;box-shadow:0 0 0 0 rgba(52,232,160,.6);animation:ping 1.6s infinite}
.fd.w{background:#f6b73c} .fd.r{background:#ff5c75}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,232,160,.6)}100%{box-shadow:0 0 0 8px rgba(52,232,160,0)}}
.d-paper{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:12px;background:rgba(246,183,60,.07);border:1px solid rgba(246,183,60,.3);color:#f2d79c;font-size:12.5px;line-height:1.45}
.d-paper .dot{background:#f6b73c;flex:none}
.d-paper b{color:#f6b73c;letter-spacing:.06em}
.d-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.k-tile,.d-card,.d-bot{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.09);border-radius:16px}
.k-tile{padding:12px 14px;min-width:0}
.k-l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8c94a9}
.k-v{font-family:var(--outfit);font-weight:700;font-size:24px;color:#fff;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-s{font-size:11.5px;color:#8c94a9;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sceneD .g{color:#34e8a0} #sceneD .r{color:#ff6b81}
.d-bots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.d-bot{padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.d-bot::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:var(--c);opacity:.7}
.d-bot.running{border-color:color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 0 30px -12px var(--c)}
.b-h{display:flex;align-items:center;gap:10px}
.b-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--outfit);font-weight:700;font-size:17px;color:#0b0c10;background:var(--c);flex:none}
.b-t{min-width:0}
.b-n{font-family:var(--outfit);font-weight:600;font-size:16px;color:#fff}
.b-s{font-size:11.5px;color:#8c94a9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-st{margin-left:auto;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.07);color:#9aa3b8;white-space:nowrap}
.b-st.running{background:rgba(52,232,160,.14);color:#34e8a0}
.b-st.paused{background:rgba(246,183,60,.14);color:#f6b73c}
.b-st.ended{background:rgba(90,165,255,.14);color:#8cc2ff}
.b-eq{display:flex;align-items:baseline;gap:10px;font-family:var(--outfit);font-weight:700;font-size:28px;color:#fff}
.b-pnl{font-size:14px;font-weight:600}
.b-spark{width:100%;height:56px;display:block}
.b-spark .ln{fill:none;stroke:var(--c);stroke-width:2;vector-effect:non-scaling-stroke}
.b-spark .ln.dn{stroke:#ff6b81}
.b-spark .ar{fill:color-mix(in srgb,var(--c) 14%,transparent)}
.b-spark .stk{stroke:rgba(255,255,255,.2);stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.b-m{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.b-m div{display:flex;flex-direction:column;gap:1px;min-width:0}
.b-m span{font-size:10.5px;color:#8c94a9;text-transform:uppercase;letter-spacing:.06em}
.b-m b{font-size:13px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-ag{display:flex;flex-wrap:wrap;gap:5px}
.ad{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;padding:3px 7px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#8c94a9}
.ad i{width:6px;height:6px;border-radius:50%;background:#5d667c}
.ad.on{color:#fff;border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.ad.on i{background:var(--c);animation:pulse 1.2s ease-in-out infinite}
.ad.wait i{background:#f6b73c}
.b-a{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.b-a .open{margin-left:auto;color:var(--c);text-decoration:none;font-weight:600;font-size:13px;padding:6px 4px}
.b-a .open:hover{text-decoration:underline}
.d-row{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
.d-card{padding:14px;min-width:0}
.c-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.c-h h3{margin:0;font-family:var(--outfit);font-weight:600;font-size:16px;color:#fff;display:flex;align-items:center;gap:7px}
.c-h .cnt{font-family:var(--inter);font-weight:500;font-size:12.5px;color:#8c94a9}
.c-note{font-size:12px;color:#8c94a9}
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.07)}
#sceneD .seg button{border:none;background:transparent;padding:5px 10px;border-radius:7px;font-size:12px;color:#9aa3b8}
#sceneD .seg button.act{background:#2a3350;color:#fff}
.tipi{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:10.5px;font-weight:700;color:#9aa3b8;border:1px solid rgba(255,255,255,.25);cursor:help;font-family:var(--inter)}
.c-box{position:relative;height:250px}
.d-chart{position:absolute;left:62px;right:0;top:0;bottom:22px;width:calc(100% - 62px);height:calc(100% - 22px)}
.d-chart .grid{stroke:rgba(255,255,255,.05)} .d-chart .base{stroke:rgba(255,255,255,.25);stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.c-y{position:absolute;left:0;top:0;bottom:22px;width:58px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:#8c94a9;text-align:right}
.c-x{position:absolute;left:62px;right:0;bottom:0;height:18px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:#8c94a9}
.c-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:#aeb5c4}
.c-leg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.d-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#8c94a9;font-size:13px;padding:20px;border:1px dashed rgba(255,255,255,.1);border-radius:12px}
.d-empty.in{position:static;min-height:120px}
.d-empty b{color:#fff}
.d-list{height:282px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding-right:4px}
.a-it{display:flex;align-items:baseline;gap:8px;padding:5px 8px;border-radius:8px;font-size:12px;line-height:1.4;animation:fadein .4s ease}
.a-it:hover{background:rgba(255,255,255,.04)}
.a-it .tm{font-family:var(--mono);font-size:10.5px;color:#6b7387;flex:none}
.a-it .ic{flex:none;width:12px;text-align:center;color:#8c94a9}
.a-it .tx{color:#c9cfdb;font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.a-it.buy .ic{color:#5aa5ff} .a-it.buy .tx{color:#cfe3ff}
.a-it.win .ic,.a-it.win .tx{color:#34e8a0} .a-it.loss .ic,.a-it.loss .tx{color:#ff8a9c}
.a-it.skip .tx{color:#9aa3b8}
.bt{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 5px;border-radius:6px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);font-family:var(--outfit);font-weight:700;font-size:11.5px;flex:none}
.t-wrap{overflow-x:auto;max-height:420px;overflow-y:auto}
.d-t{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
.d-t th{position:sticky;top:0;background:#121623;text-align:left;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8c94a9;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
.d-t td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.05);color:#d5d9e3;font-variant-numeric:tabular-nums}
.d-t tr:hover td{background:rgba(255,255,255,.025)}
.d-t tr.live td{background:rgba(52,232,160,.04)}
.d-t small{color:#8c94a9;font-size:11px}
.d-t td.g small,.d-t td.r small{color:inherit;opacity:.8}
.d-t a{color:#8cc2ff;text-decoration:none} .d-t a:hover{text-decoration:underline}
.d-t td.empty{text-align:center;color:#8c94a9;padding:22px;white-space:normal}
.fl{display:flex;gap:6px;flex-wrap:wrap}
.h-sum{font-size:12.5px;color:#aeb5c4;margin:-2px 0 8px}
.d-foot{font-size:11.5px;color:#6b7387;line-height:1.6;text-align:center;padding:4px 10px}
.d-foot b{color:#9aa3b8}
/* toasts + infobulle */
#toasts{position:fixed;top:56px;right:14px;z-index:1004;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 28px));pointer-events:none}
.toast2{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(18,21,32,.94);border:1px solid rgba(255,255,255,.12);border-left:3px solid var(--c);box-shadow:0 12px 30px rgba(0,0,0,.4);color:#e6e9f2;font-family:var(--inter);cursor:pointer;transform:translateX(30px);opacity:0;transition:transform .3s ease,opacity .3s ease;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.toast2.in{transform:none;opacity:1}
.toast2 .tb{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--c);color:#0b0c10;font-family:var(--outfit);font-weight:700;flex:none}
.toast2 .tt{min-width:0;flex:1}
.toast2 .t1{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast2 .t2{font-size:11.5px;color:#9aa3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast2.win .t1{color:#34e8a0} .toast2.loss .t1{color:#ff8a9c}
.toast2 button{background:none;border:none;color:#8c94a9;cursor:pointer;font-size:13px}
#tip{position:fixed;z-index:1006;max-width:300px;padding:8px 11px;border-radius:10px;background:rgba(10,12,20,.97);border:1px solid rgba(255,255,255,.16);color:#dfe3ef;font-family:var(--inter);font-size:12px;line-height:1.45;pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .15s,transform .15s;box-shadow:0 10px 28px rgba(0,0,0,.45)}

#panel .botsel{display:flex;align-items:center;gap:5px;margin-bottom:10px;flex-wrap:wrap}
#panel .botsel span{color:#9aa3b8;margin-right:4px}
#panel .botsel button.act{background:#2a3350;border-color:#5a6fd6}
#chip{opacity:.85}
@media (max-width:1100px){.d-kpis{grid-template-columns:repeat(3,1fr)}.d-bots{grid-template-columns:1fr 1fr}.d-row{grid-template-columns:1fr}}
@media (max-width:760px){
  .d-wrap{padding:12px 12px 110px;gap:12px}
  .d-kpis{grid-template-columns:1fr 1fr;gap:8px}

const U = {
  clamp: (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)),

  prog(t, a, b) { return U.clamp((t - a) / (b - a)); },
  easeOut: f => 1 - Math.pow(1 - f, 3),
  easeInOut: f => (f < .5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2),

  rng(seed) {

    return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  pick(arr, r) { return arr[Math.floor(r * arr.length) % arr.length]; },
  rr(r, a, b) { return a + (b - a) * r; },
  ri(r, a, b) { return Math.floor(a + (b - a + 1) * r); },

  sUsd(v, d = 2) { return (v < 0 ? '-$' : '+$') + U.fmt(v, d); },

  spline(pts) {
    if (pts.length < 2) return pts.length ? `M${pts[0][0]},${pts[0][1]}` : '';

    for (let i = 0; i < pts.length - 1; i++) {
