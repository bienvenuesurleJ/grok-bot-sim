/* ========================= FEED : DexScreener (lecture seule) ========================= */
const API = 'https://api.dexscreener.com';
const DISCOVERY = [
  ['boosts/latest', '/token-boosts/latest/v1'], ['profiles/latest', '/token-profiles/latest/v1'],
  ['boosts/top', '/token-boosts/top/v1'], ['takeovers/latest', '/community-takeovers/latest/v1'],
];
const Feed = {
  mode: 'live', /* 'live' (réel) ou 'practice' (synthétique, choisi explicitement) */
  tokens: new Map(), watch: [], queue: [], busy: false, lastReq: 0, minGap: 1050,
  fails: 0, backoffUntil: 0, offline: false, probeAt: 0,
  stats: { req: 0, ok: 0, err: 0, r429: 0, stale: 0, lastErr: '', lastOk: 0, bytes: 0 },
  discIdx: 0, nextDisc: 0, nextHeld: 0, nextWatch: 0, watchIdx: 0, listeners: [], events: [], seq: 0,
  MAX_WATCH: 60,
  active() { return Sim.anyRunning(); },
  push(ev) { ev.seq = ++this.seq; ev.ms = Date.now(); this.events.push(ev); if (this.events.length > 400) this.events.shift(); },
  since(seq) { return this.events.filter(e => e.seq > seq); },
  enqueue(job) { if (this.queue.some(j => j.id === job.id)) return; if (job.prio) this.queue.unshift(job); else this.queue.push(job); },
  heldAddrs() { const s = new Set(); Sim.all().forEach(x => x.pos.forEach(p => s.add(p.addr))); return [...s]; },
  tick(now) {
    if (this.mode === 'practice') { Practice.tick(now); return; }
    if (!this.active() && !this.offline) return;
    if (this.offline) { /* sonde toutes les 15 s */ if (now >= this.probeAt) { this.probeAt = now + 15000; if (!this.busy) this.run({ id: 'probe', kind: 'disc', path: DISCOVERY[0][1], name: DISCOVERY[0][0] }); } return; }
    if (now >= this.nextDisc) { this.nextDisc = now + 15000; const d = DISCOVERY[this.discIdx++ % DISCOVERY.length]; this.enqueue({ id: 'disc' + d[0], kind: 'disc', path: d[1], name: d[0] }); }
    const held = this.heldAddrs();
    if (held.length && now >= this.nextHeld) { this.nextHeld = now + 3000; for (let i = 0; i < held.length; i += 30) this.enqueue({ id: 'held' + i, kind: 'tokens', addrs: held.slice(i, i + 30), prio: true }); }
    if (this.watch.length && now >= this.nextWatch) {
      this.nextWatch = now + 2600;
      const n = this.watch.length, chunks = Math.ceil(n / 30), c = this.watchIdx++ % chunks;
      this.enqueue({ id: 'watch' + c, kind: 'tokens', addrs: this.watch.slice(c * 30, c * 30 + 30) });
    }
    if (!this.busy && this.queue.length && now - this.lastReq >= this.minGap && now >= this.backoffUntil) this.run(this.queue.shift());
  },
  async get(path) {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 9000);
    try {
      const r = await fetch(API + path, { signal: ctl.signal, headers: { Accept: 'application/json' } });
      if (r.status === 429) { this.stats.r429++; throw new Error('HTTP 429 limite de requêtes'); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const txt = await r.text(); this.stats.bytes += txt.length; return JSON.parse(txt);
    } finally { clearTimeout(tm); }
  },
  async run(job) {
    this.busy = true; this.lastReq = performance.now(); this.stats.req++;
    try {
      if (job.kind === 'disc') {
        const data = await this.get(job.path);
        const sol = (Array.isArray(data) ? data : []).filter(d => d && d.chainId === 'solana' && d.tokenAddress);
        let fresh = 0;
        sol.forEach(d => { if (!this.tokens.has(d.tokenAddress)) { this.tokens.set(d.tokenAddress, this.blank(d.tokenAddress, job.name)); fresh++; } this.addWatch(d.tokenAddress); });
        this.push({ kind: 'scan', src: job.name, n: sol.length, fresh }); Sim.onScan(job.name, sol.length, fresh);
      } else {
        /* paramètre anti-cache : le CDN garde chaque URL 30 s, ce qui mélangerait des prix d'âges différents */
        const data = await this.get('/tokens/v1/solana/' + job.addrs.join(',') + '?_=' + Date.now());
        const best = new Map();
        (Array.isArray(data) ? data : []).forEach(p => {
          if (!p || p.chainId !== 'solana' || !p.baseToken) return;
          const a = p.baseToken.address; if (!job.addrs.includes(a)) return;
          const l = (p.liquidity && p.liquidity.usd) || 0, cur = best.get(a);
          if (!cur || l > ((cur.liquidity && cur.liquidity.usd) || 0)) best.set(a, p);
        });
        const upd = [];
        best.forEach((p, a) => { const t = this.ingest(a, p); if (t) upd.push(t); });
        job.addrs.forEach(a => { if (!best.has(a)) { const t = this.tokens.get(a); if (t) t.noPair = (t.noPair || 0) + 1; } });
        this.prune();
        if (upd.length) Sim.onUpdate(upd);
      }
      this.stats.ok++; this.stats.lastOk = Date.now(); this.fails = 0;
      if (this.offline) { this.offline = false; Sim.onFeedBack(); }
    } catch (e) {
      this.stats.err++; this.stats.lastErr = String(e.message || e).slice(0, 80); this.fails++;
      /* backoff exponentiel : 2 s, 4 s, 8 s… plafonné à 60 s */
      this.backoffUntil = performance.now() + Math.min(60000, 2000 * Math.pow(2, this.fails - 1));
      this.push({ kind: 'feederr', msg: this.stats.lastErr, fails: this.fails });
      if (this.fails >= 4 && !this.offline) { this.offline = true; this.queue = []; this.probeAt = performance.now() + 15000; Sim.onOffline(); }
    } finally { this.busy = false; }
  },
  blank(addr, src) { return { addr, sym: '$' + addr.slice(0, 4), src, firstSeen: Date.now(), snaps: [], price: null, synthetic: false }; },
  addWatch(a) { if (!this.watch.includes(a)) this.watch.push(a); while (this.watch.length > this.MAX_WATCH) this.evict(); },
  evict() {
    const held = new Set(this.heldAddrs());
    /* retire d'abord les tokens sans paire ou à liquidité minime, puis les plus anciens */
    let idx = this.watch.findIndex(a => !held.has(a) && ((this.tokens.get(a) || {}).noPair > 1 || ((this.tokens.get(a) || {}).liq ?? 1e9) < 2000));
    if (idx < 0) idx = this.watch.findIndex(a => !held.has(a));
    if (idx < 0) idx = 0;
    this.watch.splice(idx, 1);
  },
  prune() { this.watch = this.watch.filter(a => { const t = this.tokens.get(a); return !(t && t.noPair > 3 && !this.heldAddrs().includes(a)); }); },
  num(v) { return v === undefined || v === null || Number.isNaN(+v) ? null : +v; },
  ingest(a, p) {
    const t = this.tokens.get(a) || this.blank(a, 'pairs'); this.tokens.set(a, t);
    const g = (o, k) => (o && o[k] !== undefined ? this.num(o[k]) : null);
    const price = this.num(p.priceUsd); if (!price) return null;
    /* garde anti-données périmées : une empreinte déjà vue (autre que la dernière) = réponse en retard, ignorée */
    const fp = [p.priceUsd, p.txns && p.txns.m5 && p.txns.m5.buys, p.txns && p.txns.m5 && p.txns.m5.sells, p.volume && p.volume.m5, p.liquidity && p.liquidity.usd].join('|');
    t.fps = t.fps || [];
    if (t.fps.length && t.fps[t.fps.length - 1] !== fp && t.fps.includes(fp)) { this.stats.stale = (this.stats.stale || 0) + 1; return null; }
    if (t.fps[t.fps.length - 1] !== fp) { t.fps.push(fp); if (t.fps.length > 16) t.fps.shift(); }
    Object.assign(t, {
      sym: '$' + String(p.baseToken.symbol || a.slice(0, 4)).replace(/^\$+/, '').slice(0, 12), name: p.baseToken.name || '',
      pair: p.pairAddress, dex: p.dexId || null, url: p.url || null, price,
      liq: g(p.liquidity, 'usd'), vol5: g(p.volume, 'm5'), vol1h: g(p.volume, 'h1'),
      b5: p.txns && p.txns.m5 ? this.num(p.txns.m5.buys) : null, s5: p.txns && p.txns.m5 ? this.num(p.txns.m5.sells) : null,
      c5: g(p.priceChange, 'm5'), c1h: g(p.priceChange, 'h1'), c24: g(p.priceChange, 'h24'),
      mcap: this.num(p.marketCap ?? p.fdv), created: this.num(p.pairCreatedAt), boosts: p.boosts ? this.num(p.boosts.active) : null,
      upd: Date.now(), noPair: 0,
    });
    const last = t.snaps[t.snaps.length - 1];
    if (!last || last.p !== price || Date.now() - last.t > 20000) {
      t.snaps.push({ t: Date.now(), p: price, liq: t.liq, vol5: t.vol5, b5: t.b5, s5: t.s5, c5: t.c5, c1h: t.c1h, created: t.created });
      if (t.snaps.length > 1500) t.snaps.splice(0, t.snaps.length - 1500);
    }
    return t;
  },
  reset() { this.tokens.clear(); this.watch = []; this.queue = []; this.events = []; this.fails = 0; this.offline = false; this.backoffUntil = 0; this.nextDisc = 0; },
};

/* ========================= Mode « offline practice » (prix synthétiques, sur choix explicite) ========================= */
const Practice = {
  last: 0, init: false,
  setup() {
    Feed.reset(); const r = U.rng(Date.now() | 0);
    for (let i = 0; i < 40; i++) {
      const a = 'SYNTH' + String(i).padStart(3, '0');
      const t = Feed.blank(a, 'synthetic'); t.synthetic = true; t.sym = '$SIM' + i; t.price = U.rr(r(), .00005, .02);
      t.liq = U.rr(r(), 5000, 250000); t.vol5 = U.rr(r(), 200, 20000); t.b5 = U.ri(r(), 5, 120); t.s5 = U.ri(r(), 5, 120);
      t.c5 = 0; t.c1h = U.rr(r(), -30, 60); t.created = Date.now() - U.rr(r(), 1, 96) * 3600e3; t.dex = 'synthetic'; t.vol = U.rr(r(), .004, .02); t.drift = U.rr(r(), -.0008, .0012); t.hist5 = [];
      Feed.tokens.set(a, t); Feed.watch.push(a);
    }
    this.r = r; this.init = true;
  },
  tick(now) {
    if (!this.init) this.setup();
    if (now - this.last < 1000 || !Sim.anyRunning()) return; this.last = now;
    const r = this.r, upd = [];
    Feed.watch.forEach(a => {
      const t = Feed.tokens.get(a);
      const z = (r() + r() + r() - 1.5) * 1.4; const jump = r() < .004 ? U.rr(r(), -.35, .45) : 0;
      t.price *= Math.exp(t.drift + t.vol * z + jump);
      t.hist5.push(t.price); if (t.hist5.length > 300) t.hist5.shift();
      t.c5 = (t.price / t.hist5[0] - 1) * 100;
      t.liq *= 1 + (r() - .5) * .01; t.vol5 = Math.max(50, t.vol5 * (1 + (r() - .5) * .2)); t.b5 = Math.max(0, Math.round(t.b5 + (r() - .5 + z * .2) * 6)); t.s5 = Math.max(0, Math.round(t.s5 + (r() - .5) * 6));
      t.upd = Date.now();
      t.snaps.push({ t: t.upd, p: t.price, liq: t.liq, vol5: t.vol5, b5: t.b5, s5: t.s5, c5: t.c5, c1h: t.c1h, created: t.created }); if (t.snaps.length > 1500) t.snaps.shift();
      upd.push(t);
    });
    Sim.onUpdate(upd);
  },
};

/* ========================= RULES : agents = modules de règles transparents ========================= */
const fmtK = v => (v === null || v === undefined ? 'n.d.' : (v >= 1e6 ? '$' + (v / 1e6).toFixed(2) + 'M' : '$' + (v / 1000).toFixed(1) + 'k'));
const fmtP = (v, d = 1) => (v === null || v === undefined ? 'n.d.' : (v >= 0 ? '+' : '') + v.toFixed(d) + '%');
const fmtPrice = p => (p === null || p === undefined ? 'n.d.' : (p >= 1 ? p.toFixed(4) : p.toPrecision(4)));
const Rules = {
  /* momentum local : variation sur ≈ 60 s d'après nos propres relevés (n/a si historique insuffisant) */
  mom60(snaps, i = snaps.length - 1) {
    if (i < 1) return null; const t = snaps[i].t; let j = i - 1;
    while (j > 0 && t - snaps[j].t < 60000) j--;
    if (t - snaps[j].t < 40000) return null;
    return (snaps[i].p / snaps[j].p - 1) * 100;
  },
  impactPct(size, liq) { return liq ? 2 * size / liq * 100 : null; },
  /* évalue un candidat : renvoie les verdicts de chaque module avec les vraies valeurs */
  entry(s, mom, cfg, ctx) {
    const f = cfg.f, now = s.t;
    const ageH = s.created ? (now - s.created) / 3600e3 : null;
    const tx = s.b5 !== null && s.s5 !== null ? s.b5 + s.s5 : null;
    const buyR = tx ? s.b5 / tx : null;
    const M = {};
    /* SCANNER : données présentes, âge de la paire */
    const ageOk = !f.maxAgeH || (ageH !== null && ageH <= f.maxAgeH);
    M.scan = { ok: s.p > 0 && ageOk, txt: `âge ${ageH === null ? 'n.d.' : ageH.toFixed(1) + ' h'}${f.maxAgeH ? ' ≤ ' + f.maxAgeH + ' h' : ''}` };
    /* SAFETY : liquidité ; verrou LP et wallet dev : aucune donnée publique → n/a */
    M.safety = { ok: s.liq !== null && s.liq >= f.minLiq, txt: `liquidité ${fmtK(s.liq)} ${s.liq !== null && s.liq >= f.minLiq ? '≥' : '<'} ${fmtK(f.minLiq)} · verrou n.d. · dev n.d.`, lock: 'na', dev: 'na' };
    /* FLOW (smart money / acheteurs) */
    M.flow = { ok: buyR !== null && buyR >= f.minBuy && tx >= f.minTx5 && s.vol5 !== null && s.vol5 >= f.minVol5,
      txt: `achats ${buyR === null ? 'n.d.' : Math.round(buyR * 100) + '%'} sur ${tx ?? 'n.d.'} tx/5 min · vol. 5 min ${fmtK(s.vol5)}` };
    /* MOMENTUM (tendance) */
    M.mom = { ok: s.c5 !== null && s.c5 >= f.minChg5 && s.c5 <= f.maxChg5 && (s.c1h === null || s.c1h <= f.maxChg1h) && (mom === null || mom >= -0.5),
      txt: `5 min ${fmtP(s.c5)} · 1 h ${fmtP(s.c1h, 0)} · 60 s ${fmtP(mom, 2)}` };
    /* ANALYST / DEBATE : score pondéré + votes bull/bear sur des faits */
    let sc = 0;
    sc += .30 * (buyR === null ? 0 : U.clamp((buyR - .45) / .25));
    sc += .25 * (s.c5 === null ? 0 : U.clamp(s.c5 / 5));
    sc += .15 * (mom === null ? .3 : U.clamp((mom + .5) / 2.5));
    sc += .15 * (s.vol5 === null ? 0 : U.clamp(s.vol5 / 10000));
    sc += .10 * (s.liq === null ? 0 : U.clamp(s.liq / 100000));
    if (f.early && ageH !== null && ageH < 24) sc += .05;
    const votes = [buyR !== null && buyR > .5, s.c5 !== null && s.c5 > 0, mom !== null && mom > 0, s.vol5 !== null && s.vol5 >= f.minVol5, s.liq !== null && s.liq >= f.minLiq];
    const bull = votes.filter(Boolean).length;
    M.analyst = { ok: sc >= f.minScore, score: sc, bull, bear: 5 - bull, txt: `score ${sc.toFixed(2)} ${sc >= f.minScore ? '≥' : '<'} ${f.minScore} · haussier ${bull} / baissier ${5 - bull}` };
    /* RISK : taille ≤ max % ; impact de prix estimé (2 × taille / liquidité) */
    const size = Math.min(ctx.equity * cfg.maxPct / 100, ctx.cash);
    const imp = this.impactPct(size, s.liq);
    M.risk = { ok: size >= 1 && ctx.open < cfg.maxPos && imp !== null && imp <= f.maxImpact, size, imp,
      txt: `taille ${U.usd(size)} (${cfg.maxPct}%) · impact ${imp === null ? 'n.d.' : imp.toFixed(2) + '%'} · ${ctx.open}/${cfg.maxPos} ouvertes` };
    const order = ['scan', 'safety', 'flow', 'mom', 'analyst', 'risk'];
    const fail = order.find(k => !M[k].ok);
    return { ok: !fail, fail, M, size, buyR, ageH, score: sc };
  },
  /* modèle d'exécution papier : frais par côté + frais réseau + glissement (base + impact) */
  fillBuy(p, size, liq, cfg) { const slip = cfg.baseSlip + (this.impactPct(size, liq) || 0); const fee = size * cfg.feePct / 100 + cfg.netFee; const px = p * (1 + slip / 100); return { px, qty: (size - fee) / px, fee, slip }; },
  fillSell(p, qty, liq, cfg) { const gross0 = qty * p; const slip = cfg.baseSlip + (this.impactPct(gross0, liq) || 0); const px = p * (1 - slip / 100); const gross = qty * px; const fee = gross * cfg.feePct / 100 + cfg.netFee; return { px, net: gross - fee, fee, slip }; },
  /* sortie : stop, take profit fixe ou trailing, sortie temporelle, liquidité retirée */
  exit(pos, s, cfg) {
    const val = this.fillSell(s.p, pos.qty, s.liq, cfg).net;
    const r = (val / pos.size - 1) * 100;
    pos.peakP = Math.max(pos.peakP || pos.entryP, s.p);
    const peakR = (pos.peakP / pos.entryP - 1) * 100;
    const ageMin = (s.t - pos.openMs) / 60000;
    if (r <= -cfg.stop) return { why: `stop loss -${cfg.stop}%`, r };
    if (s.liq !== null && pos.entryLiq && s.liq < pos.entryLiq * .5) return { why: `liquidité retirée ${fmtK(s.liq)}`, r };
    if (cfg.trailOn) { if (peakR >= cfg.trailAct && s.p <= pos.peakP * (1 - cfg.trailPct / 100)) return { why: `TP suiveur (sommet ${fmtP(peakR)}, -${cfg.trailPct}% depuis le sommet)`, r }; }
    else if (r >= cfg.tp) return { why: `prise de profit +${cfg.tp}%`, r };
    if (cfg.timeExit && ageMin >= cfg.timeExit) return { why: `sortie temporelle ${cfg.timeExit} min`, r };
    return null;
  },
};

/* ========================= SESSION : portefeuille papier d'une scène ========================= */
class PaperSession {
  constructor(key, cfg) { this.key = key; this.cfg = cfg; this.reset(); }
  reset() {
    const c = this.cfg;
    Object.assign(this, {
      state: 'idle', reason: '', cash: c.stake, pos: [], closed: [], hist: [[0, c.stake]], log: [], events: [], seq: 0,
      elapsed: 0, fees: 0, slipCost: 0, evals: 0, rejects: 0, calls: { scan: 0, safety: 0, flow: 0, mom: 0, analyst: 0, risk: 0, exec: 0, exit: 0 },
      peak: c.stake, minEq: c.stake, maxDD: 0, cooldown: {}, lastSkip: {}, startMs: null, endMs: null, uid: 0, sampleAt: 0, lastMod: 'scan', mode: Feed.mode,
      ag: PaperSession.blankAg(), traces: [], trSeq: 0, lastBatchMs: 0,
    });
  }
  /* compteurs des agents (modules de règles) : chaque évaluation réelle les alimente */
  static blankAg() { const o = {}; ['scan', 'safety', 'flow', 'mom', 'analyst', 'risk'].forEach(k => { o[k] = { n: 0, ok: 0, no: 0, last: '', lastOk: null, lastMs: 0, sym: '' }; }); o.exec = { n: 0, ok: 0, no: 0, fills: 0, checks: 0, quotes: 0, last: '', lastMs: 0, sym: '' }; o.scan.batches = 0; o.scan.disc = ''; return o; }
  agSet(k, sym, txt, ok, now) { const a = this.ag[k]; a.n++; if (ok === true) a.ok++; else if (ok === false) a.no++; a.last = txt; a.lastOk = ok; a.lastMs = now; a.sym = sym; }
  emit(ev) { ev.seq = ++this.seq; ev.ms = ev.ms || Date.now(); this.events.push(ev); if (this.events.length > 300) this.events.shift(); this.log.unshift(ev); if (this.log.length > 300) this.log.pop(); if (ev.kind === 'buy' || ev.kind === 'sell') Sim.onTrade(this, ev); }
  since(seq) { return this.events.filter(e => e.seq > seq); }
  tok(a) { return Feed.tokens.get(a); }
  posValue(p) { const t = this.tok(p.addr); const px = t && t.price ? t.price : p.lastP || p.entryP; return Rules.fillSell(px, p.qty, t ? t.liq : p.entryLiq, this.cfg).net; }
  equity() { return this.cash + this.pos.reduce((s, p) => s + this.posValue(p), 0); }
  wins() { return this.closed.filter(t => t.pnl >= 0).length; }
  losses() { return this.closed.filter(t => t.pnl < 0).length; }
  start() {
    if (this.state === 'ended') return;
    if (this.state === 'idle') { this.startMs = Date.now(); this.mode = Feed.mode; this.emit({ kind: 'info', txt: `début de session · ${T2.presets[this.cfg.preset]} · mise ${U.usd(this.cfg.stake)} · ${this.cfg.dur} min · ${Feed.mode === 'live' ? 'données réelles DexScreener' : 'prix SYNTHÉTIQUES (entraînement)'}` }); }
    else this.emit({ kind: 'info', txt: 'session reprise' });
    this.state = 'running'; this.reason = '';
  }
  pause(reason = 'mise en pause par l’utilisateur') { if (this.state !== 'running') return; this.state = 'paused'; this.reason = reason; this.emit({ kind: 'info', txt: reason }); }
  stop(reason = 'arrêtée par l’utilisateur') {
    if (this.state === 'idle' || this.state === 'ended') return;
    this.pos.slice().forEach(p => { const t = this.tok(p.addr); this.close(p, t && t.price ? { p: t.price, liq: t.liq, t: Date.now() } : { p: p.lastP || p.entryP, liq: p.entryLiq, t: Date.now() }, 'fin de session · ' + (t && t.price ? 'dernier prix réel' : 'dernier prix connu')); });
    this.state = 'ended'; this.reason = reason; this.endMs = Date.now();
    this.emit({ kind: 'info', txt: 'session terminée · ' + reason });
    Sim.recordHistory(this);
  }
  tick(dtMs) {
    if (this.state !== 'running') return;
    this.elapsed += dtMs;
    if (this.elapsed >= this.sampleAt) { this.sampleAt = this.elapsed + 5000; this.sample(); }
    if (this.elapsed >= this.cfg.dur * 60000) this.stop('durée atteinte');
  }
  sample() {
    const e = this.equity(); this.hist.push([this.elapsed, e]); if (this.hist.length > 4000) this.hist.splice(1, this.hist.length - 4000);
    this.peak = Math.max(this.peak, e); this.minEq = Math.min(this.minEq, e); this.maxDD = Math.max(this.maxDD, (this.peak - e) / this.peak * 100);
  }
  /* appelé à chaque rafraîchissement réel de tokens */
  onUpdate(toks) {
    if (this.state !== 'running') return;
    const now = Date.now(), batch = [];
    this.ag.scan.batches++; this.lastBatchMs = now;
    toks.forEach(t => {
      if (t.synthetic !== (this.mode === 'practice')) return;
      const s = t.snaps[t.snaps.length - 1]; if (!s || now - s.t > 15000) return;
      const held = this.pos.find(p => p.addr === t.addr);
      if (held) {
        held.lastP = t.price; this.calls.exit++;
        const ex0 = this.ag.exec; ex0.checks++; ex0.lastMs = now; ex0.sym = t.sym; ex0.last = `${t.sym} évalué à ${fmtPrice(s.p)} · ${fmtP((this.posValue(held) / held.size - 1) * 100)} · règles de sortie vérifiées`;
        const ex = Rules.exit(held, s, this.cfg); if (ex) this.close(held, s, ex.why);
        return;
      }
      if (this.cooldown[t.addr] && now < this.cooldown[t.addr]) return;
      const eq = this.equity();
      const res = Rules.entry(s, Rules.mom60(t.snaps), this.cfg, { equity: eq, cash: this.cash, open: this.pos.length });
      this.evals++;
      /* les 6 modules jugent chaque candidat en parallèle (valeurs réelles) ; TAMB = consensus + risque */
      ['scan', 'safety', 'flow', 'mom'].forEach(k => this.agSet(k, t.sym, `${t.sym} · ${res.M[k].txt}`, res.M[k].ok, now));
      this.agSet('analyst', t.sym, `${t.sym} · ${res.M.analyst.txt}`, res.M.analyst.ok, now);
      this.agSet('risk', t.sym, `${t.sym} · ${res.ok ? 'APPROUVÉ' : 'REFUSÉ (' + AGN[res.fail] + ')'} · ${res.M.risk.txt}`, res.ok, now);
      const tr = { id: ++this.trSeq, ms: now, sym: t.sym, addr: t.addr, M: res.M, ok: res.ok, fail: res.fail, score: res.score, size: res.size, liq: s.liq, p: s.p, quote: null };
      this.traces.push(tr); if (this.traces.length > 80) this.traces.shift(); batch.push(tr);
      const order = ['scan', 'safety', 'flow', 'mom', 'analyst', 'risk'];
      for (const k of order) { this.calls[k]++; if (k === res.fail) break; }
      this.lastMod = res.fail || 'exec';
      if (!res.ok) {
        this.rejects++;
        const ls = this.lastSkip[t.addr];
        if (!ls || ls.mod !== res.fail || now - ls.ms > 90000) { this.lastSkip[t.addr] = { mod: res.fail, ms: now }; this.emit({ kind: 'skip', sym: t.sym, addr: t.addr, mod: res.fail, txt: res.M[res.fail].txt, res }); }
        return;
      }
      this.open(t, s, res);
      tr.quote = { done: true };
    });
    /* RYZO (exécution) chiffre le meilleur candidat refusé : devis papier frais + glissement, non envoyé */
    const cand = batch.filter(b => !b.ok && b.size >= 1 && b.liq).sort((a, b) => b.score - a.score)[0];
    if (cand) { const q = Rules.fillBuy(cand.p, cand.size, cand.liq, this.cfg); cand.quote = { slip: q.slip, fee: q.fee }; const ex = this.ag.exec; ex.quotes++; ex.lastMs = now; ex.sym = cand.sym; ex.last = `devis ${cand.sym} ${U.usd(cand.size)} → slippage ${q.slip.toFixed(2)}% · frais ${U.usd(q.fee)} · non envoyé (veto ${AGN[cand.fail]})`; }
    this.sample();
  }
  open(t, s, res) {
    const f = Rules.fillBuy(s.p, res.size, s.liq, this.cfg);
    this.cash -= res.size; this.fees += f.fee; this.slipCost += res.size * f.slip / 100; this.calls.exec++;
    const p = { id: ++this.uid, addr: t.addr, sym: t.sym, pair: t.pair, dex: t.dex, url: t.url, openMs: s.t, entryP: s.p, fillP: f.px, qty: f.qty, size: res.size, feeIn: f.fee, slipIn: f.slip, entryLiq: s.liq, peakP: s.p, lastP: s.p,
      reasons: ['scan', 'safety', 'flow', 'mom', 'analyst', 'risk'].map(k => res.M[k].txt).join(' | '), score: res.score, bull: res.M.analyst.bull, bear: res.M.analyst.bear, buyR: res.buyR };
    this.pos.push(p);
    const ex = this.ag.exec; ex.fills++; ex.n++; ex.ok++; ex.lastMs = Date.now(); ex.sym = t.sym; ex.last = `ACHAT ${t.sym} ${U.usd(res.size)} exécuté à ${fmtPrice(f.px)} · slippage ${f.slip.toFixed(2)}% · frais ${U.usd(f.fee)}`;
    this.emit({ kind: 'buy', sym: t.sym, addr: t.addr, size: res.size, price: s.p, fill: f.px, slip: f.slip, fee: f.fee, res, txt: `ACHAT ${t.sym} ${U.usd(res.size)} à ${fmtPrice(f.px)} (marché ${fmtPrice(s.p)}, slippage ${f.slip.toFixed(2)}%)` });
  }
  close(p, s, why) {
    const f = Rules.fillSell(s.p, p.qty, s.liq, this.cfg);
    this.cash += f.net; this.fees += f.fee; this.slipCost += p.qty * s.p * f.slip / 100; this.calls.exec++;
    this.pos.splice(this.pos.indexOf(p), 1);
    const pnl = f.net - p.size;
    const tr = Object.assign({}, p, { closeEl: this.elapsed, closeMs: s.t || Date.now(), exitP: s.p, exitFill: f.px, feeOut: f.fee, slipOut: f.slip, proceeds: f.net, pnl, pnlPct: pnl / p.size * 100, why });
    this.closed.push(tr); if (this.closed.length > 1000) this.closed.shift();
    this.cooldown[p.addr] = Date.now() + this.cfg.cooldown * 60000;
    if (this.ag && this.ag.exec) { const ex = this.ag.exec; ex.fills++; ex.n++; ex.lastMs = Date.now(); ex.sym = p.sym; ex.last = `VENTE ${p.sym} ${U.sUsd(pnl)} (${fmtP(pnl / p.size * 100)}) · ${why}`; }
    this.emit({ kind: 'sell', sym: p.sym, addr: p.addr, pnl, pnlPct: tr.pnlPct, why, price: s.p, txt: `VENDU ${p.sym} ${U.sUsd(pnl)} (${fmtP(tr.pnlPct)}) · ${why}` });
  }
  summary() {
    const e = this.equity(), cl = this.closed, w = this.wins();
    const best = cl.reduce((a, b) => (!a || b.pnl > a.pnl ? b : a), null), worst = cl.reduce((a, b) => (!a || b.pnl < a.pnl ? b : a), null);
    return { key: this.key, mode: this.mode, preset: this.cfg.preset, start: this.startMs, end: this.endMs || Date.now(), stake: this.cfg.stake, final: e, pnl: e - this.cfg.stake, pnlPct: (e / this.cfg.stake - 1) * 100,
      trades: cl.length, wins: w, losses: cl.length - w, winRate: cl.length ? w / cl.length * 100 : null, maxDD: this.maxDD, fees: this.fees, slip: this.slipCost,
      coins: new Set(cl.map(t => t.addr)).size, best: best ? [best.sym, best.pnl] : null, worst: worst ? [worst.sym, worst.pnl] : null, minutes: this.elapsed / 60000 };
  }
  serialize() { const o = {}; ['key', 'cfg', 'state', 'reason', 'cash', 'pos', 'closed', 'hist', 'elapsed', 'fees', 'slipCost', 'evals', 'rejects', 'calls', 'peak', 'minEq', 'maxDD', 'cooldown', 'startMs', 'endMs', 'uid', 'mode', 'ag'].forEach(k => { o[k] = this[k]; }); o.log = this.log.slice(0, 60).map(e => ({ kind: e.kind, sym: e.sym, txt: e.txt, pnl: e.pnl, ms: e.ms, mod: e.mod })); return o; }
  restore(o) { Object.assign(this, o); const b = PaperSession.blankAg(); this.ag = Object.assign(b, o.ag || {}); this.traces = []; this.trSeq = 0; this.events = []; this.seq = 0; this.lastSkip = {}; this.sampleAt = this.elapsed; if (this.state === 'running') { this.state = 'paused'; this.reason = 'restaurée après rechargement — appuie sur Reprendre'; } }
}

/* ========================= SIM : gestionnaire des 3 sessions ========================= */
const Sim = {
  s: {}, history: [],
  init() { ['A'].forEach(k => { this.s[k] = new PaperSession(k, defaultCfg(k)); }); },
  all() { return Object.values(this.s); },
  anyRunning() { return this.all().some(x => x.state === 'running'); },
  onUpdate(toks) { this.all().forEach(x => x.onUpdate(toks)); },
  onOffline() { this.all().forEach(x => x.pause('flux de données coupé — en pause')); SimUI.banner(T2.offline, true); },
  onFeedBack() { SimUI.banner(T2.feedBack, true); setTimeout(() => SimUI.banner('', false), 8000); },
  tick(dtMs) { this.all().forEach(x => x.tick(dtMs)); },
  recordHistory(x) { this.history.unshift(x.summary()); if (this.history.length > 60) this.history.pop(); SimStore.save(); },
  /* portefeuille agrégé : relevé toutes les 5 s (heure réelle) des 3 capitaux */
  agg: [], aggAt: 0, aggPeak: 0, aggDD: 0,
  totals() {
    const xs = this.all(), eq = xs.reduce((a, x) => a + x.equity(), 0), stake = xs.reduce((a, x) => a + x.cfg.stake, 0);
    const cl = xs.flatMap(x => x.closed.map(t => Object.assign({ bot: x.key }, t)));
    const w = cl.filter(t => t.pnl >= 0).length;
    const best = cl.reduce((a, b) => (!a || b.pnl > a.pnl ? b : a), null), worst = cl.reduce((a, b) => (!a || b.pnl < a.pnl ? b : a), null);
    return { eq, stake, pnl: eq - stake, pnlPct: stake ? (eq / stake - 1) * 100 : 0, trades: cl.length, wins: w, losses: cl.length - w, winRate: cl.length ? w / cl.length * 100 : null,
      open: xs.reduce((a, x) => a + x.pos.length, 0), fees: xs.reduce((a, x) => a + x.fees + x.slipCost, 0), best, worst, dd: this.aggDD, running: xs.filter(x => x.state === 'running').length };
  },
  sampleAgg(force) {
    const now = Date.now(); if (!force && (now < this.aggAt || !this.anyRunning())) return; this.aggAt = now + 5000;
    const e = { t: now }; let tot = 0; this.all().forEach(x => { e[x.key] = +x.equity().toFixed(4); tot += e[x.key]; }); e.T = +tot.toFixed(4);
    this.agg.push(e); if (this.agg.length > 3000) this.agg.splice(0, this.agg.length - 3000);
    this.aggPeak = Math.max(this.aggPeak || 0, tot); this.aggDD = Math.max(this.aggDD || 0, this.aggPeak ? (this.aggPeak - tot) / this.aggPeak * 100 : 0);
  },
  resetAgg() { this.agg = []; this.aggPeak = 0; this.aggDD = 0; this.aggAt = 0; },
  startAll() { if (Feed.offline && Feed.mode === 'live') { Feed.offline = false; Feed.fails = 0; SimUI.banner('', false); } this.all().forEach(x => { if (x.state !== 'running' && x.state !== 'ended') x.start(); }); this.sampleAgg(true); },
  pauseAll() { this.all().forEach(x => x.pause()); },
  stopAll() { this.all().forEach(x => x.stop()); this.sampleAgg(true); },
  onTrade(x, ev) { if (typeof Notify !== 'undefined') Notify.trade(x, ev); },
  onScan(src, n, fresh) { this.all().forEach(x => { if (x.state !== 'running') return; const a = x.ag.scan; a.disc = `${SRCFR[src] || src} : ${n} tokens Solana, ${fresh} nouveaux`; a.lastMs = Date.now(); }); },
};

/* ========================= BACKTEST : réglage sur les données réelles enregistrées ========================= */
/* Rejoue les mêmes règles sur les relevés de prix collectés pendant la session (in-sample : risque de sur-ajustement). */
const Backtest = {
  data(mode) {
    const toks = [...Feed.tokens.values()].filter(t => t.snaps.length > 3 && t.synthetic === (mode === 'practice'));
    const ev = []; toks.forEach((t, ti) => t.snaps.forEach((s, si) => ev.push([s.t, ti, si])));
    ev.sort((a, b) => a[0] - b[0]);
    return { toks, ev, span: ev.length ? (ev[ev.length - 1][0] - ev[0][0]) / 60000 : 0, snaps: ev.length };
  },
  run(cfg, D) {
    let cash = cfg.stake, peak = cfg.stake, maxDD = 0, fees = 0; const pos = new Map(), cd = new Map(), closed = [], lastP = new Map();
    const val = (ti, p) => { const s = lastP.get(ti); return Rules.fillSell(s.p, p.qty, s.liq, cfg).net; };
    const eqf = () => cash + [...pos.entries()].reduce((a, [ti, p]) => a + val(ti, p), 0);
    let k = 0;
    for (const [t, ti, si] of D.ev) {
      const tok = D.toks[ti], s = tok.snaps[si]; lastP.set(ti, s);
      const p = pos.get(ti);
      if (p) { const ex = Rules.exit(p, s, cfg); if (ex) { const f = Rules.fillSell(s.p, p.qty, s.liq, cfg); cash += f.net; fees += f.fee; closed.push(f.net - p.size); pos.delete(ti); cd.set(ti, t + cfg.cooldown * 60000); } }
      else if (!(cd.get(ti) > t)) {
        const eq = eqf();
        const r = Rules.entry(s, Rules.mom60(tok.snaps, si), cfg, { equity: eq, cash, open: pos.size });
        if (r.ok) { const f = Rules.fillBuy(s.p, r.size, s.liq, cfg); cash -= r.size; fees += f.fee; pos.set(ti, { qty: f.qty, size: r.size, entryP: s.p, peakP: s.p, openMs: t, entryLiq: s.liq }); }
      }
      if (++k % 25 === 0) { const e = eqf(); peak = Math.max(peak, e); maxDD = Math.max(maxDD, (peak - e) / peak * 100); }
    }
    pos.forEach((p, ti) => { const s = lastP.get(ti); const f = Rules.fillSell(s.p, p.qty, s.liq, cfg); cash += f.net; fees += f.fee; closed.push(f.net - p.size); });
    const w = closed.filter(x => x >= 0).length;
    return { ret: (cash / cfg.stake - 1) * 100, final: cash, trades: closed.length, winRate: closed.length ? w / closed.length * 100 : null, maxDD, fees };
  },
  grid(key, base) {
    const D = this.data(Feed.mode); const out = [];
    if (D.snaps < 50) return { D, out };
    ['prudent', 'equilibre', 'agressif'].forEach(pr => [6, 8, 12, 16].forEach(stop => [[false, 0, 0], [true, 6, 5], [true, 6, 8], [true, 10, 12]].forEach(([tr, act, pct]) => [10, 25].forEach(size => {
      const c = defaultCfg(key, pr); Object.assign(c, { stake: base.stake, stop, trailOn: tr, trailAct: act || c.trailAct, trailPct: pct || c.trailPct, maxPct: size, feePct: base.feePct, netFee: base.netFee, baseSlip: base.baseSlip });
      out.push({ label: `${T2.presets[pr]} · taille ${size}% · stop -${stop}% · ${tr ? `suiveur ${pct}% après +${act}%` : 'TP +' + c.tp + '%'}`, cfg: c, r: this.run(c, D) });
    }))));
    out.sort((a, b) => b.r.ret - a.r.ret);
    return { D, out, presets: ['prudent', 'equilibre', 'agressif'].map(pr => { const c = defaultCfg(key, pr); Object.assign(c, { stake: base.stake }); return { label: T2.presets[pr] + ' (par défaut)', r: this.run(c, D) }; }) };
  },
};

/* ========================= STORE : localStorage (try/catch) ========================= */
const SimStore = {
  KEY: 'grokbot.sim.v1',
  load() { try { return JSON.parse(localStorage.getItem(this.KEY) || '{}') || {}; } catch (e) { return {}; } },
  save() {
    try {
      const o = { scene: SimApp.scene, feedMode: Feed.mode, history: Sim.history, sessions: {}, agg: Sim.agg.slice(-1500), aggPeak: Sim.aggPeak, aggDD: Sim.aggDD, prefs: typeof Prefs !== 'undefined' ? Prefs.v : {}, pk: SimApp.pk };
      Sim.all().forEach(x => { o.sessions[x.key] = x.serialize(); });
      localStorage.setItem(this.KEY, JSON.stringify(o));
    } catch (e) { /* la page fonctionne sans stockage */ }
  },
  clear() { try { localStorage.removeItem(this.KEY); } catch (e) { /* rien */ } },
};

/* ========================= Export CSV des trades ========================= */
function exportCSV(keys) {
  const iso = ms => (ms ? new Date(ms).toISOString() : '');
  const head = ['bot', 'mode', 'id', 'statut', 'token', 'adresse_token', 'adresse_paire', 'dex', 'ouverture', 'cloture', 'prix_marche_entree_usd', 'prix_execution_entree_usd', 'prix_marche_sortie_usd', 'prix_execution_sortie_usd', 'taille_usd', 'quantite', 'frais_entree_usd', 'frais_sortie_usd', 'slippage_entree_pct', 'slippage_sortie_pct', 'produit_usd', 'pnl_usd', 'pnl_pct', 'raison_sortie', 'raisons_entree'];
  const q = v => { const s = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [head.join(',')];
  keys.forEach(k => {
    const x = Sim.s[k];
    x.closed.forEach(t => rows.push([k, x.mode === 'live' ? 'reel' : 'entrainement', t.id, 'clôturé', t.sym, t.addr, t.pair, t.dex, iso(t.openMs), iso(t.closeMs), t.entryP, t.fillP, t.exitP, t.exitFill, t.size.toFixed(4), t.qty, t.feeIn.toFixed(4), t.feeOut.toFixed(4), t.slipIn.toFixed(3), t.slipOut.toFixed(3), t.proceeds.toFixed(4), t.pnl.toFixed(4), t.pnlPct.toFixed(3), t.why, t.reasons].map(q).join(',')));
    x.pos.forEach(t => { const v = x.posValue(t); rows.push([k, x.mode === 'live' ? 'reel' : 'entrainement', t.id, 'ouvert (évalué)', t.sym, t.addr, t.pair, t.dex, iso(t.openMs), '', t.entryP, t.fillP, t.lastP, '', t.size.toFixed(4), t.qty, t.feeIn.toFixed(4), '', t.slipIn.toFixed(3), '', v.toFixed(4), (v - t.size).toFixed(4), ((v / t.size - 1) * 100).toFixed(3), '', t.reasons].map(q).join(',')); });
  });
  if (rows.length < 2) return 0;
  const blob = new Blob([rows.join('\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `grokbot-simulation-trades-${new Date().toISOString().slice(0, 19).replace(/:/g, '')}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  return rows.length - 1;
}

const bez = (p0, p1, p2, p3, u) => { const v = 1 - u; return [v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0], v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]]; };
/* Compteur animé (roule 400 ms, clignote 600 ms vert/rouge) */
class Num {
  constructor(el, paint, opts = {}) { this.el = el; this.paint = paint; this.cur = null; this.to = 0; this.from = 0; this.t0 = 0; this.fl = 0; this.thr = opts.thr ?? 0; this.flash = opts.flash ?? true; Num.all.push(this); }
  set(v) {
    if (this.cur === null) { this.cur = this.to = this.from = v; this.paint(this.el, v); return; }
    if (v === this.to) return; const now = performance.now();
    if (this.flash && !REDUCED && Math.abs(v - this.to) > Math.abs(this.to) * this.thr && now - (this.lf || 0) > 900) { this.lf = now; this.el.classList.toggle('flash-up', v > this.to); this.el.classList.toggle('flash-down', v < this.to); this.fl = now + 600; }
    this.from = this.cur; this.to = v; this.t0 = now;
  }
  step(now) {
    if (this.cur !== null && this.cur !== this.to) { const f = U.clamp((now - this.t0) / 400); this.cur = f >= 1 ? this.to : U.lerp(this.from, this.to, U.easeOut(f)); this.paint(this.el, this.cur); }
    if (this.fl && now > this.fl) { this.fl = 0; this.el.classList.remove('flash-up', 'flash-down'); }
  }
}

/* ========================= APP : moteur en arrière-plan + boucle d'affichage ========================= */
const SimApp = {
  scene: 'trading', last: 0, saveAt: 0, feedAt: 0, pk: 'A', eLast: 0, keys: { trading: 'A' },
  init() {
    Sim.init();
    const st = SimStore.load();
    Prefs.load(st.prefs);
    if (st.feedMode === 'practice') Feed.mode = 'practice';
    if (Array.isArray(st.history)) Sim.history = st.history.filter(h => h && h.key === 'A');
    this.restoring = true;
    if (st.sessions && st.sessions.A && st.sessions.A.cfg) { try { Sim.s.A.restore(st.sessions.A); } catch (e) { Sim.s.A.reset(); } }
    this.restoring = false;
    this.views = { trading: SimA };
    Notify.init(); Tip.init();
    SimA.build(document.getElementById('sceneA')); SimA.reset();
    SimUI.build();
    document.getElementById('sceneA').classList.add('on'); document.body.dataset.scene = 'trading';
    if (Sim.s.A.state === 'paused' && Sim.s.A.reason) Notify.show('Session restaurée', 'appuie sur Reprendre pour continuer là où tu t’étais arrêté', 'info');
    addEventListener('resize', () => this.layout());
    addEventListener('keydown', e => {
      if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); this.toggle(); }
      if (e.key === 'r' || e.key === 'R') SimUI.togglePanel();
      if (e.key === 'Escape') { SimUI.togglePanel(false); Tip.hide(); }
      const t = ['log', 'pos', 'tr', 'hist'][+e.key - 1]; if (t) { const b = SimA.r.tabs.querySelector(`[data-t="${t}"]`); if (b) b.click(); }
    });
    addEventListener('online', () => { if (Feed.offline) SimUI.banner('connexion rétablie — appuie sur Reprendre', true); });
    addEventListener('offline', () => SimUI.banner('pas de connexion internet — le flux de prix va se couper', true));
    this.layout(); SimUI.refresh();
    SimUI.togglePanel(false);
    this.engine();
    requestAnimationFrame(t => { this.last = t; requestAnimationFrame(n => this.loop(n)); });
  },
  sess() { return Sim.s.A; },
  view() { return SimA; },
  viewOf() { return SimA; },
  resumeFeed() { if (Feed.offline && Feed.mode === 'live') { Feed.offline = false; Feed.fails = 0; Feed.backoffUntil = 0; SimUI.banner('', false); } },
  toggle() {
    const x = this.sess(); if (x.state === 'running') x.pause(); else if (x.state === 'ended') { x.reset(); SimA.reset(); x.start(); } else { this.resumeFeed(); x.start(); }
    SimUI.refresh(); SimStore.save();
  },
  /* moteur indépendant de requestAnimationFrame : minuterie dans un Web Worker (moins bridée onglet caché), repli setInterval */
  engine() {
    const step = () => { const now = performance.now(); const dt = Math.min(70000, Math.max(0, now - (this.eLast || now))); this.eLast = now;
      try { Sim.tick(dt); Feed.tick(now); if (now > this.saveAt) { this.saveAt = now + 5000; SimStore.save(); } } catch (err) { console.error(err); } };
    this.eLast = performance.now();
    try {
      this.worker = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),200);'], { type: 'text/javascript' })));
      this.worker.onmessage = step; this.worker.onerror = e => { if (e.preventDefault) e.preventDefault(); if (!this.iv) this.iv = setInterval(step, 200); };
    } catch (e) { this.iv = setInterval(step, 200); }
  },
  layout() {
    const vw = innerWidth, vh = innerHeight, mobile = vw < 760, panel = document.body.classList.contains('panel-open') && vw >= 1000;
    document.body.classList.toggle('mobile', mobile);
    const aw = vw - (panel ? 360 : 0);
    const unit = mobile ? vw / 560 : Math.min((aw - 16) / 960, Math.max((vh - 40) / 958, .8));
    document.getElementById('sceneA').style.paddingRight = panel ? '360px' : '0';
    document.documentElement.style.fontSize = unit + 'px'; document.documentElement.style.setProperty('--u', unit + 'px');
  },
  loop(now) {
    this.last = now;
    try {
      SimA.render(now);
      for (const n of Num.all) n.step(now);
      if (now > this.feedAt) { this.feedAt = now + 500; if (document.getElementById('panel').classList.contains('show')) SimUI.feedStatus(); SimUI.refresh(); }
    } catch (err) { console.error(err); }
    requestAnimationFrame(n => this.loop(n));
  },
};
document.addEventListener('DOMContentLoaded', () => SimApp.init());
