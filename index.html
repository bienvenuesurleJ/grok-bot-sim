    const rp = (s.p / pos.entryP - 1) * 100, peakR = (pos.peakP / pos.entryP - 1) * 100;
    const ageMin = (s.t - pos.openMs) / 60000;
    const stopD = pos.stopD || cfg.stop, tpD = pos.tpD || cfg.tp;
    /* stop remonté au prix d'entrée + marge une fois le gain atteint (couvre les frais) */
    const floor = cfg.beAt && peakR >= cfg.beAt ? cfg.beLock : -stopD;
    if (rp <= floor) return { why: floor > -stopD ? `stop relevé (sommet ${fmtP(peakR)})` : `stop loss -${stopD.toFixed(1)}%`, r, stop: floor <= -stopD };
    if (s.liq !== null && pos.entryLiq && s.liq < pos.entryLiq * .5) return { why: `liquidité retirée ${fmtK(s.liq)}`, r };
    if (cfg.trailOn && peakR >= Math.max(cfg.trailAct, tpD * .6)) { if (s.p <= pos.peakP * (1 - cfg.trailPct / 100)) return { why: `TP suiveur (sommet ${fmtP(peakR)}, -${cfg.trailPct}% depuis le sommet)`, r }; }
    else if (rp >= tpD) return { why: `prise de profit +${tpD.toFixed(1)}%`, r };
    if (rp >= tpD * 2.5) return { why: `prise de profit +${rp.toFixed(1)}%`, r };
    if (cfg.flatMin && ageMin >= cfg.flatMin && Math.abs(rp) < cfg.flatBand) return { why: `trade plat après ${cfg.flatMin} min`, r };
    if (cfg.timeExit && ageMin >= cfg.timeExit) return { why: `sortie temporelle ${cfg.timeExit} min`, r };
    return null;
  },
};

/* ========================= SESSION : portefeuille papier d'une scène ========================= */
class PaperSession {
  constructor(key, cfg) { this.key = key; this.cfg = cfg; this.reset(); }
  reset() {
    const c = this.cfg;
    Object.assign(this, {
      state: 'idle', reason: '', cash: c.stake, pos: [], closed: [], hist: [[0, c.stake]], log: [], events: [], seq: 0,
      elapsed: 0, fees: 0, slipCost: 0, evals: 0, rejects: 0, calls: { scan: 0, safety: 0, flow: 0, mom: 0, analyst: 0, risk: 0, exec: 0, exit: 0 },
      peak: c.stake, minEq: c.stake, maxDD: 0, cooldown: {}, entries: [], lastSkip: {}, startMs: null, endMs: null, uid: 0, sampleAt: 0, lastMod: 'scan', mode: Feed.mode,
      ag: PaperSession.blankAg(), traces: [], trSeq: 0, lastBatchMs: 0,
    });
  }
  /* compteurs des agents (modules de règles) : chaque évaluation réelle les alimente */
  static blankAg() { const o = {}; ['scan', 'safety', 'flow', 'mom', 'analyst', 'risk'].forEach(k => { o[k] = { n: 0, ok: 0, no: 0, last: '', lastOk: null, lastMs: 0, sym: '' }; }); o.exec = { n: 0, ok: 0, no: 0, fills: 0, checks: 0, quotes: 0, last: '', lastMs: 0, sym: '' }; o.scan.batches = 0; o.scan.disc = ''; return o; }
  agSet(k, sym, txt, ok, now) { const a = this.ag[k]; a.n++; if (ok === true) a.ok++; else if (ok === false) a.no++; a.last = txt; a.lastOk = ok; a.lastMs = now; a.sym = sym; }
  emit(ev) { ev.seq = ++this.seq; ev.ms = ev.ms || Date.now(); this.events.push(ev); if (this.events.length > 300) this.events.shift(); this.log.unshift(ev); if (this.log.length > 300) this.log.pop(); if (ev.kind === 'buy' || ev.kind === 'sell') Sim.onTrade(this, ev); }
  since(seq) { return this.events.filter(e => e.seq > seq); }
  tok(a) { return Feed.tokens.get(a); }
  posValue(p) { const t = this.tok(p.addr); const px = t && t.price ? t.price : p.lastP || p.entryP; return Rules.fillSell(px, p.qty, t ? t.liq : p.entryLiq, this.cfg).net; }
  equity() { return this.cash + this.pos.reduce((s, p) => s + this.posValue(p), 0); }
  wins() { return this.closed.filter(t => t.pnl >= 0).length; }
  losses() { return this.closed.filter(t => t.pnl < 0).length; }
  start() {
    if (this.state === 'ended') return;
    if (this.state === 'idle') { this.startMs = Date.now(); this.mode = Feed.mode; this.emit({ kind: 'info', txt: `début de session · ${T2.presets[this.cfg.preset]} · mise ${U.usd(this.cfg.stake)} · ${this.cfg.dur} min · ${Feed.mode === 'live' ? 'données réelles DexScreener' : 'prix SYNTHÉTIQUES (entraînement)'}` }); }
    else this.emit({ kind: 'info', txt: 'session reprise' });
    this.state = 'running'; this.reason = '';
  }
  pause(reason = 'mise en pause par l’utilisateur') { if (this.state !== 'running') return; this.state = 'paused'; this.reason = reason; this.emit({ kind: 'info', txt: reason }); }
  stop(reason = 'arrêtée par l’utilisateur') {
    if (this.state === 'idle' || this.state === 'ended') return;
    this.pos.slice().forEach(p => { const t = this.tok(p.addr); this.close(p, t && t.price ? { p: t.price, liq: t.liq, t: Date.now() } : { p: p.lastP || p.entryP, liq: p.entryLiq, t: Date.now() }, 'fin de session · ' + (t && t.price ? 'dernier prix réel' : 'dernier prix connu')); });
    this.state = 'ended'; this.reason = reason; this.endMs = Date.now();
    this.emit({ kind: 'info', txt: 'session terminée · ' + reason });
    Sim.recordHistory(this);
  }
  tick(dtMs) {
    if (this.state !== 'running') return;
    this.elapsed += dtMs;
    if (this.elapsed >= this.sampleAt) { this.sampleAt = this.elapsed + 5000; this.sample(); }
    if (this.elapsed >= this.cfg.dur * 60000) this.stop('durée atteinte');
  }
  sample() {
    const e = this.equity(); this.hist.push([this.elapsed, e]); if (this.hist.length > 4000) this.hist.splice(1, this.hist.length - 4000);
    this.peak = Math.max(this.peak, e); this.minEq = Math.min(this.minEq, e); this.maxDD = Math.max(this.maxDD, (this.peak - e) / this.peak * 100);
  }
  /* appelé à chaque rafraîchissement réel de tokens */
  onUpdate(toks) {
    if (this.state !== 'running') return;
    const now = Date.now(), batch = [];
    this.ag.scan.batches++; this.lastBatchMs = now;
    toks.forEach(t => {
      if (t.synthetic !== (this.mode === 'practice')) return;
      const s = t.snaps[t.snaps.length - 1]; if (!s || now - s.t > 15000) return;
      const held = this.pos.find(p => p.addr === t.addr);
      if (held) {
        held.lastP = t.price; this.calls.exit++;
        const ex0 = this.ag.exec; ex0.checks++; ex0.lastMs = now; ex0.sym = t.sym; ex0.last = `${t.sym} évalué à ${fmtPrice(s.p)} · ${fmtP((this.posValue(held) / held.size - 1) * 100)} · règles de sortie vérifiées`;
        const ex = Rules.exit(held, s, this.cfg); if (ex) this.close(held, s, ex.why, ex.stop);
        return;
      }
      if (this.cooldown[t.addr] && now < this.cooldown[t.addr]) return;
      const eq = this.equity();
      this.entries = (this.entries || []).filter(m => s.t - m < 3600e3);
      const res = Rules.entry(s, Rules.mom60(t.snaps), this.cfg, { equity: eq, cash: this.cash, open: this.pos.length, obsS: (s.t - (t.snaps[0] ? t.snaps[0].t : s.t)) / 1000, vol: Rules.vol5(t.snaps), perHour: this.entries.length });
      this.evals++;
      /* les 6 modules jugent chaque candidat en parallèle (valeurs réelles) ; TAMB = consensus + risque */
      ['scan', 'safety', 'flow', 'mom'].forEach(k => this.agSet(k, t.sym, `${t.sym} · ${res.M[k].txt}`, res.M[k].ok, now));
      this.agSet('analyst', t.sym, `${t.sym} · ${res.M.analyst.txt}`, res.M.analyst.ok, now);
      this.agSet('risk', t.sym, `${t.sym} · ${res.ok ? 'APPROUVÉ' : 'REFUSÉ (' + AGN[res.fail] + ')'} · ${res.M.risk.txt}`, res.ok, now);
      const tr = { id: ++this.trSeq, ms: now, sym: t.sym, addr: t.addr, M: res.M, ok: res.ok, fail: res.fail, score: res.score, size: res.size, liq: s.liq, p: s.p, quote: null };
      this.traces.push(tr); if (this.traces.length > 80) this.traces.shift(); batch.push(tr);
      const order = ['scan', 'safety', 'flow', 'mom', 'analyst', 'risk'];
      for (const k of order) { this.calls[k]++; if (k === res.fail) break; }
      this.lastMod = res.fail || 'exec';
      if (!res.ok) {
        this.rejects++;
        const ls = this.lastSkip[t.addr];
        if (!ls || ls.mod !== res.fail || now - ls.ms > 90000) { this.lastSkip[t.addr] = { mod: res.fail, ms: now }; this.emit({ kind: 'skip', sym: t.sym, addr: t.addr, mod: res.fail, txt: res.M[res.fail].txt, res }); }
        return;
      }
      this.open(t, s, res);
      tr.quote = { done: true };
    });
    /* RYZO (exécution) chiffre le meilleur candidat refusé : devis papier frais + glissement, non envoyé */
    const cand = batch.filter(b => !b.ok && b.size >= 1 && b.liq).sort((a, b) => b.score - a.score)[0];
    if (cand) { const q = Rules.fillBuy(cand.p, cand.size, cand.liq, this.cfg); cand.quote = { slip: q.slip, fee: q.fee }; const ex = this.ag.exec; ex.quotes++; ex.lastMs = now; ex.sym = cand.sym; ex.last = `devis ${cand.sym} ${U.usd(cand.size)} → slippage ${q.slip.toFixed(2)}% · frais ${U.usd(q.fee)} · non envoyé (veto ${AGN[cand.fail]})`; }
    this.sample();
  }
  open(t, s, res) {
    const f = Rules.fillBuy(s.p, res.size, s.liq, this.cfg);
    this.cash -= res.size; this.fees += f.fee; this.slipCost += res.size * f.slip / 100; this.calls.exec++;
    (this.entries = this.entries || []).push(s.t);
    const p = { id: ++this.uid, addr: t.addr, sym: t.sym, pair: t.pair, dex: t.dex, url: t.url, openMs: s.t, entryP: s.p, fillP: f.px, qty: f.qty, size: res.size, feeIn: f.fee, slipIn: f.slip, entryLiq: s.liq, peakP: s.p, lastP: s.p, stopD: res.M.risk.stopD, tpD: res.M.risk.tpD,
      reasons: ['scan', 'safety', 'flow', 'mom', 'analyst', 'risk'].map(k => res.M[k].txt).join(' | '), score: res.score, bull: res.M.analyst.bull, bear: res.M.analyst.bear, buyR: res.buyR };
    this.pos.push(p);
    const ex = this.ag.exec; ex.fills++; ex.n++; ex.ok++; ex.lastMs = Date.now(); ex.sym = t.sym; ex.last = `ACHAT ${t.sym} ${U.usd(res.size)} exécuté à ${fmtPrice(f.px)} · slippage ${f.slip.toFixed(2)}% · frais ${U.usd(f.fee)}`;
    this.emit({ kind: 'buy', sym: t.sym, addr: t.addr, size: res.size, price: s.p, fill: f.px, slip: f.slip, fee: f.fee, res, txt: `ACHAT ${t.sym} ${U.usd(res.size)} à ${fmtPrice(f.px)} (marché ${fmtPrice(s.p)}, slippage ${f.slip.toFixed(2)}%)` });
  }
  close(p, s, why, stopped) {
    const f = Rules.fillSell(s.p, p.qty, s.liq, this.cfg);
    this.cash += f.net; this.fees += f.fee; this.slipCost += p.qty * s.p * f.slip / 100; this.calls.exec++;
    this.pos.splice(this.pos.indexOf(p), 1);
    const pnl = f.net - p.size;
    const tr = Object.assign({}, p, { closeEl: this.elapsed, closeMs: s.t || Date.now(), exitP: s.p, exitFill: f.px, feeOut: f.fee, slipOut: f.slip, proceeds: f.net, pnl, pnlPct: pnl / p.size * 100, why });
    this.closed.push(tr); if (this.closed.length > 1000) this.closed.shift();
    this.cooldown[p.addr] = Date.now() + ((pnl < 0 || stopped) && this.cfg.cooldownLoss ? this.cfg.cooldownLoss : this.cfg.cooldown) * 60000;
    if (this.ag && this.ag.exec) { const ex = this.ag.exec; ex.fills++; ex.n++; ex.lastMs = Date.now(); ex.sym = p.sym; ex.last = `VENTE ${p.sym} ${U.sUsd(pnl)} (${fmtP(pnl / p.size * 100)}) · ${why}`; }
    this.emit({ kind: 'sell', sym: p.sym, addr: p.addr, pnl, pnlPct: tr.pnlPct, why, price: s.p, txt: `VENDU ${p.sym} ${U.sUsd(pnl)} (${fmtP(tr.pnlPct)}) · ${why}` });
  }
  summary() {
    const e = this.equity(), cl = this.closed, w = this.wins();
    const best = cl.reduce((a, b) => (!a || b.pnl > a.pnl ? b : a), null), worst = cl.reduce((a, b) => (!a || b.pnl < a.pnl ? b : a), null);
    return { key: this.key, mode: this.mode, preset: this.cfg.preset, start: this.startMs, end: this.endMs || Date.now(), stake: this.cfg.stake, final: e, pnl: e - this.cfg.stake, pnlPct: (e / this.cfg.stake - 1) * 100,
      trades: cl.length, wins: w, losses: cl.length - w, winRate: cl.length ? w / cl.length * 100 : null, maxDD: this.maxDD, fees: this.fees, slip: this.slipCost,
      coins: new Set(cl.map(t => t.addr)).size, best: best ? [best.sym, best.pnl] : null, worst: worst ? [worst.sym, worst.pnl] : null, minutes: this.elapsed / 60000 };
  }
  serialize() { const o = {}; ['key', 'cfg', 'state', 'reason', 'cash', 'pos', 'closed', 'hist', 'elapsed', 'fees', 'slipCost', 'evals', 'rejects', 'calls', 'peak', 'minEq', 'maxDD', 'cooldown', 'startMs', 'endMs', 'uid', 'mode', 'ag'].forEach(k => { o[k] = this[k]; }); o.log = this.log.slice(0, 60).map(e => ({ kind: e.kind, sym: e.sym, txt: e.txt, pnl: e.pnl, ms: e.ms, mod: e.mod })); return o; }
  restore(o) { Object.assign(this, o); if (!this.cfg || this.cfg.ver !== 2) { const old = this.cfg || {}; const pr = PRESETS[old.preset] ? old.preset : 'equilibre'; this.cfg = Object.assign(defaultCfg(this.key, pr), { stake: old.stake ?? SCENE_DEFAULTS[this.key].stake, dur: old.dur ?? SCENE_DEFAULTS[this.key].dur, target: old.target ?? (old.stake || 38) * 2 }); } const b = PaperSession.blankAg(); this.ag = Object.assign(b, o.ag || {}); this.traces = []; this.trSeq = 0; this.events = []; this.seq = 0; this.lastSkip = {}; this.sampleAt = this.elapsed; if (this.state === 'running') { this.state = 'paused'; this.reason = 'restaurée après rechargement — appuie sur Reprendre'; } }
}

/* ========================= SIM : gestionnaire des 3 sessions ========================= */
const Sim = {
  s: {}, history: [],
  init() { ['A'].forEach(k => { this.s[k] = new PaperSession(k, defaultCfg(k)); }); },
  all() { return Object.values(this.s); },
  anyRunning() { return this.all().some(x => x.state === 'running'); },
  onUpdate(toks) { this.all().forEach(x => x.onUpdate(toks)); },
  onOffline() { this.all().forEach(x => x.pause('flux de données coupé — en pause')); SimUI.banner(T2.offline, true); },
  onFeedBack() { SimUI.banner(T2.feedBack, true); setTimeout(() => SimUI.banner('', false), 8000); },
  tick(dtMs) { this.all().forEach(x => x.tick(dtMs)); },
  recordHistory(x) { this.history.unshift(x.summary()); if (this.history.length > 60) this.history.pop(); SimStore.save(); },
  /* portefeuille agrégé : relevé toutes les 5 s (heure réelle) des 3 capitaux */
  agg: [], aggAt: 0, aggPeak: 0, aggDD: 0,
  totals() {
    const xs = this.all(), eq = xs.reduce((a, x) => a + x.equity(), 0), stake = xs.reduce((a, x) => a + x.cfg.stake, 0);
    const cl = xs.flatMap(x => x.closed.map(t => Object.assign({ bot: x.key }, t)));
    const w = cl.filter(t => t.pnl >= 0).length;
    const best = cl.reduce((a, b) => (!a || b.pnl > a.pnl ? b : a), null), worst = cl.reduce((a, b) => (!a || b.pnl < a.pnl ? b : a), null);
    return { eq, stake, pnl: eq - stake, pnlPct: stake ? (eq / stake - 1) * 100 : 0, trades: cl.length, wins: w, losses: cl.length - w, winRate: cl.length ? w / cl.length * 100 : null,
      open: xs.reduce((a, x) => a + x.pos.length, 0), fees: xs.reduce((a, x) => a + x.fees + x.slipCost, 0), best, worst, dd: this.aggDD, running: xs.filter(x => x.state === 'running').length };
  },
  sampleAgg(force) {
    const now = Date.now(); if (!force && (now < this.aggAt || !this.anyRunning())) return; this.aggAt = now + 5000;
    const e = { t: now }; let tot = 0; this.all().forEach(x => { e[x.key] = +x.equity().toFixed(4); tot += e[x.key]; }); e.T = +tot.toFixed(4);
    this.agg.push(e); if (this.agg.length > 3000) this.agg.splice(0, this.agg.length - 3000);
    this.aggPeak = Math.max(this.aggPeak || 0, tot); this.aggDD = Math.max(this.aggDD || 0, this.aggPeak ? (this.aggPeak - tot) / this.aggPeak * 100 : 0);
  },
  resetAgg() { this.agg = []; this.aggPeak = 0; this.aggDD = 0; this.aggAt = 0; },
  startAll() { if (Feed.offline && Feed.mode === 'live') { Feed.offline = false; Feed.fails = 0; SimUI.banner('', false); } this.all().forEach(x => { if (x.state !== 'running' && x.state !== 'ended') x.start(); }); this.sampleAgg(true); },
  pauseAll() { this.all().forEach(x => x.pause()); },
  stopAll() { this.all().forEach(x => x.stop()); this.sampleAgg(true); },
  onTrade(x, ev) { if (typeof Notify !== 'undefined') Notify.trade(x, ev); },
  onScan(src, n, fresh) { this.all().forEach(x => { if (x.state !== 'running') return; const a = x.ag.scan; a.disc = `${SRCFR[src] || src} : ${n} tokens Solana, ${fresh} nouveaux`; a.lastMs = Date.now(); }); },
};

/* ========================= BACKTEST : réglage sur les données réelles enregistrées ========================= */
/* Rejoue les mêmes règles sur les relevés de prix collectés pendant la session (in-sample : risque de sur-ajustement). */
const Backtest = {
  data(mode) {
    const toks = [...Feed.tokens.values()].filter(t => t.snaps.length > 3 && t.synthetic === (mode === 'practice'));
    const ev = []; toks.forEach((t, ti) => t.snaps.forEach((s, si) => ev.push([s.t, ti, si])));
    ev.sort((a, b) => a[0] - b[0]);
    return { toks, ev, span: ev.length ? (ev[ev.length - 1][0] - ev[0][0]) / 60000 : 0, snaps: ev.length };
  },
  /* rejoue exactement la logique de la session (entrée, taille, niveaux, sorties, délais, plafond horaire) */
  run(cfg, D, opt = {}) {
    let cash = cfg.stake, peak = cfg.stake, maxDD = 0, fees = 0, slip = 0; const pos = new Map(), cd = new Map(), closed = [], lastP = new Map(), seen = new Map(), entries = [];
    const val = (ti, p) => { const s = lastP.get(ti); return Rules.fillSell(s.p, p.qty, s.liq, cfg).net; };
    const eqf = () => cash + [...pos.entries()].reduce((a, [ti, p]) => a + val(ti, p), 0);
    const t0 = opt.from || 0, t1 = opt.to || Infinity; let k = 0;
    const sell = (ti, p, s, why, stopped) => { const f = Rules.fillSell(s.p, p.qty, s.liq, cfg); cash += f.net; fees += f.fee; slip += p.qty * s.p * f.slip / 100; const pnl = f.net - p.size; closed.push({ pnl, pct: pnl / p.size * 100, why, sym: D.toks[ti].sym, mins: (s.t - p.openMs) / 60000 }); pos.delete(ti); cd.set(ti, s.t + ((pnl < 0 || stopped) && cfg.cooldownLoss ? cfg.cooldownLoss : cfg.cooldown) * 60000); };
    for (const [t, ti, si] of D.ev) {
      const tok = D.toks[ti], s = tok.snaps[si]; lastP.set(ti, s); if (!seen.has(ti)) seen.set(ti, t);
      if (t < t0 || t > t1) { if (t > t1 && !pos.size) break; if (t > t1) { const p = pos.get(ti); if (p) sell(ti, p, s, 'fin de fenêtre'); } continue; }
      const p = pos.get(ti);
      if (p) { const ex = Rules.exit(p, s, cfg); if (ex) sell(ti, p, s, ex.why, ex.stop); }
      else if (!(cd.get(ti) > t)) {
        while (entries.length && t - entries[0] >= 3600e3) entries.shift();
        const r = Rules.entry(s, Rules.mom60(tok.snaps, si), cfg, { equity: eqf(), cash, open: pos.size, obsS: (t - seen.get(ti)) / 1000, vol: Rules.vol5(tok.snaps, si), perHour: entries.length });
        if (r.ok) { const f = Rules.fillBuy(s.p, r.size, s.liq, cfg); cash -= r.size; fees += f.fee; slip += r.size * f.slip / 100; entries.push(t); pos.set(ti, { qty: f.qty, size: r.size, entryP: s.p, peakP: s.p, openMs: t, entryLiq: s.liq, stopD: r.M.risk.stopD, tpD: r.M.risk.tpD }); }
      }
      if (++k % 10 === 0) { const e = eqf(); peak = Math.max(peak, e); maxDD = Math.max(maxDD, (peak - e) / peak * 100); }
    }
    pos.forEach((p, ti) => sell(ti, p, lastP.get(ti), 'fin des données'));
    peak = Math.max(peak, cash); maxDD = Math.max(maxDD, (peak - cash) / peak * 100);
    const w = closed.filter(x => x.pnl >= 0).length;
    return { ret: (cash / cfg.stake - 1) * 100, final: cash, trades: closed.length, wins: w, winRate: closed.length ? w / closed.length * 100 : null, maxDD, fees, slip, closed };
  },
  grid(key, base) {
    const D = this.data(Feed.mode); const out = [];
    if (D.snaps < 50) return { D, out };
    ['prudent', 'equilibre', 'agressif'].forEach(pr => [3, 5, 8].forEach(size => [2, 3].forEach(volK => [50000, 100000].forEach(liq => [true, false].forEach(tr => {
      const c = defaultCfg(key, pr); Object.assign(c, { stake: base.stake, maxPct: size, volK, trailOn: tr, feePct: base.feePct, netFee: base.netFee, baseSlip: base.baseSlip }); c.f.minLiq = liq;
      out.push({ label: `${T2.presets[pr]} · taille ${size}% · stop ${volK}×vol · liq. ≥ ${fmtK(liq)} · ${tr ? 'suiveur' : 'objectif fixe'}`, cfg: c, r: this.run(c, D) });
    })))));
    out.sort((a, b) => (b.r.ret - .5 * b.r.maxDD) - (a.r.ret - .5 * a.r.maxDD));
    return { D, out, presets: ['prudent', 'equilibre', 'agressif'].map(pr => { const c = defaultCfg(key, pr); Object.assign(c, { stake: base.stake }); return { label: T2.presets[pr] + ' (par défaut)', r: this.run(c, D) }; }) };
  },
};

/* ========================= STORE : localStorage (try/catch) ========================= */
const SimStore = {
  KEY: 'grokbot.sim.v1',
  load() { try { return JSON.parse(localStorage.getItem(this.KEY) || '{}') || {}; } catch (e) { return {}; } },

  tune() {
    const x = SimApp.sess(); const t0 = performance.now(); const g = Backtest.grid(x.key, x.cfg); const ms = performance.now() - t0;
    if (!g.out.length) { U.html(this.p.tune, `Pas encore assez de données enregistrées (${g.D.snaps} relevés de prix). Laisse tourner une session quelques minutes.`); return; }
    this.best = g.out[0];
    const row = o => `<tr><td>${U.esc(o.label)}</td><td class="${o.r.ret >= 0 ? 'g' : 'r'}">${fmtP(o.r.ret)}</td><td>-${o.r.maxDD.toFixed(1)}%</td><td>${o.r.trades}</td><td>${o.r.winRate === null ? 'n.d.' : Math.round(o.r.winRate) + '%'}</td></tr>`;
    U.html(this.p.tune, `<div class="note">${g.out.length} variantes rejouées sur ${U.int(g.D.snaps)} relevés réels de ${g.D.toks.length} tokens sur ${g.D.span.toFixed(1)} min (${ms.toFixed(0)} ms). Résultat sur les mêmes données : fenêtre courte, sur-ajustement probable — ce n’est pas une prévision.</div>
      <table><tr><th>variante</th><th>rendement</th><th>repli max</th><th>trades</th><th>réussite</th></tr>${g.out.slice(0, 6).map(row).join('')}<tr><td colspan="5" class="sub">préréglages par défaut</td></tr>${g.presets.map(row).join('')}<tr><td colspan="5" class="sub">pire variante</td></tr>${row(g.out[g.out.length - 1])}</table>`);
    this.P.querySelector('[data-a="apply"]').disabled = false;
  },
  togglePanel(on) { const P = document.getElementById('panel'); const v = on === undefined ? !P.classList.contains('show') : on; P.classList.toggle('show', v); document.body.classList.toggle('panel-open', v); SimApp.layout(); if (v) { this.renderFields(); this.refresh(); this.feedStatus(); } },
  banner(txt, on) { const b = document.getElementById('banner'); if (txt) b.textContent = txt; b.classList.toggle('show', on); },
  recapHTML(x) {
    const s = x.summary(), mul = (s.final / s.stake).toFixed(2);
    const tk = v => (v ? `<span>${U.esc(v[0])}</span><span class="${v[1] >= 0 ? 'pos' : 'neg'}">${U.sUsd(v[1])}</span>` : '<span>n.d.</span>');
    return `<div class="rc-h">${VIS.logo()}<div><div class="rc-t">Bilan de session · ${s.minutes >= 60 ? (s.minutes / 60).toFixed(1) + ' h' : Math.round(s.minutes) + ' min'}</div><div class="rc-s">${x.mode === 'practice' ? 'prix SYNTHÉTIQUES' : 'données DexScreener'} · ${hhmmOf(s.start)} → ${hhmmOf(s.end)} · ${T2.presets[s.preset]}</div></div></div>
      <div class="rc-l">mise de départ</div><div class="rc-big">${U.usd(s.stake)}</div>
      <div class="rc-l">valeur finale</div><div class="rc-now"><div class="rc-big ${s.pnl >= 0 ? '' : 'negv'}">${U.usd(s.final)}</div><span class="mulpill">${mul}×</span></div>
      <div class="tiles"><div class="tilex"><div class="k">trades</div><div class="v">${s.trades}</div></div><div class="tilex"><div class="k">tokens</div><div class="v">${s.coins}</div></div><div class="tilex"><div class="k">réussite</div><div class="v">${s.winRate === null ? 'n.d.' : Math.round(s.winRate) + '%'}</div></div><div class="tilex"><div class="k">repli max</div><div class="v">${s.maxDD.toFixed(1)}%</div></div></div>
      <div class="rc-lines"><div class="ln"><span class="g">meilleur</span>${tk(s.best)}</div><div class="ln"><span class="g">pire</span>${tk(s.worst)}</div>
      <div class="ln">Résultat ${U.sUsd(s.pnl)} (${fmtP(s.pnlPct)}) · stop -${x.cfg.stop}% sur chaque trade</div><div class="ln g">frais ${U.usd(s.fees)} · slippage ${U.usd(s.slip)} · ${U.esc(x.reason)}</div></div>
      <div class="rc-act"><div class="cta" data-rc="csv">exporter les trades (CSV)</div><div class="cta alt" data-rc="new">nouvelle session</div></div>
      <div class="demo-note">touche pour fermer</div>`;
  },
};

/* ========================= APP : moteur en arrière-plan + boucle d'affichage ========================= */
const SimApp = {
  scene: 'trading', last: 0, saveAt: 0, feedAt: 0, pk: 'A', eLast: 0, keys: { trading: 'A' },
  init() {
    Sim.init();
    const st = SimStore.load();
    Prefs.load(st.prefs);
    if (st.feedMode === 'practice') Feed.mode = 'practice';
    if (Array.isArray(st.history)) Sim.history = st.history.filter(h => h && h.key === 'A');
    this.restoring = true;
    if (st.sessions && st.sessions.A && st.sessions.A.cfg) { try { Sim.s.A.restore(st.sessions.A); } catch (e) { Sim.s.A.reset(); } }
    this.restoring = false;
    this.views = { trading: SimA };
    Notify.init(); Tip.init(); Sound.init(); FX.init();
    SimA.build(document.getElementById('sceneA')); SimA.reset();
    SimUI.build();
    document.getElementById('sceneA').classList.add('on'); document.body.dataset.scene = 'trading';
    if (Sim.s.A.state === 'paused' && Sim.s.A.reason) Notify.show('Session restaurée', 'appuie sur Reprendre pour continuer là où tu t’étais arrêté', 'info');
    addEventListener('resize', () => this.layout());
    addEventListener('keydown', e => {
      if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
      if (e.code === 'Space') { e.preventDefault(); this.toggle(); }
      if (e.key === 'r' || e.key === 'R') SimUI.togglePanel();
      if (e.key === 'Escape') { SimUI.togglePanel(false); Tip.hide(); }
      const t = ['log', 'pos', 'tr', 'hist'][+e.key - 1]; if (t) { const b = SimA.r.tabs.querySelector(`[data-t="${t}"]`); if (b) b.click(); }
    });
    addEventListener('online', () => { if (Feed.offline) SimUI.banner('connexion rétablie — appuie sur Reprendre', true); });
    addEventListener('offline', () => SimUI.banner('pas de connexion internet — le flux de prix va se couper', true));
    this.layout(); SimUI.refresh();
    SimUI.togglePanel(false);
    this.engine();
    requestAnimationFrame(t => { this.last = t; requestAnimationFrame(n => this.loop(n)); });
  },
  sess() { return Sim.s.A; },
  view() { return SimA; },
  viewOf() { return SimA; },
  resumeFeed() { if (Feed.offline && Feed.mode === 'live') { Feed.offline = false; Feed.fails = 0; Feed.backoffUntil = 0; SimUI.banner('', false); } },
  toggle() {
    const x = this.sess(); if (x.state === 'running') x.pause(); else if (x.state === 'ended') { x.reset(); SimA.reset(); x.start(); } else { this.resumeFeed(); x.start(); }
    SimUI.refresh(); SimStore.save();
  },
  /* moteur indépendant de requestAnimationFrame : minuterie dans un Web Worker (moins bridée onglet caché), repli setInterval */
  engine() {
    const step = () => { const now = performance.now(); const dt = Math.min(70000, Math.max(0, now - (this.eLast || now))); this.eLast = now;
      try { Sim.tick(dt); Feed.tick(now); Sound.schedule(); if (now > this.saveAt) { this.saveAt = now + 5000; SimStore.save(); } } catch (err) { console.error(err); } };
    this.eLast = performance.now();
    try {
      this.worker = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),200);'], { type: 'text/javascript' })));
      this.worker.onmessage = step; this.worker.onerror = e => { if (e.preventDefault) e.preventDefault(); if (!this.iv) this.iv = setInterval(step, 200); };
    } catch (e) { this.iv = setInterval(step, 200); }
  },
  layout() {
    const vw = innerWidth, vh = innerHeight, mobile = vw < 760, panel = document.body.classList.contains('panel-open') && vw >= 1000;
    document.body.classList.toggle('mobile', mobile);
    const aw = vw - (panel ? 360 : 0);
    const unit = mobile ? vw / 560 : Math.min((aw - 40) / 1000, Math.max((vh - 30) / 1130, 1), 1.5);
    document.getElementById('sceneA').style.paddingRight = panel ? '360px' : '0';
    document.documentElement.style.fontSize = unit + 'px'; document.documentElement.style.setProperty('--u', unit + 'px');
  },
  loop(now) {
    this.last = now;
    try {
      SimA.render(now); FX.step(now, SimApp.sess());
      for (const n of Num.all) n.step(now);
      if (now > this.feedAt) { this.feedAt = now + 500; if (document.getElementById('panel').classList.contains('show')) SimUI.feedStatus(); SimUI.refresh(); }
    } catch (err) { console.error(err); }
    requestAnimationFrame(n => this.loop(n));
  },
};
document.addEventListener('DOMContentLoaded', () => SimApp.init());

</script>
