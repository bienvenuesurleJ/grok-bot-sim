<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grok Bot — paper trading simulation (real market data, fictional wallet)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   GROK BOT — design system (variables CSS)
   :root = thème A (dashboard verre) · .theme-b = mobile sombre · .theme-c = mobile clair
   Unité : 1rem = --u px (A : largeur/960 ; B/C : largeur du cadre/540), recalculée en JS
   ========================================================= */
:root{
  --u:1px;
  --a-bg:#0a0d18; --a-text:#f2f4fb; --a-label:#8c94a9; --a-dim:#5d667c; --a-head:#9aa3b8;
  --a-win:#34e8a0; --a-loss:#ff5c75; --a-exec:#5aa5ff; --a-scan:#8d8ef7; --a-warn:#f6b73c; --a-brand:#b66dff;
  --demo:#f6b73c; --live:#34e8a0;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  --outfit:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --inter:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
.theme-b{
  --bg:#0b0c0f; --card:#14161b; --line:rgba(255,255,255,.07); --sheet:#15171c; --handle:#3a3e47;
  --text:#ffffff; --sub:#8b919c; --pos:#2fd47f; --neg:#ff5d73; --buy:#5aa9ff; --sell:#2fd47f;
  --btn:#1f9d55; --cta-bg:#f2f2f2; --cta-fg:#000; --mul-bg:#f4f4f4; --mul-fg:#000;
  --dpill-bg:#12301f; --dpill-fg:#3ddc97; --pill:rgba(255,255,255,.06); --curve:#2fd47f; --shadow:none;
  --tile:rgba(255,255,255,.04); --toast:rgba(30,32,38,.92); --amber:#f2b84b; --chipbg:#14161b; --tag:rgba(255,255,255,.07);
}
.theme-c{
  --bg:#f5f6f8; --card:#ffffff; --line:#ececf0; --sheet:#ffffff; --handle:#d6d8de;
  --text:#0b0b0f; --sub:#8a8f99; --pos:#16a34a; --neg:#e5484d; --buy:#3b6fe8; --sell:#16a34a;
  --btn:#1fa854; --cta-bg:#0d0d10; --cta-fg:#fff; --mul-bg:#0d0d10; --mul-fg:#fff;
  --dpill-bg:#e3f6e8; --dpill-fg:#16a34a; --pill:rgba(0,0,0,.05); --curve:#16a34a; --shadow:0 1px 2px rgba(0,0,0,.04);
  --tile:#f3f4f6; --toast:rgba(255,255,255,.92); --amber:#c98a10; --chipbg:#ffffff; --tag:#f0f1f4;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--a-bg);font-family:var(--outfit);-webkit-font-smoothing:antialiased;color:var(--a-text)}
body[data-scene=gmgn]{background:radial-gradient(120vmax 80vmax at 50% 0%,#15171d,#060708)}
body[data-scene=meme]{background:radial-gradient(120vmax 80vmax at 50% 0%,#eef1f5,#d9dee5)}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene.on{display:block}
.mono{font-family:var(--mono)}

/* ---------- pastilles d'état DEMO / LIVE / PAPER (communes) ---------- */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--live);flex:none}
.dot.demo{background:var(--demo)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.72);opacity:.55}}
.paper-badge{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:2px 5px;border-radius:5px;background:rgba(90,165,255,.18);color:#8cc2ff;border:1px solid rgba(90,165,255,.4)}
.theme-c .paper-badge{background:#e8efff;color:#3b6fe8;border-color:#bfd0fb}

/* =========================================================
   SCÈNE A — dashboard « verre » 4:3 (référence 960 × 720)
   ========================================================= */
#sceneA .glows{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#sceneA .glow{position:absolute;border-radius:50%;will-change:transform}
#sceneA .g1{width:80vmax;height:80vmax;left:-30vmax;top:-34vmax;background:radial-gradient(closest-side,rgba(48,96,255,.28),transparent);animation:drift1 20s ease-in-out infinite}
#sceneA .g2{width:70vmax;height:70vmax;right:-30vmax;top:5vmax;background:radial-gradient(closest-side,rgba(200,50,90,.22),transparent);animation:drift2 20s ease-in-out infinite}
#sceneA .g3{width:80vmax;height:70vmax;left:15vmax;bottom:-40vmax;background:radial-gradient(closest-side,rgba(130,70,220,.20),transparent);animation:drift3 20s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(6vmax,4vmax)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-5vmax,6vmax)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(4vmax,-5vmax)}}

.a-board{position:absolute;left:50%;top:50%;width:960rem;height:720rem;margin-left:-480rem;margin-top:-360rem;padding:16rem;display:flex;flex-direction:column;justify-content:space-between}
.glass{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(8,12,24,.70));border:1px solid rgba(255,255,255,.10);border-radius:18rem;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.a-lbl{font-family:var(--mono);font-size:9rem;letter-spacing:.12em;text-transform:uppercase;color:var(--a-label)}

/* en-tête */
.a-head{height:74rem;display:flex;justify-content:space-between;align-items:flex-start}
.a-brand{display:flex;flex-direction:column}
.a-pill{height:46rem;width:268rem;border:1px solid rgba(255,255,255,.12);border-radius:999rem;display:flex;align-items:center;gap:10rem;padding:0 18rem 0 4rem;background:rgba(255,255,255,.025)}
.a-pill .logo{width:38rem;height:38rem;flex:none}
.a-word{font-family:var(--outfit);font-weight:700;font-size:34rem;letter-spacing:.01em;line-height:1;color:#fff;white-space:nowrap}
.a-word b{color:var(--a-brand);font-weight:700}
.a-mode{margin:8rem 0 0 70rem;font-family:var(--mono);font-size:12rem;letter-spacing:.12em;color:#9aa3b8;text-transform:uppercase}
.a-right{display:flex;flex-direction:column;align-items:flex-end}
.a-live{height:46rem;min-width:74rem;padding:0 14rem;border:1px solid rgba(255,255,255,.12);border-radius:999rem;display:flex;align-items:center;justify-content:center;gap:8rem;font-family:var(--mono);font-size:12rem;color:#fff;letter-spacing:.06em;background:rgba(255,255,255,.025)}
.a-live .dot{width:10rem;height:10rem}
.a-live .paper-badge{font-size:8rem;padding:2rem 5rem;border-radius:5rem}
.a-tasks{margin-top:8rem;font-family:var(--mono);font-size:12rem;color:#dfe3ef;letter-spacing:.04em}
.a-tasks span{color:var(--a-label)}

/* cartes de chiffres */
.a-stats{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:72rem 72rem;gap:8rem}
.a-stat{padding:12rem 18rem;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.a-stat.bar::before{content:'';position:absolute;left:0;top:14rem;bottom:14rem;width:3rem;border-radius:0 3rem 3rem 0;background:var(--bc)}
.a-val{font-family:var(--outfit);font-weight:700;font-size:28rem;line-height:1.1;color:#fff;margin:3rem 0 2rem;transition:color .6s}
.a-val.green{color:var(--a-win)}
.a-sub{font-family:var(--mono);font-size:10rem;color:var(--a-label)}
.flash-up{color:var(--a-win)!important;transition:none!important}
.flash-down{color:var(--a-loss)!important;transition:none!important}
.a-wr{flex-direction:row;align-items:center;justify-content:flex-start;gap:16rem}
.a-ring{position:relative;width:50rem;height:50rem;flex:none}
.a-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.a-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--outfit);font-weight:700;font-size:14rem;color:#fff}
.a-wrtext{display:flex;flex-direction:column;gap:3rem}
.a-wrtext .w{font-family:var(--mono);font-size:11rem;color:var(--a-win)}
.a-wrtext .l{font-family:var(--mono);font-size:11rem;color:var(--a-loss)}
.a-closed{position:absolute;right:16rem;bottom:10rem;font-family:var(--mono);font-size:10rem;color:var(--a-label)}

/* rangée du milieu */
.a-mid{display:grid;grid-template-columns:512rem 1fr;gap:8rem;height:276rem}
.a-card{padding:14rem;overflow:hidden}
.a-ch{display:flex;justify-content:space-between;align-items:center;height:16rem}
.a-title{font-family:var(--mono);font-size:11rem;color:#fff;letter-spacing:.12em;text-transform:uppercase}
.a-meta{font-family:var(--mono);font-size:10rem;color:var(--a-label);letter-spacing:.06em}
.a-chart{display:block;width:484rem;height:224rem;margin-top:8rem;overflow:visible}
.a-chart text{font-family:var(--mono);font-size:10px;fill:var(--a-label)}
.a-chart .cur{font-family:var(--outfit);font-weight:600;font-size:15px;fill:var(--a-win);paint-order:stroke;stroke:rgba(10,13,24,.85);stroke-width:4px}
.a-chart .ring{transform-box:fill-box;transform-origin:center;animation:ringgrow 1.6s ease-out infinite}
@keyframes ringgrow{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}

.a-pipe{position:relative;height:66rem;margin-top:10rem}
.a-prow{position:absolute;left:0;right:0;top:0;height:22rem;display:flex;align-items:center;transition:transform .25s ease,opacity .25s ease}
.a-prow .tk{width:70rem;font-family:var(--mono);font-size:11rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}
.a-dots{display:flex;gap:8rem;align-items:center}
.pd{position:relative;width:9rem;height:9rem;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.pd.ok{background:var(--a-win);border-color:var(--a-win)}
.pd.fail{background:var(--a-loss);border-color:var(--a-loss)}
.pd.na{border:1px dashed rgba(255,255,255,.35);opacity:.8}
.pd.run{border:1.5px solid rgba(90,165,255,.35)}
.pd.run::after{content:'';position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid transparent;border-top-color:var(--a-exec);animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.a-prow .st{margin-left:auto;font-family:var(--mono);font-size:9rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.st.chk{color:var(--a-exec)} .st.rej{color:var(--a-loss)} .st.pass{color:var(--a-win)} .st.na{color:var(--a-label)}
.a-sep{height:1px;background:rgba(255,255,255,.08);margin:8rem 0 6rem}
.a-feed{position:relative;height:138rem;overflow:hidden}
.a-line{position:absolute;left:0;right:0;top:0;height:17rem;line-height:15rem;font-family:var(--mono);font-size:10rem;color:#dfe3ef;white-space:pre;overflow:hidden;text-overflow:ellipsis;padding:0 6rem;border:1px solid transparent;border-radius:6rem;transition:transform .25s ease,opacity .25s ease}
.a-line.big{background:rgba(52,232,160,.10);border-color:rgba(52,232,160,.45)}
.a-line .tag{font-weight:600}
.tag.SCAN{color:var(--a-scan)} .tag.EXEC{color:var(--a-exec)} .tag.FILL,.tag.BIG{color:var(--a-win)} .tag.WARN,.tag.RISK{color:var(--a-warn)} .tag.LOSS{color:var(--a-loss)} .tag.PAPER{color:#8cc2ff}

/* objectif journalier */
.a-daily{height:20rem;display:flex;align-items:center;gap:14rem}
.a-daily .lab{font-family:var(--mono);font-size:11rem;color:var(--a-label);letter-spacing:.12em;white-space:nowrap}
.a-track{flex:1;height:8rem;border-radius:99rem;background:rgba(255,255,255,.08);overflow:hidden}
.a-fill{height:100%;width:100%;border-radius:99rem;background:linear-gradient(90deg,#2dd4bf,#34e8a0);transform-origin:left center;transform:scaleX(0);transition:transform .6s ease}
.a-daily .pct{font-family:var(--mono);font-size:11rem;color:var(--a-win);width:36rem;text-align:right}

/* rangée des 6 agents */
.a-agents{display:flex;gap:12rem;height:98rem}
.a-tile{flex:1;border-radius:16rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9rem;transition:box-shadow .35s,background .35s}
.a-tile .bar{position:absolute;top:12rem;left:12rem;width:22rem;height:4rem;border-radius:2rem;background:var(--c)}
.a-tile .tint{position:absolute;inset:0;border-radius:16rem;background:var(--c);opacity:0;transition:opacity .35s}
.a-tile.on .tint{opacity:.14}
.a-tile.on{box-shadow:inset 0 0 0 1.5px var(--c),0 0 18rem color-mix(in srgb,var(--c) 25%,transparent)}
.a-tile .nm{position:relative;font-family:var(--outfit);font-weight:700;font-size:17rem;letter-spacing:.06em;text-transform:uppercase;color:#9aa3b8;transition:color .35s}
.a-tile.on .nm{color:#fff}
.orb{position:relative;width:36rem;height:36rem;border-radius:50%;background:radial-gradient(circle at 32% 26%,#ffffff 0%,color-mix(in srgb,var(--c) 45%,#fff) 16%,var(--c) 52%,color-mix(in srgb,var(--c) 55%,#000) 100%);box-shadow:0 7rem 10rem -5rem rgba(0,0,0,.7),0 2rem 6rem rgba(0,0,0,.3);transition:transform .35s}
.orb::before,.orb::after{content:'';position:absolute;top:50%;width:3rem;height:6rem;margin-top:-3rem;border-radius:2rem;background:#0a0b10}
.orb::before{left:calc(50% - 5rem)} .orb::after{left:calc(50% + 2rem)}
.a-tile.on .orb{animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1.06)}50%{transform:scale(1.0)}}
.a-replay{position:absolute;left:50%;top:calc(50% - 300rem);transform:translate(-50%,0);padding:14rem 28rem;border-radius:999rem;border:1px solid rgba(255,255,255,.2);background:rgba(10,13,24,.8);color:#fff;font-family:var(--mono);font-size:14rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.a-replay.show{opacity:1;pointer-events:auto}

/* =========================================================
   SCÈNES B et C — cadre de téléphone (référence 540 de large)
   ========================================================= */
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:var(--fw);height:var(--fh);border-radius:44px;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--outfit);isolation:isolate}
.phone.theme-b{box-shadow:0 0 0 9px #111216,0 0 0 10px #2b2d33,0 30px 90px rgba(0,0,0,.6)}
.phone.theme-c{box-shadow:0 0 0 9px #1a1b1e,0 0 0 10px #3d3f45,0 30px 70px rgba(0,0,0,.22)}
body.mobile .phone{border-radius:0;box-shadow:none}
.scr{position:absolute;inset:0;opacity:0;visibility:hidden;will-change:opacity}
.phone.theme-c .scr.inset{top:70rem}

/* barre d'état iPhone (C) */
.sbar{position:absolute;left:0;right:0;top:0;height:70rem;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:6rem 38rem 0 46rem;font-family:var(--inter);font-weight:600;font-size:23rem;color:#0b0b0f;pointer-events:none}
.island{position:absolute;left:50%;top:14rem;width:166rem;height:47rem;margin-left:-83rem;border-radius:999rem;background:#000}
.sb-r{display:flex;align-items:center;gap:8rem}
.bars{display:flex;align-items:flex-end;gap:2.5rem;height:16rem}
.bars i{display:block;width:4.5rem;border-radius:1.5rem;background:#0b0b0f}
.lte{font-size:17rem;font-weight:700}
.batt{min-width:38rem;height:21rem;border-radius:7rem;background:#0b0b0f;color:#fff;font-size:13rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5rem}
.homebar{position:absolute;left:50%;bottom:10rem;width:186rem;height:7rem;margin-left:-93rem;border-radius:99rem;background:#0b0b0f;z-index:60;pointer-events:none}

/* icônes, logo, robots, avatars */
.logo{display:block}
.av{display:inline-flex;align-items:center;justify-content:center;width:26rem;height:26rem;border-radius:50%;color:#fff;font-family:var(--inter);font-weight:700;font-size:13rem;flex:none;vertical-align:middle}
.av.sm{width:22rem;height:22rem;font-size:11rem}
.robot{display:block;flex:none}

/* --- écran 1 : dossier --- */
.s1{overflow:hidden}
.s1 .wall{position:absolute;inset:-40rem}
.theme-b .s1 .wall{background:radial-gradient(60% 40% at 30% 20%,#5a2328 0%,transparent 70%),radial-gradient(50% 40% at 80% 70%,#3a1a22 0%,transparent 70%),linear-gradient(180deg,#2a1416,#0b0b0d)}
.theme-c .s1 .wall{background:radial-gradient(60% 40% at 25% 25%,#d6efe2 0%,transparent 70%),radial-gradient(50% 40% at 80% 75%,#d9e4f3 0%,transparent 70%),linear-gradient(180deg,#e8f3ee,#e6edf5)}
.fold-title{position:absolute;left:44rem;top:130rem;font-size:40rem;font-weight:700;letter-spacing:-.01em}
.theme-b .fold-title{color:#fff}.theme-c .fold-title{color:#000}
.fold-panel{position:absolute;left:44rem;right:44rem;top:206rem;padding:34rem 22rem 14rem;border-radius:46rem;display:grid;grid-template-columns:repeat(3,1fr);row-gap:26rem;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.theme-b .fold-panel{background:rgba(255,255,255,.12)}
.theme-c .fold-panel{background:rgba(255,255,255,.55);box-shadow:0 8rem 30rem rgba(0,0,0,.06)}
.app{display:flex;flex-direction:column;align-items:center;gap:9rem}
.app .ic{width:104rem;height:104rem;border-radius:26rem;display:flex;align-items:center;justify-content:center;font-family:var(--inter);font-weight:700;font-size:34rem;color:#fff;box-shadow:0 2rem 6rem rgba(0,0,0,.18);will-change:transform}
.app .ic .logo{width:104rem;height:104rem}
.app .nm{font-family:var(--inter);font-size:15rem;font-weight:500;white-space:nowrap}
.theme-b .app .nm{color:#f1f1f3}.theme-c .app .nm{color:#1b1c20}
.zoomer{position:absolute;border-radius:26rem;background:#161616;z-index:5;opacity:0;will-change:transform,opacity;display:flex;align-items:center;justify-content:center}
.theme-c .zoomer{background:#0d0d10}

/* --- écran 2 : terminal --- */
.s2 .boot{position:absolute;left:0;right:0;top:110rem;display:flex;flex-direction:column;align-items:center}
.boot-logo{width:90rem;height:90rem;border-radius:26rem;will-change:transform}
.theme-b .boot-logo{box-shadow:0 0 60rem rgba(61,220,151,.16)}
.theme-c .boot-logo{width:190rem;height:190rem;border-radius:50rem;box-shadow:0 18rem 40rem rgba(0,0,0,.18)}
.boot-title{margin-top:26rem;font-family:var(--outfit);font-weight:700;font-size:44rem;letter-spacing:-.01em}
.boot-pill{margin-top:12rem;padding:6rem 14rem;border-radius:8rem;background:var(--pill);color:var(--sub);font-family:var(--mono);font-size:15rem}
.term{margin-top:46rem;width:452rem;font-family:var(--mono);font-size:13rem;will-change:opacity}
.term .cmd{color:var(--sub);margin-bottom:12rem}
.term .ln{display:flex;align-items:center;gap:10rem;height:26rem;will-change:transform,opacity}
.term .ok{color:var(--pos);font-weight:700}
.term .rp{color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term .rv{color:var(--amber)}
.prog{margin:22rem auto 0;width:260rem;height:4rem;border-radius:99rem;background:var(--pill);overflow:hidden}
.prog i{display:block;height:100%;width:100%;background:#fff;transform-origin:left center;transform:scaleX(0)}
.theme-c .prog i{background:#0b0b0f}
.prog-l{margin-top:8rem;text-align:center;font-family:var(--mono);font-size:12rem;color:var(--sub)}
.dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}

/* --- feuilles (bottom sheets) --- */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:32rem 32rem 0 0;padding:12rem 30rem 34rem;will-change:transform;transform:translateY(105%)}
.theme-c .sheet{box-shadow:0 -10rem 40rem rgba(0,0,0,.1)}
.handle{width:36rem;height:4rem;border-radius:99rem;background:var(--handle);margin:0 auto 22rem}
.link-row{display:flex;align-items:center;justify-content:center;gap:16rem;margin-bottom:18rem}
.link-row .ic48{width:48rem;height:48rem;border-radius:14rem;display:flex;align-items:center;justify-content:center;overflow:hidden}
.link-row .ic48 .logo{width:48rem;height:48rem}
.brandpill{height:48rem;padding:0 16rem;border-radius:14rem;display:flex;align-items:center;font-family:var(--inter);font-weight:700;font-size:16rem;color:#fff}
.dashes{display:flex;gap:6rem}
.dashes i{display:block;width:12rem;height:4rem;border-radius:2rem;background:var(--dc);will-change:opacity}
.sh-title{text-align:center;font-family:var(--outfit);font-weight:700;font-size:28rem}
.sh-sub{text-align:center;color:var(--sub);font-size:17rem;margin-top:6rem}
.info{margin-top:20rem;border-radius:18rem;background:var(--tile);border:1px solid var(--line)}
.info .r{display:flex;justify-content:space-between;align-items:center;padding:13rem 18rem;font-size:15rem;gap:10rem}
.info .r+.r{border-top:1px solid var(--line)}

/* ========================= UTIL : petits outils ========================= */
const U = {
  clamp: (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)),
  lerp: (a, b, f) => a + (b - a) * f,
  prog(t, a, b) { return U.clamp((t - a) / (b - a)); },
  easeOut: f => 1 - Math.pow(1 - f, 3),
  easeInOut: f => (f < .5 ? 4 * f * f * f : 1 - Math.pow(-2 * f + 2, 3) / 2),
  /* générateur pseudo-aléatoire déterministe (mulberry32) */
  rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  },
  /* hachage entier → [0,1) (pour des choix idempotents) */
  h(n, s = 0) { let x = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(s | 0, 0xc2b2ae35); x ^= x >>> 13; x = Math.imul(x, 0x27d4eb2f); x ^= x >>> 16; return (x >>> 0) / 4294967296; },
  pick(arr, r) { return arr[Math.floor(r * arr.length) % arr.length]; },
  rr(r, a, b) { return a + (b - a) * r; },
  ri(r, a, b) { return Math.floor(a + (b - a + 1) * r); },
  /* bruit lisse déterministe dans [-1, 1] */
  noise(x, s) { return (Math.sin(x * 1.7 + s) + .6 * Math.sin(x * 3.13 + s * 2.1) + .3 * Math.sin(x * 7.37 + s * 3.7)) / 1.9; },
  fmt(n, d = 0) { return Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); },
  usd(v, d = 2) { return (v < 0 ? '-$' : '$') + U.fmt(v, d); },
  sUsd(v, d = 2) { return (v < 0 ? '-$' : '+$') + U.fmt(v, d); },
  int(v) { return Math.round(v).toLocaleString('en-US'); },
  pad(n) { return String(n).padStart(2, '0'); },
  hhmm(min) { const m = ((Math.floor(min) % 1440) + 1440) % 1440; return U.pad(Math.floor(m / 60)) + ':' + U.pad(m % 60); },
  hms(sec) { sec = Math.max(0, Math.floor(sec)); return U.pad(Math.floor(sec / 3600)) + ':' + U.pad(Math.floor(sec / 60) % 60) + ':' + U.pad(sec % 60); },
  tpl(s, o) { return s.replace(/\{(\w+)\}/g, (_, k) => (o[k] !== undefined ? o[k] : '')); },
  esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); },
  /* écritures DOM avec cache (évite de toucher au DOM si rien ne change) */
  text(el, s) { if (el && el._t !== s) { el._t = s; el.textContent = s; } },
  html(el, s) { if (el && el._h !== s) { el._h = s; el.innerHTML = s; } },
  css(el, p, v) { if (!el) return; const k = '_c' + p; if (el[k] !== v) { el[k] = v; el.style[p] = v; } },
  cls(el, c, on) { if (el) el.classList.toggle(c, !!on); },
  attr(el, a, v) { if (!el) return; const k = '_a' + a; if (el[k] !== v) { el[k] = v; el.setAttribute(a, v); } },
  /* opacité + visibilité d'un calque */
  show(el, o) { U.css(el, 'opacity', String(+o.toFixed(3))); U.css(el, 'visibility', o > 0.001 ? 'visible' : 'hidden'); },
  /* courbe lissée (Catmull-Rom → Bézier) */
  spline(pts) {
    if (pts.length < 2) return pts.length ? `M${pts[0][0]},${pts[0][1]}` : '';
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += `C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  },
  /* recherche du segment [i, i+1] contenant x dans un tableau trié de clés */
  seg(keys, x, get = k => k[0]) {
    const n = keys.length;
    if (x <= get(keys[0])) return { i: 0, f: 0 };
    if (x >= get(keys[n - 1])) return { i: n - 2, f: 1 };
    let i = 0; while (i < n - 2 && x >= get(keys[i + 1])) i++;
    const a = get(keys[i]), b = get(keys[i + 1]);
    return { i, f: (x - a) / (b - a) };
  },
  /* interpolation linéaire d'une colonne */
  keyLin(keys, col, x) { const { i, f } = U.seg(keys, x); return U.lerp(keys[i][col], keys[i + 1][col], f); },
};

const API = 'https://api.dexscreener.com';
const DISCOVERY = [
  ['boosts/latest', '/token-boosts/latest/v1'], ['profiles/latest', '/token-profiles/latest/v1'],
  ['boosts/top', '/token-boosts/top/v1'], ['takeovers/latest', '/community-takeovers/latest/v1'],

const Feed = {
  mode: 'live', /* 'live' (réel) ou 'practice' (synthétique, choisi explicitement) */
  tokens: new Map(), watch: [], queue: [], busy: false, lastReq: 0, minGap: 1050,
  fails: 0, backoffUntil: 0, offline: false, probeAt: 0,
  stats: { req: 0, ok: 0, err: 0, r429: 0, stale: 0, lastErr: '', lastOk: 0, bytes: 0 },
  discIdx: 0, nextDisc: 0, nextHeld: 0, nextWatch: 0, watchIdx: 0, listeners: [], events: [], seq: 0,
  MAX_WATCH: 60,
  active() { return Sim.anyRunning(); },
  push(ev) { ev.seq = ++this.seq; ev.ms = Date.now(); this.events.push(ev); if (this.events.length > 400) this.events.shift(); },
  since(seq) { return this.events.filter(e => e.seq > seq); },
  enqueue(job) { if (this.queue.some(j => j.id === job.id)) return; if (job.prio) this.queue.unshift(job); else this.queue.push(job); },
  heldAddrs() { const s = new Set(); Sim.all().forEach(x => x.pos.forEach(p => s.add(p.addr))); return [...s]; },
  tick(now) {
    if (this.mode === 'practice') { Practice.tick(now); return; }
    if (!this.active() && !this.offline) return;
    if (this.offline) { /* sonde toutes les 15 s */ if (now >= this.probeAt) { this.probeAt = now + 15000; if (!this.busy) this.run({ id: 'probe', kind: 'disc', path: DISCOVERY[0][1], name: DISCOVERY[0][0] }); } return; }
    if (now >= this.nextDisc) { this.nextDisc = now + 15000; const d = DISCOVERY[this.discIdx++ % DISCOVERY.length]; this.enqueue({ id: 'disc' + d[0], kind: 'disc', path: d[1], name: d[0] }); }
    const held = this.heldAddrs();
    if (held.length && now >= this.nextHeld) { this.nextHeld = now + 3000; for (let i = 0; i < held.length; i += 30) this.enqueue({ id: 'held' + i, kind: 'tokens', addrs: held.slice(i, i + 30), prio: true }); }
    if (this.watch.length && now >= this.nextWatch) {
      this.nextWatch = now + 2600;
      const n = this.watch.length, chunks = Math.ceil(n / 30), c = this.watchIdx++ % chunks;
      this.enqueue({ id: 'watch' + c, kind: 'tokens', addrs: this.watch.slice(c * 30, c * 30 + 30) });

  async get(path) {

    try {
      const r = await fetch(API + path, { signal: ctl.signal, headers: { Accept: 'application/json' } });
      if (r.status === 429) { this.stats.r429++; throw new Error('HTTP 429 rate limited'); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const txt = await r.text(); this.stats.bytes += txt.length; return JSON.parse(txt);
    } finally { clearTimeout(tm); }
  },
  async run(job) {
    this.busy = true; this.lastReq = performance.now(); this.stats.req++;
    try {
      if (job.kind === 'disc') {
        const data = await this.get(job.path);
        const sol = (Array.isArray(data) ? data : []).filter(d => d && d.chainId === 'solana' && d.tokenAddress);
        let fresh = 0;
        sol.forEach(d => { if (!this.tokens.has(d.tokenAddress)) { this.tokens.set(d.tokenAddress, this.blank(d.tokenAddress, job.name)); fresh++; } this.addWatch(d.tokenAddress); });
        this.push({ kind: 'scan', src: job.name, n: sol.length, fresh });
      } else {
        /* paramètre anti-cache : le CDN garde chaque URL 30 s, ce qui mélangerait des prix d'âges différents */
        const data = await this.get('/tokens/v1/solana/' + job.addrs.join(',') + '?_=' + Date.now());
        const best = new Map();
        (Array.isArray(data) ? data : []).forEach(p => {
          if (!p || p.chainId !== 'solana' || !p.baseToken) return;
          const a = p.baseToken.address; if (!job.addrs.includes(a)) return;
          const l = (p.liquidity && p.liquidity.usd) || 0, cur = best.get(a);
          if (!cur || l > ((cur.liquidity && cur.liquidity.usd) || 0)) best.set(a, p);

        best.forEach((p, a) => { const t = this.ingest(a, p); if (t) upd.push(t); });
        job.addrs.forEach(a => { if (!best.has(a)) { const t = this.tokens.get(a); if (t) t.noPair = (t.noPair || 0) + 1; } });

      this.backoffUntil = performance.now() + Math.min(60000, 2000 * Math.pow(2, this.fails - 1));

      if (this.fails >= 4 && !this.offline) { this.offline = true; this.queue = []; this.probeAt = performance.now() + 15000; Sim.onOffline(); }
    } finally { this.busy = false; }
  },
  blank(addr, src) { return { addr, sym: '$' + addr.slice(0, 4), src, firstSeen: Date.now(), snaps: [], price: null, synthetic: false }; },
  addWatch(a) { if (!this.watch.includes(a)) this.watch.push(a); while (this.watch.length > this.MAX_WATCH) this.evict(); },
  evict() {
    const held = new Set(this.heldAddrs());
    /* retire d'abord les tokens sans paire ou à liquidité minime, puis les plus anciens */
    let idx = this.watch.findIndex(a => !held.has(a) && ((this.tokens.get(a) || {}).noPair > 1 || ((this.tokens.get(a) || {}).liq ?? 1e9) < 2000));
    if (idx < 0) idx = this.watch.findIndex(a => !held.has(a));
    if (idx < 0) idx = 0;
    this.watch.splice(idx, 1);
  },
  prune() { this.watch = this.watch.filter(a => { const t = this.tokens.get(a); return !(t && t.noPair > 3 && !this.heldAddrs().includes(a)); }); },
  num(v) { return v === undefined || v === null || Number.isNaN(+v) ? null : +v; },
  ingest(a, p) {
    const t = this.tokens.get(a) || this.blank(a, 'pairs'); this.tokens.set(a, t);
    const g = (o, k) => (o && o[k] !== undefined ? this.num(o[k]) : null);
    const price = this.num(p.priceUsd); if (!price) return null;
    /* garde anti-données périmées : une empreinte déjà vue (autre que la dernière) = réponse en retard, ignorée */
    const fp = [p.priceUsd, p.txns && p.txns.m5 && p.txns.m5.buys, p.txns && p.txns.m5 && p.txns.m5.sells, p.volume && p.volume.m5, p.liquidity && p.liquidity.usd].join('|');
    t.fps = t.fps || [];
    if (t.fps.length && t.fps[t.fps.length - 1] !== fp && t.fps.includes(fp)) { this.stats.stale = (this.stats.stale || 0) + 1; return null; }
    if (t.fps[t.fps.length - 1] !== fp) { t.fps.push(fp); if (t.fps.length > 16) t.fps.shift(); }
    Object.assign(t, {
      sym: '$' + String(p.baseToken.symbol || a.slice(0, 4)).replace(/^\$+/, '').slice(0, 12), name: p.baseToken.name || '',
      pair: p.pairAddress, dex: p.dexId || null, url: p.url || null, price,
      liq: g(p.liquidity, 'usd'), vol5: g(p.volume, 'm5'), vol1h: g(p.volume, 'h1'),
      b5: p.txns && p.txns.m5 ? this.num(p.txns.m5.buys) : null, s5: p.txns && p.txns.m5 ? this.num(p.txns.m5.sells) : null,
      c5: g(p.priceChange, 'm5'), c1h: g(p.priceChange, 'h1'), c24: g(p.priceChange, 'h24'),
      mcap: this.num(p.marketCap ?? p.fdv), created: this.num(p.pairCreatedAt), boosts: p.boosts ? this.num(p.boosts.active) : null,
      upd: Date.now(), noPair: 0,
    });
    const last = t.snaps[t.snaps.length - 1];
    if (!last || last.p !== price || Date.now() - last.t > 20000) {
      t.snaps.push({ t: Date.now(), p: price, liq: t.liq, vol5: t.vol5, b5: t.b5, s5: t.s5, c5: t.c5, c1h: t.c1h, created: t.created });
      if (t.snaps.length > 1500) t.snaps.splice(0, t.snaps.length - 1500);
    }
    return t;
  },
  reset() { this.tokens.clear(); this.watch = []; this.queue = []; this.events = []; this.fails = 0; this.offline = false; this.backoffUntil = 0; this.nextDisc = 0; },
};

/* ========================= Mode « offline practice » (prix synthétiques, sur choix explicite) ========================= */
const Practice = {
  last: 0, init: false,
  setup() {
    Feed.reset(); const r = U.rng(Date.now() | 0);
    for (let i = 0; i < 40; i++) {
      const a = 'SYNTH' + String(i).padStart(3, '0');
      const t = Feed.blank(a, 'synthetic'); t.synthetic = true; t.sym = '$SIM' + i; t.price = U.rr(r(), .00005, .02);
      t.liq = U.rr(r(), 5000, 250000); t.vol5 = U.rr(r(), 200, 20000); t.b5 = U.ri(r(), 5, 120); t.s5 = U.ri(r(), 5, 120);
      t.c5 = 0; t.c1h = U.rr(r(), -30, 60); t.created = Date.now() - U.rr(r(), 1, 96) * 3600e3; t.dex = 'synthetic'; t.vol = U.rr(r(), .004, .02); t.drift = U.rr(r(), -.0008, .0012); t.hist5 = [];
      Feed.tokens.set(a, t); Feed.watch.push(a);
    }
    this.r = r; this.init = true;
  },
  tick(now) {
    if (!this.init) this.setup();
    if (now - this.last < 1000 || !Sim.anyRunning()) return; this.last = now;
    const r = this.r, upd = [];
    Feed.watch.forEach(a => {
      const t = Feed.tokens.get(a);
      const z = (r() + r() + r() - 1.5) * 1.4; const jump = r() < .004 ? U.rr(r(), -.35, .45) : 0;
      t.price *= Math.exp(t.drift + t.vol * z + jump);
      t.hist5.push(t.price); if (t.hist5.length > 300) t.hist5.shift();
      t.c5 = (t.price / t.hist5[0] - 1) * 100;
      t.liq *= 1 + (r() - .5) * .01; t.vol5 = Math.max(50, t.vol5 * (1 + (r() - .5) * .2)); t.b5 = Math.max(0, Math.round(t.b5 + (r() - .5 + z * .2) * 6)); t.s5 = Math.max(0, Math.round(t.s5 + (r() - .5) * 6));
      t.upd = Date.now();
      t.snaps.push({ t: t.upd, p: t.price, liq: t.liq, vol5: t.vol5, b5: t.b5, s5: t.s5, c5: t.c5, c1h: t.c1h, created: t.created }); if (t.snaps.length > 1500) t.snaps.shift();
      upd.push(t);
    });
    Sim.onUpdate(upd);
  },
};

/* ========================= RULES : agents = modules de règles transparents ========================= */
const fmtK = v => (v === null || v === undefined ? 'n/a' : (v >= 1e6 ? '$' + (v / 1e6).toFixed(2) + 'M' : '$' + (v / 1000).toFixed(1) + 'k'));
const fmtP = (v, d = 1) => (v === null || v === undefined ? 'n/a' : (v >= 0 ? '+' : '') + v.toFixed(d) + '%');
const fmtPrice = p => (p === null || p === undefined ? 'n/a' : (p >= 1 ? p.toFixed(4) : p.toPrecision(4)));
const Rules = {
  /* momentum local : variation sur ≈ 60 s d'après nos propres relevés (n/a si historique insuffisant) */
  mom60(snaps, i = snaps.length - 1) {
    if (i < 1) return null; const t = snaps[i].t; let j = i - 1;
    while (j > 0 && t - snaps[j].t < 60000) j--;
    if (t - snaps[j].t < 40000) return null;
    return (snaps[i].p / snaps[j].p - 1) * 100;
  },
  impactPct(size, liq) { return liq ? 2 * size / liq * 100 : null; },
  /* évalue un candidat : renvoie les verdicts de chaque module avec les vraies valeurs */
  entry(s, mom, cfg, ctx) {
    const f = cfg.f, now = s.t;
    const ageH = s.created ? (now - s.created) / 3600e3 : null;
    const tx = s.b5 !== null && s.s5 !== null ? s.b5 + s.s5 : null;
    const buyR = tx ? s.b5 / tx : null;
    const M = {};
    /* SCANNER : données présentes, âge de la paire */
    const ageOk = !f.maxAgeH || (ageH !== null && ageH <= f.maxAgeH);
    M.scan = { ok: s.p > 0 && ageOk, txt: `age ${ageH === null ? 'n/a' : ageH.toFixed(1) + 'h'}${f.maxAgeH ? ' ≤ ' + f.maxAgeH + 'h' : ''}` };
    /* SAFETY : liquidité ; verrou LP et wallet dev : aucune donnée publique → n/a */
    M.safety = { ok: s.liq !== null && s.liq >= f.minLiq, txt: `LP ${fmtK(s.liq)} ${s.liq !== null && s.liq >= f.minLiq ? '≥' : '<'} ${fmtK(f.minLiq)} · lock n/a · dev n/a`, lock: 'na', dev: 'na' };
    /* FLOW (smart money / acheteurs) */
    M.flow = { ok: buyR !== null && buyR >= f.minBuy && tx >= f.minTx5 && s.vol5 !== null && s.vol5 >= f.minVol5,
      txt: `buys ${buyR === null ? 'n/a' : Math.round(buyR * 100) + '%'} of ${tx ?? 'n/a'} tx/5m · vol5m ${fmtK(s.vol5)}` };
    /* MOMENTUM (tendance) */
    M.mom = { ok: s.c5 !== null && s.c5 >= f.minChg5 && s.c5 <= f.maxChg5 && (s.c1h === null || s.c1h <= f.maxChg1h) && (mom === null || mom >= -0.5),
      txt: `5m ${fmtP(s.c5)} · 1h ${fmtP(s.c1h, 0)} · 60s ${fmtP(mom, 2)}` };
    /* ANALYST / DEBATE : score pondéré + votes bull/bear sur des faits */
    let sc = 0;
    sc += .30 * (buyR === null ? 0 : U.clamp((buyR - .45) / .25));
    sc += .25 * (s.c5 === null ? 0 : U.clamp(s.c5 / 5));
    sc += .15 * (mom === null ? .3 : U.clamp((mom + .5) / 2.5));
    sc += .15 * (s.vol5 === null ? 0 : U.clamp(s.vol5 / 10000));
    sc += .10 * (s.liq === null ? 0 : U.clamp(s.liq / 100000));
    if (f.early && ageH !== null && ageH < 24) sc += .05;
    const votes = [buyR !== null && buyR > .5, s.c5 !== null && s.c5 > 0, mom !== null && mom > 0, s.vol5 !== null && s.vol5 >= f.minVol5, s.liq !== null && s.liq >= f.minLiq];
    const bull = votes.filter(Boolean).length;
    M.analyst = { ok: sc >= f.minScore, score: sc, bull, bear: 5 - bull, txt: `score ${sc.toFixed(2)} ${sc >= f.minScore ? '≥' : '<'} ${f.minScore} · bull ${bull} / bear ${5 - bull}` };
    /* RISK : taille ≤ max % ; impact de prix estimé (2 × taille / liquidité) */
    const size = Math.min(ctx.equity * cfg.maxPct / 100, ctx.cash);
    const imp = this.impactPct(size, s.liq);
    M.risk = { ok: size >= 1 && ctx.open < cfg.maxPos && imp !== null && imp <= f.maxImpact, size, imp,
      txt: `size ${U.usd(size)} (${cfg.maxPct}%) · impact ${imp === null ? 'n/a' : imp.toFixed(2) + '%'} · ${ctx.open}/${cfg.maxPos} open` };
    const order = ['scan', 'safety', 'flow', 'mom', 'analyst', 'risk'];
    const fail = order.find(k => !M[k].ok);
    return { ok: !fail, fail, M, size, buyR, ageH, score: sc };
  },
  /* modèle d'exécution papier : frais par côté + frais réseau + glissement (base + impact) */
  fillBuy(p, size, liq, cfg) { const slip = cfg.baseSlip + (this.impactPct(size, liq) || 0); const fee = size * cfg.feePct / 100 + cfg.netFee; const px = p * (1 + slip / 100); return { px, qty: (size - fee) / px, fee, slip }; },
  fillSell(p, qty, liq, cfg) { const gross0 = qty * p; const slip = cfg.baseSlip + (this.impactPct(gross0, liq) || 0); const px = p * (1 - slip / 100); const gross = qty * px; const fee = gross * cfg.feePct / 100 + cfg.netFee; return { px, net: gross - fee, fee, slip }; },
  /* sortie : stop, take profit fixe ou trailing, sortie temporelle, liquidité retirée */
  exit(pos, s, cfg) {
    const val = this.fillSell(s.p, pos.qty, s.liq, cfg).net;
    const r = (val / pos.size - 1) * 100;
    pos.peakP = Math.max(pos.peakP || pos.entryP, s.p);
    const peakR = (pos.peakP / pos.entryP - 1) * 100;
    const ageMin = (s.t - pos.openMs) / 60000;
    if (r <= -cfg.stop) return { why: `stop -${cfg.stop}%`, r };
    if (s.liq !== null && pos.entryLiq && s.liq < pos.entryLiq * .5) return { why: `liquidity pulled ${fmtK(s.liq)}`, r };
    if (cfg.trailOn) { if (peakR >= cfg.trailAct && s.p <= pos.peakP * (1 - cfg.trailPct / 100)) return { why: `trailing TP (peak ${fmtP(peakR)}, -${cfg.trailPct}% from peak)`, r }; }
    else if (r >= cfg.tp) return { why: `take profit +${cfg.tp}%`, r };
    if (cfg.timeExit && ageMin >= cfg.timeExit) return { why: `time exit ${cfg.timeExit}m`, r };
    return null;
  },
};

/* ========================= SESSION : portefeuille papier d'une scène ========================= */
class PaperSession {
  constructor(key, cfg) { this.key = key; this.cfg = cfg; this.reset(); }
  reset() {
    const c = this.cfg;
    Object.assign(this, {
      state: 'idle', reason: '', cash: c.stake, pos: [], closed: [], hist: [[0, c.stake]], log: [], events: [], seq: 0,
      elapsed: 0, fees: 0, slipCost: 0, evals: 0, rejects: 0, calls: { scan: 0, safety: 0, flow: 0, mom: 0, analyst: 0, risk: 0, exec: 0, exit: 0 },
      peak: c.stake, minEq: c.stake, maxDD: 0, cooldown: {}, lastSkip: {}, startMs: null, endMs: null, uid: 0, sampleAt: 0, lastMod: 'scan', mode: Feed.mode,
    });
  }
  emit(ev) { ev.seq = ++this.seq; ev.ms = ev.ms || Date.now(); this.events.push(ev); if (this.events.length > 300) this.events.shift(); this.log.unshift(ev); if (this.log.length > 300) this.log.pop(); }
  since(seq) { return this.events.filter(e => e.seq > seq); }
  tok(a) { return Feed.tokens.get(a); }
  posValue(p) { const t = this.tok(p.addr); const px = t && t.price ? t.price : p.lastP || p.entryP; return Rules.fillSell(px, p.qty, t ? t.liq : p.entryLiq, this.cfg).net; }
  equity() { return this.cash + this.pos.reduce((s, p) => s + this.posValue(p), 0); }
  wins() { return this.closed.filter(t => t.pnl >= 0).length; }
  losses() { return this.closed.filter(t => t.pnl < 0).length; }
  start() {
    if (this.state === 'ended') return;
    if (this.state === 'idle') { this.startMs = Date.now(); this.mode = Feed.mode; this.emit({ kind: 'info', txt: `session start · ${T2.presets[this.cfg.preset]} · stake ${U.usd(this.cfg.stake)} · ${this.cfg.dur} min · ${Feed.mode === 'live' ? 'real DexScreener data' : 'SYNTHETIC practice prices'}` }); }
    else this.emit({ kind: 'info', txt: 'session resumed' });
    this.state = 'running'; this.reason = '';
  }
  pause(reason = 'paused by user') { if (this.state !== 'running') return; this.state = 'paused'; this.reason = reason; this.emit({ kind: 'info', txt: reason }); }
  stop(reason = 'stopped by user') {
    if (this.state === 'idle' || this.state === 'ended') return;
    this.pos.slice().forEach(p => { const t = this.tok(p.addr); this.close(p, t && t.price ? { p: t.price, liq: t.liq, t: Date.now() } : { p: p.lastP || p.entryP, liq: p.entryLiq, t: Date.now() }, 'session end · ' + (t && t.price ? 'last real price' : 'last known price')); });
    this.state = 'ended'; this.reason = reason; this.endMs = Date.now();
    this.emit({ kind: 'info', txt: 'session ended · ' + reason });
    Sim.recordHistory(this);
  }
  tick(dtMs) {
    if (this.state !== 'running') return;
    this.elapsed += dtMs;
    if (this.elapsed >= this.sampleAt) { this.sampleAt = this.elapsed + 5000; this.sample(); }
    if (this.elapsed >= this.cfg.dur * 60000) this.stop('duration reached');
  }
  sample() {
    const e = this.equity(); this.hist.push([this.elapsed, e]); if (this.hist.length > 4000) this.hist.splice(1, this.hist.length - 4000);
    this.peak = Math.max(this.peak, e); this.minEq = Math.min(this.minEq, e); this.maxDD = Math.max(this.maxDD, (this.peak - e) / this.peak * 100);
  }
  /* appelé à chaque rafraîchissement réel de tokens */
  onUpdate(toks) {
    if (this.state !== 'running') return;
    const now = Date.now();
    toks.forEach(t => {
      if (t.synthetic !== (this.mode === 'practice')) return;
      const s = t.snaps[t.snaps.length - 1]; if (!s || now - s.t > 15000) return;
      const held = this.pos.find(p => p.addr === t.addr);
      if (held) {
        held.lastP = t.price; this.calls.exit++;
        const ex = Rules.exit(held, s, this.cfg); if (ex) this.close(held, s, ex.why);
        return;
      }
      if (this.cooldown[t.addr] && now < this.cooldown[t.addr]) return;
      const eq = this.equity();
      const res = Rules.entry(s, Rules.mom60(t.snaps), this.cfg, { equity: eq, cash: this.cash, open: this.pos.length });
      this.evals++;
      const order = ['scan', 'safety', 'flow', 'mom', 'analyst', 'risk'];
      for (const k of order) { this.calls[k]++; if (k === res.fail) break; }
      this.lastMod = res.fail || 'exec';
      if (!res.ok) {
        this.rejects++;
        const ls = this.lastSkip[t.addr];
        if (!ls || ls.mod !== res.fail || now - ls.ms > 90000) { this.lastSkip[t.addr] = { mod: res.fail, ms: now }; this.emit({ kind: 'skip', sym: t.sym, addr: t.addr, mod: res.fail, txt: res.M[res.fail].txt, res }); }
        return;
      }
      this.open(t, s, res);
    });
    this.sample();
  }
  open(t, s, res) {
    const f = Rules.fillBuy(s.p, res.size, s.liq, this.cfg);
    this.cash -= res.size; this.fees += f.fee; this.slipCost += res.size * f.slip / 100; this.calls.exec++;
    const p = { id: ++this.uid, addr: t.addr, sym: t.sym, pair: t.pair, dex: t.dex, url: t.url, openMs: s.t, entryP: s.p, fillP: f.px, qty: f.qty, size: res.size, feeIn: f.fee, slipIn: f.slip, entryLiq: s.liq, peakP: s.p, lastP: s.p,
      reasons: ['scan', 'safety', 'flow', 'mom', 'analyst', 'risk'].map(k => res.M[k].txt).join(' | '), score: res.score, bull: res.M.analyst.bull, bear: res.M.analyst.bear, buyR: res.buyR };
    this.pos.push(p);
    this.emit({ kind: 'buy', sym: t.sym, addr: t.addr, size: res.size, price: s.p, fill: f.px, slip: f.slip, fee: f.fee, res, txt: `BUY ${t.sym} ${U.usd(res.size)} @ ${fmtPrice(f.px)} (mkt ${fmtPrice(s.p)}, slip ${f.slip.toFixed(2)}%)` });
  }
  close(p, s, why) {
    const f = Rules.fillSell(s.p, p.qty, s.liq, this.cfg);
    this.cash += f.net; this.fees += f.fee; this.slipCost += p.qty * s.p * f.slip / 100; this.calls.exec++;
    this.pos.splice(this.pos.indexOf(p), 1);
    const pnl = f.net - p.size;
    const tr = Object.assign({}, p, { closeEl: this.elapsed, closeMs: s.t || Date.now(), exitP: s.p, exitFill: f.px, feeOut: f.fee, slipOut: f.slip, proceeds: f.net, pnl, pnlPct: pnl / p.size * 100, why });
    this.closed.push(tr); if (this.closed.length > 1000) this.closed.shift();
    this.cooldown[p.addr] = Date.now() + this.cfg.cooldown * 60000;
    this.emit({ kind: 'sell', sym: p.sym, addr: p.addr, pnl, pnlPct: tr.pnlPct, why, price: s.p, txt: `SOLD ${p.sym} ${U.sUsd(pnl)} (${fmtP(tr.pnlPct)}) · ${why}` });
  }
  summary() {
    const e = this.equity(), cl = this.closed, w = this.wins();
    const best = cl.reduce((a, b) => (!a || b.pnl > a.pnl ? b : a), null), worst = cl.reduce((a, b) => (!a || b.pnl < a.pnl ? b : a), null);
    return { key: this.key, mode: this.mode, preset: this.cfg.preset, start: this.startMs, end: this.endMs || Date.now(), stake: this.cfg.stake, final: e, pnl: e - this.cfg.stake, pnlPct: (e / this.cfg.stake - 1) * 100,
      trades: cl.length, wins: w, losses: cl.length - w, winRate: cl.length ? w / cl.length * 100 : null, maxDD: this.maxDD, fees: this.fees, slip: this.slipCost,
      coins: new Set(cl.map(t => t.addr)).size, best: best ? [best.sym, best.pnl] : null, worst: worst ? [worst.sym, worst.pnl] : null, minutes: this.elapsed / 60000 };
  }
  serialize() { const o = {}; ['key', 'cfg', 'state', 'reason', 'cash', 'pos', 'closed', 'hist', 'elapsed', 'fees', 'slipCost', 'evals', 'rejects', 'calls', 'peak', 'minEq', 'maxDD', 'cooldown', 'startMs', 'endMs', 'uid', 'mode'].forEach(k => { o[k] = this[k]; }); o.log = this.log.slice(0, 60).map(e => ({ kind: e.kind, sym: e.sym, txt: e.txt, pnl: e.pnl, ms: e.ms, mod: e.mod })); return o; }
  restore(o) { Object.assign(this, o); this.events = []; this.seq = 0; this.lastSkip = {}; this.sampleAt = this.elapsed; if (this.state === 'running') { this.state = 'paused'; this.reason = 'restored after reload — press Resume'; } }
}

/* ========================= SIM : gestionnaire des 3 sessions ========================= */
const Sim = {
  s: {}, history: [],
  init() { ['A', 'B', 'C'].forEach(k => { this.s[k] = new PaperSession(k, defaultCfg(k)); }); },
  all() { return Object.values(this.s); },
  anyRunning() { return this.all().some(x => x.state === 'running'); },
  onUpdate(toks) { this.all().forEach(x => x.onUpdate(toks)); },
  onOffline() { this.all().forEach(x => x.pause('data feed offline — paused')); SimUI.banner(T2.offline, true); },
  onFeedBack() { SimUI.banner(T2.feedBack, true); setTimeout(() => SimUI.banner('', false), 8000); },
  tick(dtMs) { this.all().forEach(x => x.tick(dtMs)); },
  recordHistory(x) { this.history.unshift(x.summary()); if (this.history.length > 50) this.history.pop(); SimStore.save(); },
};

/* ========================= BACKTEST : réglage sur les données réelles enregistrées ========================= */
/* Rejoue les mêmes règles sur les relevés de prix collectés pendant la session (in-sample : risque de sur-ajustement). */
const Backtest = {
  data(mode) {
    const toks = [...Feed.tokens.values()].filter(t => t.snaps.length > 3 && t.synthetic === (mode === 'practice'));
    const ev = []; toks.forEach((t, ti) => t.snaps.forEach((s, si) => ev.push([s.t, ti, si])));
    ev.sort((a, b) => a[0] - b[0]);
    return { toks, ev, span: ev.length ? (ev[ev.length - 1][0] - ev[0][0]) / 60000 : 0, snaps: ev.length };
  },
  run(cfg, D) {
    let cash = cfg.stake, peak = cfg.stake, maxDD = 0, fees = 0; const pos = new Map(), cd = new Map(), closed = [], lastP = new Map();
    const val = (ti, p) => { const s = lastP.get(ti); return Rules.fillSell(s.p, p.qty, s.liq, cfg).net; };
    const eqf = () => cash + [...pos.entries()].reduce((a, [ti, p]) => a + val(ti, p), 0);
    let k = 0;
    for (const [t, ti, si] of D.ev) {
      const tok = D.toks[ti], s = tok.snaps[si]; lastP.set(ti, s);
      const p = pos.get(ti);
      if (p) { const ex = Rules.exit(p, s, cfg); if (ex) { const f = Rules.fillSell(s.p, p.qty, s.liq, cfg); cash += f.net; fees += f.fee; closed.push(f.net - p.size); pos.delete(ti); cd.set(ti, t + cfg.cooldown * 60000); } }

      const a = b.dataset.a;
      if (a === 'close') this.togglePanel(false);
      if (a === 'start') { if (Feed.offline && Feed.mode === 'live') { Feed.offline = false; Feed.fails = 0; this.banner('', false); } x.start(); if (SimApp.scene === 'trading' && innerWidth < 1500) this.togglePanel(false); }
      if (a === 'pause') { if (x.state === 'running') x.pause(); else if (x.state === 'paused') x.start(); }
      if (a === 'stop') x.stop();
      if (a === 'reset') { x.reset(); SimApp.view().reset(); }
      if (a === 'csv') exportCSV([x.key]);
      if (a === 'csvall') exportCSV(['A', 'B', 'C']);
      if (a === 'tune') this.tune();
      if (a === 'apply' && this.best) { const keep = { stake: x.cfg.stake, dur: x.cfg.dur, target: x.cfg.target }; x.cfg = Object.assign(JSON.parse(JSON.stringify(this.best.cfg)), keep); this.renderFields(); }
      SimStore.save(); this.refresh();
    });
    this.p.src.addEventListener('change', e => {
      if (Sim.all().some(s => s.state === 'running' || s.state === 'paused')) { e.target.value = Feed.mode; alert('Stop or reset all sessions before changing the data source.'); return; }
      Feed.mode = e.target.value; Feed.reset(); Practice.init = false; Sim.all().forEach(s => { if (s.state !== 'ended') s.mode = Feed.mode; }); this.refresh(); SimStore.save();
    });
    this.p.fields.addEventListener('input', e => this.onField(e)); this.p.fields.addEventListener('change', e => this.onField(e));
  },
  onField(e) {
    const el = e.target, k = el.dataset.k; if (!k) return; const x = SimApp.sess();
    if (k === 'preset') { const keep = { stake: x.cfg.stake, dur: x.cfg.dur, target: x.cfg.target, feePct: x.cfg.feePct, netFee: x.cfg.netFee, baseSlip: x.cfg.baseSlip }; x.cfg = Object.assign(defaultCfg(x.key, el.value), keep); this.renderFields(); SimStore.save(); return; }
    const v = el.type === 'checkbox' ? el.checked : parseFloat(el.value); if (el.type !== 'checkbox' && !Number.isFinite(v)) return;
    setP(x.cfg, k, v); if (k === 'stake' && x.state === 'idle') { x.cash = v; x.hist = [[0, v]]; x.peak = x.minEq = v; } SimStore.save();
  },
  renderFields() {
    const x = SimApp.sess(), c = x.cfg, locked = x.state !== 'idle';
    this.p.fields.innerHTML = FIELDS.map(([k, lab, type, lock]) => {
      if (k === '#') return `<div class="sec">${lab}</div>`;
      if (type === 'preset') return `<label class="fl">${lab}<select data-k="preset">${Object.keys(PRESETS).map(p => `<option value="${p}" ${c.preset === p ? 'selected' : ''}>${T2.presets[p]}</option>`).join('')}</select></label>`;
      if (type === 'bool') return `<label class="fl ck"><input type="checkbox" data-k="${k}" ${getP(c, k) ? 'checked' : ''}> ${lab}</label>`;
      return `<label class="fl">${lab}<input type="number" step="any" data-k="${k}" value="${getP(c, k)}" ${lock && locked ? 'disabled' : ''}></label>`;
    }).join('') + `<div class="note">Stake and duration lock once the session starts. Risk, costs and filters apply live to new decisions.</div>`;
  },
  refresh() {
    const x = SimApp.sess(); if (!x || !this.p) return;
    const names = { A: 'Scene A · Trading dashboard', B: 'Scene B · GMGN mode', C: 'Scene C · Meme mode' };
    U.text(this.p.title, names[x.key]); U.text(this.p.st, x.state.toUpperCase() + (x.reason && x.state !== 'running' ? ' · ' + x.reason : ''));
    this.p.src.value = Feed.mode;
    const sb = this.P.querySelector('[data-a="start"]'); sb.textContent = x.state === 'paused' ? T2.resume : T2.start; sb.disabled = x.state === 'running' || x.state === 'ended';
    this.P.querySelector('[data-a="pause"]').textContent = T2.pause;
    this.P.querySelector('[data-a="pause"]').disabled = x.state !== 'running';
    /* avertissement adapté à la source de données */
    U.text(this.P.querySelector('.honest'), Feed.mode === 'practice' ? 'OFFLINE PRACTICE: synthetic prices generated in your browser — NOT real market data, results mean nothing for real trading. Fictional wallet, no keys, no real orders.' : 'Paper simulation. Real public market data (read-only), fictional wallet. No wallet connection, no keys, no real orders — ever.');
    this.P.querySelector('[data-a="stop"]').disabled = !(x.state === 'running' || x.state === 'paused');
    document.getElementById('qStart').textContent = x.state === 'running' ? 'Pause' : (x.state === 'paused' ? 'Resume' : (x.state === 'ended' ? 'Ended' : 'Start'));
    document.querySelectorAll('#chip [data-s]').forEach(b => b.classList.toggle('act', b.dataset.s === SimApp.scene));
    const fields = this.p.fields.querySelectorAll('input[data-k="stake"],input[data-k="dur"]'); fields.forEach(f => { f.disabled = x.state !== 'idle'; });
    U.html(this.p.hist, Sim.history.slice(0, 10).map(h => `<div class="hrow"><b>${h.key}</b> ${new Date(h.start).toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' })} · ${T2.presets[h.preset]}${h.mode === 'practice' ? ' · SYNTHETIC' : ''}<br>${U.usd(h.stake)} → ${U.usd(h.final)} (<span class="${h.pnl >= 0 ? 'g' : 'r'}">${fmtP(h.pnlPct)}</span>) · ${h.trades} trades · win ${h.winRate === null ? 'n/a' : Math.round(h.winRate) + '%'} · max DD -${h.maxDD.toFixed(1)}% · ${h.minutes.toFixed(0)} min</div>`).join('') || '<div class="hrow">no finished sessions yet</div>');
    const mb = document.getElementById('modeBadge');
    mb.innerHTML = Feed.mode === 'practice' ? `<span class="dot demo"></span>${T2.badgePractice}` : `<span class="dot ${Feed.offline ? 'demo' : ''}"></span>${T2.badgeLive}`;
  },
  feedStatus() {
    const s = Feed.stats, x = SimApp.sess();
    const age = s.lastOk ? Math.round((Date.now() - s.lastOk) / 1000) + 's ago' : 'never';
    U.html(this.p.feed, Feed.mode === 'practice' ? `<b>OFFLINE PRACTICE</b> · ${Feed.watch.length} synthetic tokens · prices are generated, not real`
      : `<b>DexScreener</b> ${Feed.offline ? '<span class="r">OFFLINE</span>' : (Feed.fails ? `<span class="r">backoff (${Feed.fails})</span>` : '<span class="g">ok</span>')} · requests ${s.req} · ok ${s.ok} · errors ${s.err} (429: ${s.r429}) · stale dropped ${s.stale} · last ok ${age}<br>watched ${Feed.watch.length} · known ${Feed.tokens.size} · ${x.pos.length} open here · rule checks ${U.int(x.evals)}${s.lastErr ? '<br>last error: ' + U.esc(s.lastErr) : ''}`);
  },
  tune() {
    const x = SimApp.sess(); const t0 = performance.now(); const g = Backtest.grid(x.key, x.cfg); const ms = performance.now() - t0;
    if (!g.out.length) { U.html(this.p.tune, `Not enough recorded data yet (${g.D.snaps} price snapshots). Run a session for a few minutes first.`); return; }
    this.best = g.out[0];
    const row = o => `<tr><td>${U.esc(o.label)}</td><td class="${o.r.ret >= 0 ? 'g' : 'r'}">${fmtP(o.r.ret)}</td><td>-${o.r.maxDD.toFixed(1)}%</td><td>${o.r.trades}</td><td>${o.r.winRate === null ? 'n/a' : Math.round(o.r.winRate) + '%'}</td></tr>`;
    U.html(this.p.tune, `<div class="note">${g.out.length} variants replayed on ${U.int(g.D.snaps)} real snapshots of ${g.D.toks.length} tokens over ${g.D.span.toFixed(1)} min (${ms.toFixed(0)} ms). In-sample result: short window, overfitting likely — not a forecast.</div>
      <table><tr><th>variant</th><th>return</th><th>max DD</th><th>trades</th><th>win</th></tr>${g.out.slice(0, 6).map(row).join('')}<tr><td colspan="5" class="sub">presets with defaults</td></tr>${g.presets.map(row).join('')}<tr><td colspan="5" class="sub">worst variant</td></tr>${row(g.out[g.out.length - 1])}</table>`);
    this.P.querySelector('[data-a="apply"]').disabled = false;
    this.lastTune = g;
  },
  togglePanel(on) { const P = document.getElementById('panel'); const v = on === undefined ? !P.classList.contains('show') : on; P.classList.toggle('show', v); document.body.classList.toggle('panel-open', v); SimApp.layout(); },
  banner(txt, on) { const b = document.getElementById('banner'); if (txt) b.textContent = txt; b.classList.toggle('show', on); },
  recapHTML(x, theme) {
    const s = x.summary(), mul = (s.final / s.stake).toFixed(2);
    const best = s.best ? `${VIS.av(s.best[0], 'sm')}<span>${U.esc(s.best[0])}</span><span class="${s.best[1] >= 0 ? 'pos' : 'neg'}">${U.sUsd(s.best[1])}</span>` : '<span class="g">n/a</span>';
    const worst = s.worst ? `${VIS.av(s.worst[0], 'sm')}<span>${U.esc(s.worst[0])}</span><span class="${s.worst[1] >= 0 ? 'pos' : 'neg'}">${U.sUsd(s.worst[1])}</span>` : '<span class="g">n/a</span>';
    return `${theme === 'dark' ? '' : '<div class="handle"></div>'}
      <div class="rc-h">${VIS.logo()}<div><div class="rc-t">${s.minutes >= 60 ? (s.minutes / 60).toFixed(1) + 'h' : Math.round(s.minutes) + ' min'} paper recap</div><div class="rc-s">grok bot × ${x.mode === 'practice' ? 'SYNTHETIC prices' : 'DexScreener data'} · ${hhmmOf(s.start)} → ${hhmmOf(s.end)} · ${T2.presets[s.preset]}</div></div></div>
      <div class="rc-l">put in</div><div class="rc-big">${U.usd(s.stake)}</div>
      <div class="rc-l">now worth</div><div class="rc-now"><div class="rc-big ${s.pnl >= 0 ? '' : 'negv'}">${U.usd(s.final)}</div><span class="mulpill">${mul}×</span></div>
      <div class="tiles"><div class="tilex"><div class="k">trades</div><div class="v">${s.trades}</div></div><div class="tilex"><div class="k">coins</div><div class="v">${s.coins}</div></div><div class="tilex"><div class="k">win rate</div><div class="v">${s.winRate === null ? 'n/a' : Math.round(s.winRate) + '%'}</div></div><div class="tilex"><div class="k">max DD</div><div class="v">${s.maxDD.toFixed(1)}%</div></div></div>
      <div class="rc-lines"><div class="ln"><span class="g">best</span>${best}</div><div class="ln"><span class="g">worst</span>${worst}</div>
      <div class="ln">P&amp;L ${U.sUsd(s.pnl)} (${fmtP(s.pnlPct)}) · stop -${x.cfg.stop}% on every trade</div><div class="ln g">fees ${U.usd(s.fees)} · slippage ${U.usd(s.slip)} · ${x.reason}</div></div>
      <div class="cta" onclick="exportCSV(['${x.key}'])">export trades (CSV)</div>
      <div class="demo-note">paper simulation — no wallet is connected, no real order was sent</div>`;
  },
};

/* ========================= APP : routeur, cadrage, boucle unique ========================= */
const SimApp = {
  scene: 'trading', last: 0, saveAt: 0, feedAt: 0,
  init() {
    Sim.init();
    const st = SimStore.load();
    if (st.feedMode === 'practice') Feed.mode = 'practice';
    if (Array.isArray(st.history)) Sim.history = st.history;
    if (st.sessions) Object.entries(st.sessions).forEach(([k, o]) => { if (Sim.s[k] && o && o.cfg) { try { Sim.s[k].restore(o); } catch (e) { Sim.s[k].reset(); } } });
    this.views = { trading: SimA, gmgn: new SimPhone('B'), meme: new SimPhone('C') };
    this.keys = { trading: 'A', gmgn: 'B', meme: 'C' };
    SimA.build(document.getElementById('sceneA')); this.views.gmgn.build(document.getElementById('sceneB')); this.views.meme.build(document.getElementById('sceneC'));
    Object.values(this.views).forEach(v => v.reset());
    SimUI.build();
    const h = location.hash.slice(1); const start = this.keys[h] ? h : (this.keys[st.scene] ? st.scene : 'trading');
    addEventListener('hashchange', () => { const n = location.hash.slice(1); if (this.keys[n] && n !== this.scene) this.setScene(n); });
    addEventListener('resize', () => this.layout());
    addEventListener('keydown', e => { if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return; if (e.code === 'Space') { e.preventDefault(); this.toggle(); } if (e.key === '1') location.hash = '#trading'; if (e.key === '2') location.hash = '#gmgn'; if (e.key === '3') location.hash = '#meme'; });
    if (location.hash.slice(1) !== start) history.replaceState(null, '', '#' + start);
    this.setScene(start);
    SimUI.togglePanel(innerWidth >= 1000);
    requestAnimationFrame(t => { this.last = t; requestAnimationFrame(n => this.loop(n)); });
  },
  sess() { return Sim.s[this.keys[this.scene]]; },
  view() { return this.views[this.scene]; },
  toggle() { const x = this.sess(); if (x.state === 'running') x.pause(); else if (x.state !== 'ended') x.start(); SimUI.refresh(); },
  setScene(n) {
    this.scene = n; document.body.dataset.scene = n;
    ['A', 'B', 'C'].forEach((k, i) => document.getElementById('scene' + k).classList.toggle('on', ['trading', 'gmgn', 'meme'][i] === n));
    this.layout(); SimUI.renderFields(); SimUI.refresh(); SimStore.save();
  },
  layout() {
    const vw = innerWidth, vh = innerHeight, mobile = vw < 600, panel = document.body.classList.contains('panel-open') && vw >= 1000;
    document.body.classList.toggle('mobile', mobile);
    let unit;
    if (this.scene === 'trading') { unit = Math.min(vw - (panel ? 360 : 0), vh * 4 / 3) / 960; }
    else {
      const ip = this.scene === 'meme'; let fw, fh;
      if (mobile) { fw = vw; fh = vh; } else { const ratio = ip ? 19.5 / 9 : 16 / 9; fh = Math.min(390 * ratio, vh - 48); fw = fh / ratio; }
      const v = this.view(); v.r.phone.style.setProperty('--fw', fw + 'px'); v.r.phone.style.setProperty('--fh', fh + 'px'); v.tapeW = 0; unit = fw / 540;
    }
    document.querySelectorAll('.stage').forEach(s => { s.style.paddingRight = panel ? '360px' : '0'; });
    document.documentElement.style.fontSize = unit + 'px'; document.documentElement.style.setProperty('--u', unit + 'px');
  },
  /* une seule boucle requestAnimationFrame */
  loop(now) {
    const dt = Math.min(250, Math.max(0, now - this.last)); this.last = now;
    try {
      Sim.tick(dt); Feed.tick(now);
      this.view().render(now);
      for (const n of Num.all) n.step(now);
      if (now > this.feedAt) { this.feedAt = now + 500; SimUI.feedStatus(); SimUI.refresh(); }
      if (now > this.saveAt) { this.saveAt = now + 5000; SimStore.save(); }
    } catch (err) { console.error(err); }
    requestAnimationFrame(n => this.loop(n));
  },
};
document.addEventListener('DOMContentLoaded', () => SimApp.init());

</script>
</body>
